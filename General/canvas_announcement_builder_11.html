
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canvas Announcement Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --ink:#1C1917;
  --ink2:#57534E;
  --ink3:#A8A29E;
  --paper:#FAFAF9;
  --paper2:#F5F5F4;
  --paper3:#E7E5E4;
  --accent:#B45309;
  --accent-light:#FEF3C7;
  --accent-mid:#D97706;
  --green:#065F46;
  --green-light:#D1FAE5;
  --blue:#1E40AF;
  --blue-light:#DBEAFE;
  --purple:#5B21B6;
  --purple-light:#EDE9FE;
  --danger:#991B1B;
  --danger-light:#FEE2E2;
  --radius:10px;
  --radius-sm:6px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 6px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.04);
}

body{
  font-family:'DM Sans',sans-serif;
  background:var(--paper);
  color:var(--ink);
  font-size:15px;
  line-height:1.6;
  min-height:100vh;
}

.layout{display:flex;min-height:100vh}

/* ── Sidebar ── */
.sidebar{
  width:220px;
  flex-shrink:0;
  background:#1C1917;
  color:#D6D3D1;
  padding:28px 0;
  display:flex;
  flex-direction:column;
  position:fixed;
  top:0;left:0;bottom:0;
}
.sidebar-brand{padding:0 22px 28px;border-bottom:1px solid #292524}
.sidebar-brand h1{font-family:'Lora',serif;font-size:16px;color:#FAFAF9;font-weight:600;line-height:1.3}
.sidebar-brand p{font-size:11px;color:#78716C;margin-top:3px}
.sidebar-nav{padding:20px 0;flex:1}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 22px;font-size:13px;font-weight:500;
  color:#A8A29E;cursor:pointer;transition:all .15s;
  border-left:2px solid transparent;
}
.nav-item.active{color:#FAFAF9;border-left-color:#D97706;background:rgba(217,119,6,.1)}
.nav-item.done{color:#78716C}
.nav-item.done .nav-check{color:#65A30D}
.nav-num{width:20px;height:20px;border-radius:50%;background:#292524;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.nav-item.active .nav-num{background:#D97706;color:#fff}
.nav-item.done .nav-num{background:#292524;color:#65A30D}
.sidebar-footer{padding:20px 22px;border-top:1px solid #292524;font-size:11px;color:#57534E;line-height:1.5}

/* ── Main ── */
.main{margin-left:220px;flex:1;padding:40px 48px;max-width:820px}
.step-header{margin-bottom:28px}
.step-header h2{font-family:'Lora',serif;font-size:24px;font-weight:600;color:var(--ink);margin-bottom:6px}
.step-header p{font-size:14px;color:var(--ink2)}

/* ── Cards ── */
.card{background:#fff;border:1px solid var(--paper3);border-radius:var(--radius);padding:22px 24px;margin-bottom:16px;box-shadow:var(--shadow)}
.card-label{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px}

/* ── Date inputs ── */
.date-row{display:flex;gap:10px;margin-bottom:6px}
.date-field{flex:1}
.date-field label{display:block;font-size:11px;font-weight:600;color:var(--ink3);margin-bottom:5px;letter-spacing:.04em;text-transform:uppercase}
.date-field input{width:100%;padding:10px 12px;border:1px solid var(--paper3);border-radius:var(--radius-sm);font-size:16px;font-family:'DM Sans',sans-serif;color:var(--ink);background:#fff;text-align:center;transition:border-color .15s}
.date-field input:focus{outline:none;border-color:var(--accent-mid)}
.date-field.wide{flex:2}

/* ── Date preview ── */
.date-preview{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.preview-week{background:var(--paper2);border-radius:var(--radius-sm);padding:8px 12px}
.preview-week strong{display:block;font-size:11px;font-weight:600;color:var(--ink3);margin-bottom:2px;text-transform:uppercase;letter-spacing:.04em}
.preview-week span{font-size:13px;color:var(--ink)}

/* ── Week grid ── */
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.week-btn{padding:9px 4px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;background:var(--paper2);color:var(--ink2);border:1px solid var(--paper3);cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif}
.week-btn:hover{border-color:var(--accent-mid);color:var(--accent)}
.week-btn.sel{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}

.topic-pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-light);color:var(--accent);border-radius:20px;padding:5px 14px;font-size:13px;font-weight:500;margin-bottom:18px}

/* ── Option cards ── */
.option-card{border:1px solid var(--paper3);border-radius:var(--radius);padding:13px 16px;margin-bottom:8px;cursor:pointer;transition:all .15s;background:#fff}
.option-card:hover{border-color:var(--paper3);box-shadow:var(--shadow)}
.option-card.sel{border-width:2px}
.option-title{font-size:14px;font-weight:600;margin-bottom:2px}
.option-desc{font-size:12px;color:var(--ink2)}

/* ── Form elements ── */
textarea,input[type=text]{
  width:100%;font-size:14px;border-radius:var(--radius-sm);
  border:1px solid var(--paper3);padding:10px 12px;
  font-family:'DM Sans',sans-serif;color:var(--ink);background:#fff;
  transition:border-color .15s;resize:vertical;line-height:1.6
}
textarea:focus,input[type=text]:focus{outline:none;border-color:var(--accent-mid)}

/* ── Deadline rows ── */
.dl-header{display:grid;grid-template-columns:115px 95px 1fr;gap:8px;margin-bottom:6px}
.dl-header div{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--ink3)}
.dl-row{display:grid;grid-template-columns:115px 95px 1fr;gap:8px;margin-bottom:9px;align-items:start}

/* ── Buttons ── */
.btn-primary{font-size:14px;font-weight:600;padding:10px 24px;border-radius:var(--radius-sm);background:var(--ink);color:#fff;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;transition:opacity .15s}
.btn-primary:hover{opacity:.88}
.btn-primary:disabled{opacity:.3;cursor:not-allowed}
.btn-outline{font-size:14px;font-weight:500;padding:10px 22px;border-radius:var(--radius-sm);background:#fff;color:var(--ink);border:1px solid var(--paper3);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.btn-outline:hover{border-color:var(--ink2)}
.btn-back{font-size:13px;color:var(--ink3);background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;padding:4px 0}
.btn-back:hover{color:var(--ink)}
.btn-regen{font-size:13px;color:var(--ink2);background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;padding:4px 0}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:20px}

/* ── Waiting / paste box ── */
.waiting-box{background:var(--accent-light);border:1px solid #FDE68A;border-radius:var(--radius);padding:18px 20px;margin:16px 0}
.waiting-box h3{font-size:14px;font-weight:600;color:var(--accent);margin-bottom:6px}
.waiting-box p{font-size:13px;color:#78350F;line-height:1.6;margin-bottom:12px}
.waiting-box ol{font-size:13px;color:#78350F;padding-left:18px;line-height:2}
.paste-area{width:100%;font-size:12px;border-radius:var(--radius-sm);border:1.5px dashed #D97706;padding:10px 12px;font-family:monospace;color:var(--ink);background:#fff;resize:vertical;min-height:80px;margin-top:10px}
.paste-area:focus{outline:none;border-color:var(--accent)}

/* ── Review ── */
.review-pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 12px;border-radius:20px;margin-bottom:10px}
.review-hint{font-size:11px;color:var(--ink3);margin-top:4px}

/* ── Export ── */
.export-title{font-family:'Lora',serif;font-size:20px;font-weight:600;margin-bottom:4px}
.export-sub{font-size:13px;color:var(--ink2);margin-bottom:18px}
.export-btns{display:flex;gap:10px;margin-bottom:16px}
.btn-copy{flex:1;font-size:14px;font-weight:600;padding:12px;border-radius:var(--radius-sm);background:var(--ink);color:#fff;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
.btn-copy.cp{background:#065F46;color:#fff}
.btn-dl{flex:1;font-size:14px;font-weight:600;padding:12px;border-radius:var(--radius-sm);background:#fff;color:var(--ink);border:1px solid var(--paper3);cursor:pointer;font-family:'DM Sans',sans-serif}
.btn-dl:hover{border-color:var(--ink2)}
.canvas-tip{font-size:12px;color:var(--ink2);background:var(--paper2);border-radius:var(--radius-sm);padding:12px 14px;line-height:1.7}
.html-pre{width:100%;min-height:120px;font-size:11px;border-radius:var(--radius-sm);border:1px solid var(--paper3);padding:10px 12px;font-family:monospace;color:var(--ink3);background:var(--paper2);resize:vertical}
</style>
</head>
<body>
<div class="layout">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <h1>Canvas Announcement Builder</h1>
      <p>Pre-Calculus / Trig</p>
    </div>
    <nav class="sidebar-nav" id="sidenav"></nav>
    <div class="sidebar-footer">
      Brother Sallay<br>BYU–Idaho<br>sallayp@byui.edu
    </div>
  </aside>

  <main class="main" id="main"></main>

</div>

<script>
var DAY_OFF={Monday:-1,Tuesday:0,Wednesday:1,Thursday:2,Friday:3,Saturday:4};
var SCHED={
1:[["Tuesday","W01 Syllabus Quiz\nW01 Quiz: Introduction to Online Tutoring\nW01 Introduction Video"],["Thursday","W01 Review of Functions Homework\nW01 Tutoring Quiz"],["Saturday","W01 Review of Functions Homework\nW01 Tutoring Quiz\nW01 Syllabus Quiz"]],
2:[["Tuesday","Reach out to your group — set day/time for weekly meetings starting Week 3\nReview graphing functions and complete practice problems"],["Thursday","Set up the teaching video practice\nComplete self-report: Graphing functions & Graphing functions with transformations"],["Saturday","Algebra Review Exam (2 parts — Part I in Canvas with Proctorio, Part II paper upload)"]],
3:[["Tuesday","W03 Prepare: Introduction to Trigonometry"],["Thursday","W03 Group Meeting: Introduction to Trigonometry\nW03 Group Quiz"],["Saturday","W03 Homework: Introduction to Trigonometry"]],
4:[["Tuesday","W04 Prepare: Transformations & Trigonometric Functions"],["Thursday","W04 Group Meeting: Transformations & Trigonometric Functions\nW04 Group Quiz"],["Saturday","W04 Homework: Graphs of Sine and Cosine Functions and the Other Four Trig Functions"]],
5:[["Tuesday","W05 Prepare: Inverses and Right Triangle Trigonometry"],["Thursday","W05 Group Meeting: Inverses and Right Triangle Trigonometry\nW05 Group Quiz"],["Saturday","W04–W05 Quiz: Understanding the Unit Circle\nW05 Homework: Inverses and Right Triangle Trigonometry\nW05 Student Feedback to Instructor"]],
6:[["Tuesday","W06 Prepare: Unit 1 Knowledge Check Review"],["Thursday","W06 Group Meeting: Unit 1 Knowledge Check Review"],["Saturday","W06 Video Teaching Assignment\nW06: Unit 1 Knowledge Check\nW06: Unit 1 Knowledge Check Written Work\nW06: Unit 2 Knowledge Check Instructions"]],
7:[["Tuesday","Review Topics after Unit 1 Knowledge Check\nW07 Prepare: Law of Sines and Law of Cosines"],["Thursday","W07 Group Meeting: Law of Sines and Law of Cosines\nW07 Group Quiz"],["Saturday","W07 Homework: Law of Sines & Cosines"]],
8:[["Tuesday","W08 Prepare: Vectors and Polar Coordinates"],["Thursday","W08 Group Meeting: Vectors and Polar Coordinates\nW08 Group Quiz"],["Saturday","W08 Homework: Vectors and Polar Coordinates"]],
9:[["Tuesday","W09 Prepare: Unit 2 Knowledge Check Review"],["Thursday","W09 Group Meeting: Unit 2 Knowledge Check Review\nW09 Group Quiz"],["Saturday","W09: Unit 2 Knowledge Check\nW09: Unit 2 Knowledge Check Instructions\nW09: Unit 2 Knowledge Check Written Work"]],
10:[["Tuesday","Review Topics after Unit 2 Knowledge Check\nW10 Prepare: Trigonometric Identities"],["Thursday","W10 Group Meeting: Trigonometric Identities\nW10 Group Quiz"],["Saturday","W10 Homework: Trigonometric Identities"]],
11:[["Tuesday","W11 Prepare: Sum, Difference, Double, and Half-Angle Identities"],["Thursday","W11 Group Meeting: Sum, Difference, Double, and Half-Angle Identities\nW11 Group Quiz"],["Saturday","W11 Homework: Sum, Difference, Double, and Half-Angle Identities"]],
12:[["Tuesday","W12 Prepare: Solving with Identities"],["Thursday","W12 Group Meeting: Solving with Identities\nW12 Group Quiz"],["Saturday","W12 Homework: Trigonometric Identities & Solving"]],
13:[["Tuesday","W13 Prepare: Final Knowledge Check Review"],["Thursday","W13 Group Meeting: Final Knowledge Check Review"],["Saturday","W13 Video Teaching Assignment"]],
14:[["Monday","W14 Prepare: Unit 3 (Final) Knowledge Check Review\nW14: Unit 3 (Final) Knowledge Check Instructions"],["Wednesday","W13 End-of-Course Evaluation\nW14: Unit 3 (Final) Knowledge Check Written Work"]]
};
var WEEKS=[{n:1,t:"Course orientation · Getting started"},{n:2,t:"Graphing functions · Transformations"},{n:3,t:"Introduction to trigonometry · Unit circle"},{n:4,t:"Graphs of sine & cosine · Transformations"},{n:5,t:"Inverse trig · Right triangle trigonometry"},{n:6,t:"Unit 1 knowledge check · Teaching video"},{n:7,t:"Law of sines & law of cosines"},{n:8,t:"Vectors & polar coordinates"},{n:9,t:"Unit 2 knowledge check"},{n:10,t:"Trigonometric identities"},{n:11,t:"Sum, difference, double & half-angle identities"},{n:12,t:"Solving with identities"},{n:13,t:"Final review · Teaching assignment 2"},{n:14,t:"Final knowledge check"}];
var OPENERS=[
  {id:"personal",label:"Personal story",color:"#1E40AF",bg:"#DBEAFE",desc:"A memory connecting to this week's theme"},
  {id:"realworld",label:"Real-world connection",color:"#065F46",bg:"#D1FAE5",desc:"How this week's math appears in careers or daily life"},
  {id:"studyskill",label:"Study skill / tip",color:"#92400E",bg:"#FEF3C7",desc:"A practical tip tied to what you're observing in student work"},
  {id:"spiritual",label:"Spiritual / motivational",color:"#5B21B6",bg:"#EDE9FE",desc:"A scripture, quote, or principle about effort and growth"}
];
var QHS=[{id:"none",label:"None this week"},{id:"joke",label:"Math joke or puzzle"},{id:"career",label:"Career spotlight"},{id:"history",label:"Math history fact"}];
var STEPS=["Semester setup","Choose week","Opener type","Quick hit","Deadlines","Review & edit","Export HTML"];

var S={step:0,month:"",day:"",year:"",week:6,oType:"realworld",oNotes:"",qType:"history",qNotes:"",dates:[],_wl:null,opener:"",quickhit:"",html:"",copied:false,waiting:false};

function semISO(){if(!S.month||!S.day||S.year.length<4)return"";return S.year+"-"+S.month.padStart(2,"0")+"-"+S.day.padStart(2,"0");}
function isoToDate(iso){var p=iso.split("-");return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));}
function fmt(dt){return(dt.getMonth()+1)+"/"+dt.getDate()+"/"+dt.getFullYear();}
function calcDates(wn){var iso=semISO();if(!iso)return[];var base=isoToDate(iso);var tue=new Date(base.getTime());tue.setDate(base.getDate()+(wn-1)*7);return(SCHED[wn]||[]).map(function(row){var d=new Date(tue.getTime());d.setDate(tue.getDate()+(DAY_OFF[row[0]]||0));return{date:fmt(d),day:row[0],activity:row[1]};});}
function valid(){return semISO().length>0;}

function render(){
  var nav=document.getElementById("sidenav");
  nav.innerHTML=STEPS.map(function(l,i){
    var cls="nav-item"+(i===S.step?" active":i<S.step?" done":"");
    var num=i<S.step?"✓":String(i+1);
    return'<div class="'+cls+'" onclick="jumpTo('+i+')"><span class="nav-num">'+num+"</span>"+l+"</div>";
  }).join("");
  [s0,s1,s2,s3,s4,s5,s6][S.step]();
}
function go(n){S.step=n;render();window.scrollTo(0,0);}
function jumpTo(n){if(n<=S.step)go(n);}
function navRow(bk,nfn,nlbl,dis){
  var b=bk!==null?'<button class="btn-back" onclick="go('+bk+')">← Back</button>':"<span></span>";
  return'<div class="nav-row">'+b+'<button class="btn-primary"'+(dis?" disabled":"")+' onclick="'+nfn+'">'+(nlbl||"Next →")+"</button></div>";
}

/* ── Step 0: Semester setup ── */
function s0(){
  var iso=semISO();var prev="";
  if(iso){
    var ns=[1,2,3,6,7,9,12,14];
    var items=ns.map(function(n){var d=calcDates(n);var f=d[0],l=d[d.length-1];return'<div class="preview-week"><strong>Week '+n+"</strong><span>"+(f?f.date:"—")+" – "+(l?l.date:"—")+"</span></div>";});
    prev='<div class="card-label" style="margin-top:18px">Date preview — selected weeks</div><div class="date-preview">'+items.join("")+"</div>";
  }
  document.getElementById("main").innerHTML=
    '<div class="step-header"><h2>Semester setup</h2><p>Enter the Tuesday of Week 1 once. Every deadline across all 14 weeks calculates automatically.</p></div>'
    +'<div class="card"><div class="card-label">Week 1 Tuesday</div>'
    +'<div class="date-row">'
    +'<div class="date-field"><label>Month</label><input id="im" type="text" maxlength="2" placeholder="MM" value="'+S.month+'" oninput="od(\'m\',this.value)"></div>'
    +'<div class="date-field"><label>Day</label><input id="id" type="text" maxlength="2" placeholder="DD" value="'+S.day+'" oninput="od(\'d\',this.value)"></div>'
    +'<div class="date-field wide"><label>Year</label><input id="iy" type="text" maxlength="4" placeholder="YYYY" value="'+S.year+'" oninput="od(\'y\',this.value)"></div>'
    +"</div>"
    +'<p style="font-size:12px;color:#A8A29E">e.g. Month: 8 &nbsp;&nbsp; Day: 26 &nbsp;&nbsp; Year: 2026</p>'
    +prev
    +navRow(null,"go(1)","Continue →",!valid())
    +"</div>";
}
function od(f,v){
  if(f==="m")S.month=v.replace(/\D/g,"");
  if(f==="d")S.day=v.replace(/\D/g,"");
  if(f==="y")S.year=v.replace(/\D/g,"");
  var btn=document.querySelector(".btn-primary");if(btn)btn.disabled=!valid();
  if(valid()){
    var ns=[1,2,3,6,7,9,12,14];
    var items=ns.map(function(n){var d=calcDates(n);var f2=d[0],l=d[d.length-1];return'<div class="preview-week"><strong>Week '+n+"</strong><span>"+(f2?f2.date:"—")+" – "+(l?l.date:"—")+"</span></div>";});
    var pv=document.getElementById("dpv");
    if(pv){pv.innerHTML=items.join("");}
    else{
      var card=document.querySelector(".card");var nr=card.querySelector(".nav-row");
      var lbl=document.createElement("div");lbl.className="card-label";lbl.style.marginTop="18px";lbl.textContent="Date preview — selected weeks";
      var div=document.createElement("div");div.id="dpv";div.className="date-preview";div.innerHTML=items.join("");
      card.insertBefore(div,nr);card.insertBefore(lbl,div);
    }
  }
}

/* ── Step 1: Week ── */
function s1(){
  var w=WEEKS.find(function(x){return x.n===S.week;});
  var iso=semISO();
  document.getElementById("main").innerHTML=
    '<div class="step-header"><h2>Choose your week</h2><p>Semester starts <strong>'+fmt(isoToDate(iso))+'</strong>. <button class="btn-back" onclick="go(0)">Change</button></p></div>'
    +'<div class="card"><div class="card-label">Week number</div>'
    +'<div class="week-grid">'+WEEKS.map(function(x){return'<button class="week-btn'+(x.n===S.week?" sel":"")+'" onclick="pw('+x.n+')">'+x.n+"</button>";}).join("")+"</div>"
    +'<div class="topic-pill">&#128197; Week '+S.week+': '+w.t+"</div>"
    +navRow(0,"go(2)")
    +"</div>";
}
function pw(n){S.week=n;s1();}

/* ── Step 2: Opener ── */
function s2(){
  var cards=OPENERS.map(function(x){
    var sel=x.id===S.oType;
    return'<div class="option-card'+(sel?" sel":"")+'" style="'+(sel?"border-color:"+x.color+";background:"+x.bg:"")+'" onclick="po(\''+x.id+'\')">'
      +'<div class="option-title" style="color:'+(sel?x.color:"#1C1917")+'">'+x.label+"</div>"
      +'<div class="option-desc">'+x.desc+"</div></div>";
  }).join("");
  document.getElementById("main").innerHTML=
    '<div class="step-header"><h2>Opener type</h2><p>The personal, motivational section at the top of the announcement.</p></div>'
    +'<div class="card">'+cards
    +'<div class="card-label" style="margin-top:16px">Optional notes for Claude</div>'
    +'<p style="font-size:12px;color:#A8A29E;margin-bottom:8px">A specific story, angle, or theme — leave blank to generate freely.</p>'
    +'<textarea id="on" rows="3" placeholder="e.g. Use the GPS / navigation angle for the real-world connection">'+S.oNotes+"</textarea>"
    +navRow(1,"saveO()")+"</div>";
}
function po(id){S.oType=id;s2();}
function saveO(){var el=document.getElementById("on");S.oNotes=el?el.value:"";go(3);}

/* ── Step 3: Quick hit ── */
function s3(){
  var cards=QHS.map(function(x){
    var sel=x.id===S.qType;
    return'<div class="option-card'+(sel?" sel":"")+'" style="'+(sel?"border-color:#D97706;background:#FEF3C7":"")+'" onclick="pq(\''+x.id+'\')">'
      +'<div class="option-title" style="color:'+(sel?"#92400E":"#1C1917")+'">'+x.label+"</div></div>";
  }).join("");
  var notes=S.qType!=="none"
    ?'<div class="card-label" style="margin-top:16px">Optional notes</div><p style="font-size:12px;color:#A8A29E;margin-bottom:8px">Leave blank and Claude picks something suited to this week\'s topic.</p><textarea id="qn" rows="2" placeholder="e.g. Use the Aryabhata / sine history story">'+S.qNotes+"</textarea>"
    :"";
  document.getElementById("main").innerHTML=
    '<div class="step-header"><h2>Quick-hit section</h2><p>A short bonus item — takes 30 seconds to read but keeps each semester fresh.</p></div>'
    +'<div class="card">'+cards+notes+navRow(2,"saveQ()")+"</div>";
}
function pq(id){S.qType=id;s3();}
function saveQ(){var el=document.getElementById("qn");S.qNotes=el?el.value:"";go(4);}

/* ── Step 4: Dates ── */
function s4(){
  if(S._wl!==S.week){S.dates=calcDates(S.week).map(function(r){return{date:r.date,day:r.day,activity:r.activity};});S._wl=S.week;}
  var rows=S.dates.map(function(d,i){
    return'<div class="dl-row">'
      +'<input type="text" value="'+d.date+'" placeholder="Date" oninput="upd('+i+',\'date\',this.value)">'
      +'<input type="text" value="'+d.day+'" placeholder="Day" oninput="upd('+i+',\'day\',this.value)">'
      +'<textarea rows="3" oninput="upd('+i+',\'activity\',this.value)">'+d.activity+"</textarea></div>";
  }).join("");

  var w=WEEKS.find(function(x){return x.n===S.week;});
  var o=OPENERS.find(function(x){return x.id===S.oType;});
  var q=QHS.find(function(x){return x.id===S.qType;});

  var promptText="ANNOUNCEMENT_GENERATE\nWeek: "+S.week+" — "+w.t+"\nOpener type: "+o.label+(S.oNotes?"\nNotes for opener: "+S.oNotes:"")+(S.qType!=="none"?"\nQuick-hit: "+q.label:"\nNo quick-hit this week.")+(S.qNotes&&S.qType!=="none"?"\nNotes for quick-hit: "+S.qNotes:"");

  var waitBlock="";
  if(S.waiting){
    waitBlock='<div class="waiting-box">'
      +'<h3>Step 2 of 2 — Paste Claude\'s response</h3>'
      +'<p>Claude will reply with a JSON block in the chat. Copy everything from <code>{</code> to <code>}</code> and paste it below.</p>'
      +'<ol><li>Go to the Claude chat tab in your browser</li><li>Copy Claude\'s JSON response</li><li>Paste it in the box below</li><li>Click Load</li></ol>'
      +'<textarea class="paste-area" id="jp" rows="5" placeholder=\'Paste the JSON here — e.g. {"opener":"...","quickhit":"..."}\'></textarea>'
      +'<div style="margin-top:10px;display:flex;gap:10px;align-items:center">'
      +'<button class="btn-primary" onclick="loadPaste()">Load content →</button>'
      +'<button class="btn-back" onclick="S.waiting=false;s4()">Start over</button>'
      +"</div></div>";
  }

  var promptBox='<div class="card" style="border-color:#FDE68A;background:#FFFBEB">'
    +'<div class="card-label" style="color:#92400E">Step 1 of 2 — Copy this prompt for Claude</div>'
    +'<p style="font-size:13px;color:#78350F;margin-bottom:10px">Open Claude in your browser, paste this prompt, and send it. Then come back here for step 2.</p>'
    +'<textarea id="pt" rows="6" style="font-size:12px;font-family:monospace;background:#fff;border-color:#FDE68A" readonly>'+promptText+"</textarea>"
    +'<div style="margin-top:10px;display:flex;gap:10px">'
    +'<button class="btn-primary" onclick="copyPrompt()">Copy prompt</button>'
    +'<button class="btn-outline" onclick="S.waiting=true;s4()">I\'ve sent it, show paste box →</button>'
    +"</div></div>";

  document.getElementById("main").innerHTML=
    '<div class="step-header"><h2>Deadlines</h2><p>Auto-calculated from your semester start. Edit anything that differs this semester.</p></div>'
    +'<div class="card"><div class="dl-header"><div>Date</div><div>Day</div><div>Activity</div></div>'+rows
    +navRow(3,null,null,true)+"</div>"
    +promptBox
    +waitBlock;

  document.querySelector(".nav-row .btn-back").onclick=function(){go(3);};
}
function upd(i,f,v){if(S.dates[i])S.dates[i][f]=v;}
function copyPrompt(){
  var el=document.getElementById("pt");if(!el)return;
  navigator.clipboard.writeText(el.value).then(function(){
    var btn=document.querySelector('[onclick="copyPrompt()"]');
    if(btn){btn.textContent="Copied!";setTimeout(function(){btn.textContent="Copy prompt";},2000);}
  });
}
function loadPaste(){
  var el=document.getElementById("jp");if(!el||!el.value.trim()){alert("Please paste the JSON first.");return;}
  try{
    var raw=el.value.trim().replace(/```json|```/g,"").trim();
    var parsed=JSON.parse(raw);
    if(!parsed.opener){alert("No opener found in the JSON. Please copy Claude's full response and try again.");return;}
    S.opener=parsed.opener||"";S.quickhit=parsed.quickhit||"";
    S.waiting=false;go(5);
  }catch(e){alert("Could not read the JSON. Make sure you copied the full response from { to }.");}
}

/* ── Step 5: Review ── */
function s5(){
  var o=OPENERS.find(function(x){return x.id===S.oType;});
  var q=QHS.find(function(x){return x.id===S.qType;});
  var qcard=S.qType!=="none"&&S.quickhit
    ?'<div class="card"><span class="review-pill" style="background:#FEF3C7;color:#92400E">'+q.label+'</span><textarea id="rq" rows="4" style="width:100%;font-size:14px;line-height:1.75">'+S.quickhit+'</textarea><div class="review-hint">Edit freely — this is your draft.</div></div>'
    :"";
  document.getElementById("main").innerHTML=
    '<div class="step-header"><h2>Review &amp; edit</h2><p>Read through the generated content and adjust anything before building the HTML.</p></div>'
    +'<div class="card"><span class="review-pill" style="background:'+o.bg+';color:'+o.color+'">'+o.label+'</span>'
    +'<textarea id="ro" rows="10" style="width:100%;font-size:14px;line-height:1.75">'+S.opener+'</textarea>'
    +'<div class="review-hint">Edit freely — this is your draft.</div></div>'
    +qcard
    +'<div class="nav-row"><button class="btn-regen" onclick="regen()">↺ Regenerate with new prompt</button><button class="btn-primary" onclick="doExp()">Build HTML →</button></div>';
}
function saveEdits(){var o=document.getElementById("ro"),q=document.getElementById("rq");if(o)S.opener=o.value;if(q)S.quickhit=q.value;}
function regen(){saveEdits();S.waiting=false;go(4);}
function doExp(){saveEdits();S.html=mkHTML();go(6);}

/* ── Build HTML ── */
function mkHTML(){
  var o=OPENERS.find(function(x){return x.id===S.oType;});
  var q=QHS.find(function(x){return x.id===S.qType;});
  var paras=S.opener.split(/\n+/).map(function(p){return p.trim();}).filter(Boolean).map(function(p){return'<p style="margin:0 0 1em">'+p+"</p>";}).join("\n");
  var qblock="";
  if(S.qType!=="none"&&S.quickhit){
    qblock='\n<hr style="border:none;border-top:1px solid #e5e5e5;margin:24px 0">\n'
      +'<div style="margin-bottom:28px"><span style="display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:20px;margin-bottom:10px;background:#fef8ec;color:#7a4a08;border:1px solid #e8a020">'+q.label+'</span>'
      +'<div style="background:#fef8ec;border:1px solid #e8a020;border-radius:8px;padding:14px 18px"><p style="font-size:14px;color:#4a2e04;margin:0;line-height:1.7">'+S.quickhit+"</p></div></div>";
  }
  var rows=S.dates.filter(function(d){return d.day;}).map(function(d){
    return"<tr><td style='padding:9px 10px;border-bottom:1px solid #ececec;vertical-align:top'>"+d.date+"</td>"
      +"<td style='padding:9px 10px;border-bottom:1px solid #ececec;vertical-align:top'>"+d.day+"</td>"
      +"<td style='padding:9px 10px;border-bottom:1px solid #ececec;vertical-align:top;line-height:1.55'>"+d.activity.replace(/\n/g,"<br>")+"</td></tr>";
  }).join("");
  return'<!DOCTYPE html>\n<html lang="en"><head><meta charset="UTF-8"><title>Week '+S.week+' Overview</title></head>\n'
    +'<body style="font-family:\'Lato\',\'Helvetica Neue\',Arial,sans-serif;font-size:15px;line-height:1.75;color:#1a1a1a;max-width:720px;margin:0 auto;padding:24px 20px 40px;background:#fff">\n'
    +'<h1 style="font-size:22px;font-weight:700;color:#1a1a1a;margin:0 0 24px;padding-bottom:12px;border-bottom:2px solid #e5e5e5">Week '+S.week+' Overview</h1>\n'
    +'<div style="margin-bottom:28px"><span style="display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:20px;margin-bottom:10px;background:'+o.bg+';color:'+o.color+';border:1px solid '+o.color+'40">'+o.label+'</span>\n'
    +'<p style="margin:0 0 1em">Dear Class,</p>\n'+paras+"</div>"
    +qblock
    +'\n<hr style="border:none;border-top:1px solid #e5e5e5;margin:24px 0">\n'
    +'<div style="margin-bottom:28px"><span style="display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:20px;margin-bottom:10px;background:#f1f1ee;color:#555550;border:1px solid #c8c8c2">Deadlines for week '+S.week+'</span>\n'
    +'<table style="width:100%;border-collapse:collapse;font-size:14px;margin-top:8px"><thead><tr>'
    +'<th style="text-align:left;font-weight:700;font-size:12px;text-transform:uppercase;color:#666660;border-bottom:1px solid #e0e0da;padding:7px 10px;width:115px">Date</th>'
    +'<th style="text-align:left;font-weight:700;font-size:12px;text-transform:uppercase;color:#666660;border-bottom:1px solid #e0e0da;padding:7px 10px;width:100px">Day</th>'
    +'<th style="text-align:left;font-weight:700;font-size:12px;text-transform:uppercase;color:#666660;border-bottom:1px solid #e0e0da;padding:7px 10px">Activity</th>'
    +'</tr></thead><tbody>'+rows+'</tbody></table></div>\n'
    +'<hr style="border:none;border-top:1px solid #e5e5e5;margin:24px 0">\n'
    +'<div style="margin-bottom:28px"><span style="display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:20px;margin-bottom:10px;background:#f1f1ee;color:#555550;border:1px solid #c8c8c2">General reminders</span>'
    +'<p style="margin:0 0 1em">You should plan 6–8 hours spread out during the week. The dates listed above are end dates and not start dates. You may always complete an activity before it is due. Start your ALEKS work at the beginning of the week.</p>'
    +'<p style="margin:0">I will be available for office hours on Tuesday 2–3 pm MST and Thursday 7:30–8:30 pm MST. I am able to set up a Zoom room at other times — email me at <a href="mailto:sallayp@byui.edu" style="color:#1a5fa8">sallayp@byui.edu</a> for a link.</p></div>\n'
    +'<p style="margin-top:24px;font-size:15px">Brother Sallay</p>\n</body></html>';
}

/* ── Step 6: Export ── */
function s6(){
  var w=WEEKS.find(function(x){return x.n===S.week;});
  document.getElementById("main").innerHTML=
    '<div class="step-header"><h2>Export</h2><p>Your Canvas HTML is ready.</p></div>'
    +'<div class="card">'
    +'<div class="export-title">Week '+S.week+' Overview</div>'
    +'<div class="export-sub">'+w.t+'</div>'
    +'<div class="export-btns">'
    +'<button class="btn-copy'+(S.copied?" cp":"")+'" onclick="doCopy()">'+(S.copied?"✓ Copied!":"Copy HTML")+'</button>'
    +'<button class="btn-dl" onclick="doDl()">Download .html</button>'
    +"</div>"
    +'<p class="canvas-tip"><strong>To embed in Canvas:</strong> Announcements → New Announcement → click the <em>&lt; &gt;</em> HTML editor button in the toolbar → paste the copied code → switch back to visual editor to preview → publish.</p>'
    +"</div>"
    +'<div class="card"><div class="card-label">HTML preview</div><textarea class="html-pre" readonly>'+esc(S.html)+"</textarea></div>"
    +'<div class="nav-row">'
    +'<button class="btn-back" onclick="go(5)">← Edit content</button>'
    +'<button class="btn-outline" onclick="nxtWk()">Build next week →</button>'
    +"</div>";
}
function doCopy(){navigator.clipboard.writeText(S.html).then(function(){S.copied=true;s6();setTimeout(function(){S.copied=false;s6();},2000);});}
function doDl(){var b=new Blob([S.html],{type:"text/html"});var u=URL.createObjectURL(b);var a=document.createElement("a");a.href=u;a.download="week"+S.week+"_canvas_announcement.html";a.click();URL.revokeObjectURL(u);}
function nxtWk(){S.week=Math.min(S.week+1,14);S.oNotes="";S.qNotes="";S.dates=[];S._wl=null;S.opener="";S.quickhit="";S.html="";S.copied=false;S.waiting=false;go(1);}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

render();
</script>
</body>
</html>
