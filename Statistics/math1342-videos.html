<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Math 1342 Lecture Videos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: lesson picker grid on the left, selected lesson's links and email text on the right; stacks on phones. */
:root{
  --bg:#f4f6f8; --panel:#ffffff; --ink:#1a2433; --muted:#566273; --line:#d3dae3;
  --accent:#1f4f8a; --accent-ink:#ffffff; --accent-soft:#e3ecf7; --ok:#1d7a46;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161d; --panel:#19212b; --ink:#e6ebf2; --muted:#9daabb; --line:#2c3743;
  --accent:#8db4ea; --accent-ink:#0d1520; --accent-soft:#22324a; --ok:#63c98f; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#11161d; --panel:#19212b; --ink:#e6ebf2; --muted:#9daabb; --line:#2c3743;
  --accent:#8db4ea; --accent-ink:#0d1520; --accent-soft:#22324a; --ok:#63c98f; color-scheme:dark;}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:grid;gap:20px}
header h1{margin:0;font-size:clamp(1.6rem,3.6vw,2.2rem);line-height:1.2;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
h2{margin:0 0 12px;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px;list-style:none;margin:0;padding:0}
.lessons button{width:100%;font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--ink);
  border-radius:8px;padding:8px 4px;display:grid;gap:0;text-align:center}
.lessons button .num{font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums}
.lessons button .len{font-size:.78rem;color:var(--muted)}
.lessons button:hover{border-color:var(--accent)}
.lessons button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lessons button[aria-pressed="true"] .len{color:var(--accent-ink)}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin-bottom:6px}
.head h3{margin:0;font-size:1.6rem;line-height:1.2}
.meta{color:var(--muted)}
.subtitle{margin:0 0 14px;color:var(--muted)}
ol.vids{list-style:none;margin:0 0 18px;padding:0;display:grid;gap:8px}
ol.vids li{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;min-width:0}
.part{font-weight:700;min-width:4.2em}
.vids a{font-family:var(--f-mono);font-size:.92rem;color:var(--accent);word-break:break-all;flex:1 1 220px;min-width:0}
.btn{font:inherit;font-size:.92rem;cursor:pointer;border-radius:6px;padding:6px 12px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:hover{filter:brightness(1.08)}
label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:210px;font-family:var(--f-mono);font-size:.9rem;line-height:1.5;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.status{color:var(--ok);font-weight:700;min-height:1.5em}
.hint{color:var(--muted);font-size:.9rem;margin:8px 0 0}
@media (prefers-reduced-motion:no-preference){.lessons button{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Math 1342 Lecture Videos</h1>
    <p>Pick a lesson to see its YouTube links. Copy the email text to send to a student who missed class.</p>
  </header>

  <div class="grid">
    <section class="card" aria-labelledby="pickHead">
      <h2 id="pickHead">Choose a lesson</h2>
      <ul class="lessons" id="lessons"></ul>
    </section>

    <section class="card" aria-live="polite" aria-labelledby="lessonHead">
      <div class="head">
        <h3 id="lessonHead"></h3>
        <span class="meta" id="meta"></span>
      </div>
      <p class="subtitle" id="subtitle"></p>
      <ol class="vids" id="vids"></ol>

      <label for="email">Email text</label>
      <textarea id="email" spellcheck="true"></textarea>
      <div class="row">
        <button class="btn" id="copyEmail" type="button">Copy email text</button>
        <button class="btn ghost" id="copyLinks" type="button">Copy links only</button>
        <span class="status" id="status" role="status"></span>
      </div>
      <p class="hint">You can edit the text before copying. Changes reset when you pick another lesson.</p>
    </section>
  </div>
</div>

<script>
/* ===== Lesson data: add a title, change minutes, or add video IDs here ===== */
const LESSONS = [
  { lesson: 1, title: "", minutes: 23, videos: ["fgckpkyU8oQ", "GjN63p1pI2A"] },
  { lesson: 2, title: "", minutes: 27, videos: ["mjuT-8tJ7ac", "hIdGEyP__TE"] },
  { lesson: 3, title: "", minutes: 43, videos: ["SbkAKpcWzb8", "doq8x_2pa64", "_ruGw0YgTG4"] },
  { lesson: 4, title: "", minutes: 53, videos: ["iX1sl2c4MCM", "fHqMnc3ISNU", "umlWTXtFGv8", "_iK5dSn4HSk"] },
  { lesson: 5, title: "", minutes: 25, videos: ["_cRqOVqEXzg", "FQnH3o1xfzw"] },
  { lesson: 6, title: "", minutes: 30, videos: ["SfJW3bM9iFY", "yvjXKV7ptYY"] },
  { lesson: 7, title: "", minutes: 23, videos: ["1O-Sh8SySWQ", "kx26j386rEM"] },
  { lesson: 8, title: "", minutes: 26, videos: ["I2RCFTpxVmc", "B32k0OAwZD8"] },
  { lesson: 9, title: "", minutes: 33, videos: ["kpts5Zqsiy0", "FzsgBwsBAHo"] },
  { lesson: 10, title: "", minutes: 38, videos: ["GQ2-MwY1qQY", "Z56JDhFDHXU"] },
  { lesson: 11, title: "", minutes: 24, videos: ["JabqwOr5k6w", "r_LfdnRaYxU"] },
  { lesson: 12, title: "", minutes: 23, videos: ["FeHANID3KFA"] },
  { lesson: 13, title: "", minutes: null, videos: ["ci6psOLya5Y", "LdnvLg1IvyQ", "6aAqyyYipL4"] },
  { lesson: 14, title: "", minutes: 51, videos: ["UmYHAJMUXUk", "8P3N95UVCSM", "zig74_qn2yU", "BosvaMlelMY"] },
  { lesson: 15, title: "", minutes: 37, videos: ["4BLpGUvIdGM", "Sk00Xa-UjGQ"] },
  { lesson: 16, title: "", minutes: 30, videos: ["I3gZQvl5qhM", "xGKV0Q487Gw"] },
  { lesson: 17, title: "", minutes: 52, videos: ["-tHJTM3Z154", "sCpzf1vKJyE", "Y_LXlxjVJUQ", "otBQZbwD1Ns"] },
  { lesson: 18, title: "Scatterplots and Correlation", minutes: 23, videos: ["_mHSubdOqeg", "8QC41v4Ol4s"] },
  { lesson: 19, title: "LSRL and Residuals", minutes: 23, videos: ["FAGPRMDhnnQ", "-crfMVQYug4"] },
  { lesson: 20, title: "Hypothesis Test and the z-Test", minutes: 30, videos: ["Yy1KIU30poE", "86DswwoC44g"] },
  { lesson: 21, title: "", minutes: 36, videos: ["d1v_JWnx9Vg", "PqoJ77hIy44"] },
  { lesson: 22, title: "", minutes: 34, videos: ["yjSIZdCdxgY", "gBicus1PU2o"] },
  { lesson: 23, title: "", minutes: 46, videos: ["RxesQUqCPqQ", "BZolj1agJyU", "R7YOeJRIu44"] },
  { lesson: 24, title: "", minutes: 31, videos: ["Lm0KH7726Gw", "iFnF5iQWAOE"] },
];
/* ===== end of lesson data ===== */

const url = id => 'https://youtu.be/' + id;
const name = L => 'Lesson ' + L.lesson + (L.title ? ': ' + L.title : '');
const parts = L => L.videos.length + (L.videos.length === 1 ? ' part' : ' parts');
const length = L => L.minutes ? 'about ' + L.minutes + ' minutes' : '';

function emailText(L) {
  const lines = ['Here are the video lectures for ' + name(L) + '.', ''];
  L.videos.forEach((id, i) => lines.push((L.videos.length > 1 ? 'Part ' + (i + 1) + ': ' : '') + url(id)));
  lines.push('');
  if (L.minutes) lines.push('Total viewing time is ' + length(L) + '.');
  lines.push('Please watch them before our next class, and let me know if you have any questions.');
  return lines.join('\n');
}

const list = document.getElementById('lessons');
LESSONS.forEach(L => {
  const li = document.createElement('li');
  const b = document.createElement('button');
  b.type = 'button';
  b.dataset.lesson = L.lesson;
  b.setAttribute('aria-pressed', 'false');
  b.setAttribute('aria-label', name(L) + ', ' + parts(L) + (L.minutes ? ', ' + L.minutes + ' minutes' : ''));
  b.innerHTML = '<span class="num">L' + L.lesson + '</span><span class="len">' + (L.minutes ? L.minutes + ' min' : parts(L)) + '</span>';
  b.addEventListener('click', () => show(L.lesson, true));
  li.append(b);
  list.append(li);
});

function show(n, fromClick) {
  const L = LESSONS.find(x => x.lesson === n) || LESSONS[0];
  for (const b of list.querySelectorAll('button')) b.setAttribute('aria-pressed', String(+b.dataset.lesson === L.lesson));
  document.getElementById('lessonHead').textContent = 'Lesson ' + L.lesson;
  document.getElementById('subtitle').textContent = L.title;
  document.getElementById('subtitle').hidden = !L.title;
  document.getElementById('meta').textContent = parts(L) + (L.minutes ? ' · ' + L.minutes + ' min' : '');
  const ol = document.getElementById('vids');
  ol.innerHTML = '';
  L.videos.forEach((id, i) => {
    const li = document.createElement('li');
    const p = document.createElement('span'); p.className = 'part'; p.textContent = 'Part ' + (i + 1);
    const a = document.createElement('a'); a.href = url(id); a.target = '_blank'; a.rel = 'noopener'; a.textContent = url(id);
    a.setAttribute('aria-label', 'Lesson ' + L.lesson + ' part ' + (i + 1) + ' on YouTube (opens in new tab)');
    const c = document.createElement('button'); c.type = 'button'; c.className = 'btn ghost'; c.textContent = 'Copy';
    c.setAttribute('aria-label', 'Copy link for part ' + (i + 1));
    c.addEventListener('click', () => copy(url(id), 'Part ' + (i + 1) + ' link copied'));
    li.append(p, a, c);
    ol.append(li);
  });
  document.getElementById('email').value = emailText(L);
  document.getElementById('status').textContent = '';
  current = L;
  if (fromClick) { try { history.replaceState(null, '', '#L' + L.lesson); } catch (e) {} }
}

let current = null;
async function copy(text, msg) {
  const status = document.getElementById('status');
  try {
    await navigator.clipboard.writeText(text);
    status.textContent = msg;
  } catch (e) {
    const ta = document.getElementById('email');
    ta.value = text; ta.focus(); ta.select();
    status.textContent = 'Text selected. Press Ctrl+C (or Cmd+C) to copy.';
  }
}
document.getElementById('copyEmail').addEventListener('click', () => copy(document.getElementById('email').value, 'Email text copied'));
document.getElementById('copyLinks').addEventListener('click', () => copy(current.videos.map(url).join('\n'), 'Links copied'));

const start = parseInt((location.hash.match(/^#L(\d+)$/) || [])[1], 10);
show(LESSONS.some(x => x.lesson === start) ? start : LESSONS[0].lesson, false);
</script>
</body>
</html>
