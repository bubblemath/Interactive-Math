<!doctype html>
<html lang="en">
<head>

<meta name="description" content="Step-by-step coach for chi-square tests in Math 1342.">
<title>Chi-Square Coach</title>
<style>
/* Layout: masthead, two tabs, then a step list beside one step card (stacks on phones). */
:root{
  --paper:#F3F1E7; --sheet:#FBFAF4; --card:#FFFFFF; --rule:#D8D3C2; --ink:#14213D; --ink-soft:#4F586C;
  --blue:#1F4E9C; --blue-soft:#E4EBF7; --on-blue:#FFFFFF;
  --ok:#22603C; --ok-soft:#E2EFE7; --no:#A31F1C; --no-soft:#F7E4E3; --gold:#B58B15;
  --serif:Georgia,'Iowan Old Style','Times New Roman',serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#151A22; --sheet:#1B212B; --card:#212834; --rule:#38414F; --ink:#E8EBF1; --ink-soft:#A7B0BF;
  --blue:#8FB0EC; --blue-soft:#24324A; --on-blue:#0F1724;
  --ok:#7BD3A0; --ok-soft:#1E3529; --no:#F29A92; --no-soft:#3A2224; --gold:#E0BC5A; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#151A22; --sheet:#1B212B; --card:#212834; --rule:#38414F; --ink:#E8EBF1; --ink-soft:#A7B0BF;
  --blue:#8FB0EC; --blue-soft:#24324A; --on-blue:#0F1724;
  --ok:#7BD3A0; --ok-soft:#1E3529; --no:#F29A92; --no-soft:#3A2224; --gold:#E0BC5A; color-scheme:dark;}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:8px 64px}

.masthead h1{font-family:var(--serif);font-size:clamp(28px,5vw,42px);line-height:1.05;margin:0;letter-spacing:-.01em}

.tab{font:inherit;font-weight:600;cursor:pointer;padding:9px 16px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:3px}

.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
.progress{list-style:none;margin:0;padding:0;display:grid;gap:6px}
@media (max-width:820px){.progress{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.pstep{width:100%;display:flex;align-items:center;gap:10px;font:inherit;font-size:15px;text-align:left;cursor:pointer;
  padding:8px 10px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:3px}

.pstep .pn{flex:0 0 26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;border:1px solid var(--rule);background:var(--card)}

.kicker{margin:0 0 4px;font-family:var(--mono);font-size:13px;color:var(--ink-soft);letter-spacing:.03em}

h2:focus{outline:none}
h3{font-family:var(--serif);font-size:18px;margin:20px 0 8px;line-height:1.3}
.lede{color:var(--ink-soft);margin:0 0 12px;max-width:68ch}
.small{font-size:14.5px;color:var(--ink-soft);margin:8px 0 0}
a{color:var(--blue)}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.choice .ct{font-weight:600}

.field{display:grid;gap:4px;margin:12px 0}
.field label{font-weight:600;font-size:15.5px}

.result h3{margin-top:4px}
.copyrow{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:6px 0;border-top:1px solid var(--rule)}
.copyrow:first-of-type{border-top:0}
.copytext{margin:0;min-width:0;overflow-wrap:anywhere}
.summary{white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--mono);font-size:14px;line-height:1.6;margin:0;background:var(--sheet);padding:10px;border-radius:3px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;background:var(--card)}
th,td{border:1px solid var(--rule);padding:7px 10px;text-align:left}
thead th{background:var(--blue-soft)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
ol.steps{padding-left:22px;margin:8px 0}
ol.steps li{margin:4px 0}
.btn{font:inherit;font-weight:600;cursor:pointer;padding:10px 20px;border-radius:3px;border:1px solid var(--blue);background:var(--blue);color:var(--on-blue)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--blue)}
.btn.small{padding:4px 10px;font-size:14px;flex:0 0 auto}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:22px;padding-top:14px;border-top:1px solid var(--rule)}
.navhint{color:var(--ink-soft);font-size:15px}
.scenario{font-family:var(--serif);font-size:21px;line-height:1.5;background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--ink);padding:16px 20px;margin:4px 0 8px}
.scenario:focus{outline:3px solid var(--gold);outline-offset:2px}
details{margin-top:8px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.field textarea{font:inherit;font-family:var(--mono);font-size:15px;padding:9px 11px;border:1px solid var(--rule);border-radius:3px;background:var(--card);color:var(--ink);width:100%;resize:vertical}

@media (prefers-reduced-motion:reduce){*{transition:none !important}}
.cgrid input{font:inherit;font-variant-numeric:tabular-nums;width:5.2em;padding:6px 7px;border:1px solid var(--rule);border-radius:3px;background:var(--card);color:var(--ink);text-align:right}
.cgrid input.bad{border-color:var(--no);border-width:2px;background:var(--no-soft)}
.cgrid input.good{border-color:var(--ok)}
.cgrid th,.cgrid td{padding:6px 8px;white-space:nowrap}
.cgrid td.tot{font-weight:600;color:var(--ink-soft)}
.cgrid th[scope=row] input{width:12em;text-align:left}
.formula{font-family:var(--mono);font-size:15px;background:var(--card);border:1px solid var(--rule);padding:8px 12px;border-radius:3px;display:inline-block;margin:6px 0}
.field select{font:inherit;padding:8px 10px;border:1px solid var(--rule);border-radius:3px;background:var(--card);color:var(--ink);width:8em}
</style>

<body>
<div class="wrap">
  <header class="masthead">
    <h1>Chi-Square Coach</h1>
    <p>Step-by-step help with the After the Diploma project: goodness of fit, independence, and homogeneity. The applet calculates χ² and the p-value; the coach checks your test choice, hypotheses, and expected counts.</p>
  </header>

  <div class="tabs" role="tablist" aria-label="Mode">
    <button class="tab" role="tab" id="tab-guide" aria-controls="panel-guide" aria-selected="true">Guide me through my test</button>
    <button class="tab" role="tab" id="tab-practice" aria-controls="panel-practice" aria-selected="false">Practice: which test?</button>
  </div>

  <section id="panel-guide" role="tabpanel" aria-labelledby="tab-guide">
    <div class="layout">
      <nav aria-label="Steps"><ol class="progress" id="progress"></ol></nav>
      <div class="sheet">
        <div id="stepBody"></div>
        <div class="nav">
          <button type="button" class="btn ghost" id="backBtn">Back</button>
          <button type="button" class="btn" id="nextBtn">Next step</button>
          <span class="navhint" id="navHint" aria-live="polite"></span>
        </div>
      </div>
    </div>
  </section>

  <section id="panel-practice" role="tabpanel" aria-labelledby="tab-practice" hidden>
    <div class="sheet" id="practiceBody"></div>
  </section>

  <div class="foot">
    <span>Your answers save in this browser.</span>
    <button type="button" class="btn ghost small" id="resetBtn">Start over</button>
    <span id="resetConfirm" hidden>Clear everything you entered? <button type="button" class="btn small" id="resetYes">Yes, clear it</button> <button type="button" class="btn ghost small" id="resetNo">Keep it</button></span>
  </div>
</div>
<script>
/* ==================================================================
   CORE LOGIC — pure functions, no DOM. Tested in Node (test.js).
   The coach checks students' work. It works out expected counts and
   the components internally so it can say right or wrong, but it never
   displays χ² or a p-value: students get those from the course applet.
   ================================================================== */
var ALPHA = 0.05;
var GPA = ['<2.0', '2.0–2.49', '2.5–2.99', '3.0–3.49', '>3.5'];
var STATE = [0.319, 0.125, 0.136, 0.194, 0.226];   /* Texas two-year shares, 2023–24 graduates */
var TEST_NAMES = { gof: 'Goodness of fit', indep: 'Test of independence', homog: 'Test of homogeneity' };

/* The lab's parts: which test each needs, the rows of its table, and the claim (goodness of fit only). */
var PARTS = {
  p1a: { label: 'Part 1A: equal shares', test: 'gof', claim: 'equal', rows: ['Your school, two-year'],
    why: 'One sample (your school’s two-year students), one variable (GPA category), compared with a claimed distribution.' },
  p1b: { label: 'Part 1B: your school vs. Texas', test: 'gof', claim: 'state', rows: ['Your school, two-year'],
    why: 'One sample, one variable, compared with a claimed distribution: the Texas shares.' },
  p2: { label: 'Part 2: type of college and GPA', test: 'indep', rows: ['Two-year', 'Four-year'],
    why: 'One sample (your school’s graduates) with two variables recorded for each student: type of college and GPA.' },
  p3: { label: 'Part 3: three high schools', test: 'homog', rows: ['Your school', 'Nearby school', 'Comparison school'],
    why: 'Three separate samples (one per school) and one variable: GPA category.' },
  p4: { label: 'Part 4: then vs. now', test: 'homog', rows: ['2018–19 graduates', '2023–24 graduates'],
    why: 'Two separate samples (two graduating classes) and one variable: GPA category.' },
  own: { label: 'My own data', test: null, rows: [], why: '' }
};

/* Decide the test from the two deciding questions (used for "my own data" and in practice). */
function testFromAnswers(samples, variables) {
  if (samples === 'one' && variables === 'one') return 'gof';
  if (samples === 'one' && variables === 'two') return 'indep';
  if (samples === 'several' && variables === 'one') return 'homog';
  return null;   /* several samples with two variables each is not one of the three tests */
}

function num(v) {
  if (v === null || v === undefined) return NaN;
  var s = String(v).replace(/,/g, '').trim();
  if (s === '' || !/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s)) return NaN;
  return parseFloat(s);
}
function round(x, d) { var f = Math.pow(10, d); return Math.round(x * f) / f; }

function checkTest(part, choice, own) {
  if (!choice) return { ok: false, msg: 'Choose one of the three tests.' };
  var want = part === 'own' ? testFromAnswers(own.samples, own.variables) : PARTS[part].test;
  if (!want) return { ok: false, msg: part === 'own' ? 'First answer both questions about your data.' : '' };
  if (choice === want) return { ok: true, msg: 'Right. ' + (part === 'own' ? whyOwn(want) : PARTS[part].why) };
  var hints = {
    gof: 'Look again: there is one sample and one variable, compared with a claimed set of percentages. That is goodness of fit.',
    indep: 'Look again: this is one sample, and each individual is sorted by two variables. That makes it a test of independence.',
    homog: 'Look again: these are separate samples (different groups of people) sorted by one variable. That makes it a test of homogeneity.'
  };
  return { ok: false, msg: hints[want] };
}
function whyOwn(test) {
  return { gof: 'One sample and one variable compared with a claim: goodness of fit.', indep: 'One sample with two variables: independence.', homog: 'Separate samples with one variable: homogeneity.' }[test];
}

/* ---------- counts ---------- */
/* Read a grid of typed counts. Each must be a whole number 0 or more. */
function readCounts(grid) {
  var bad = [], values = grid.map(function (row, i) {
    return row.map(function (v, j) {
      var n = num(v);
      if (!isFinite(n) || n < 0 || Math.floor(n) !== n) bad.push([i, j]);
      return n;
    });
  });
  return { values: values, bad: bad, ok: bad.length === 0 };
}
function totals(values) {
  var rows = values.map(function (r) { return r.reduce(function (a, b) { return a + b; }, 0); });
  var cols = values[0].map(function (_, j) { return values.reduce(function (a, r) { return a + r[j]; }, 0); });
  return { rows: rows, cols: cols, grand: rows.reduce(function (a, b) { return a + b; }, 0) };
}

/* The claimed proportions for a goodness-of-fit test with k categories. */
function claimProps(claim, k, ownProps) {
  if (claim === 'equal') return Array(k).fill(1 / k);
  if (claim === 'state') return STATE.slice();
  if (claim === 'state-merged') return [STATE[0], round(STATE[1] + STATE[2], 3), STATE[3], STATE[4]];
  if (claim === 'equal-merged') return [0.2, 0.4, 0.2, 0.2];
  return ownProps;
}
/* Check percentages typed for "my own" claim: k numbers that add to 100%. */
function readProps(list, k) {
  var vals = list.map(num);
  if (vals.length !== k || vals.some(function (v) { return !isFinite(v) || v < 0; })) return { ok: false, msg: 'Type a percent for each category.' };
  var s = vals.reduce(function (a, b) { return a + b; }, 0);
  if (Math.abs(s - 100) > 0.5) return { ok: false, msg: 'The percents add to ' + round(s, 2) + '%. They should add to 100%.' };
  return { ok: true, props: vals.map(function (v) { return v / 100; }) };
}

/* Expected counts (internal). */
function expectedGOF(counts, props) {
  var n = counts.reduce(function (a, b) { return a + b; }, 0);
  return counts.map(function (_, i) { return n * props[i]; });
}
function expectedTable(values) {
  var T = totals(values);
  return values.map(function (r, i) { return r.map(function (_, j) { return T.rows[i] * T.cols[j] / T.grand; }); });
}

/* Compare a student's typed expected counts with the true ones.
   Accepts answers within 0.02 so that rounding to 2 decimal places is fine. */
function checkExpected(typed, truth, rowsToCheck) {
  var wrong = [], blank = [];
  rowsToCheck.forEach(function (i) {
    truth[i].forEach(function (e, j) {
      var v = num(typed[i] && typed[i][j]);
      if (!isFinite(v)) blank.push([i, j]);
      else if (Math.abs(v - e) > 0.02 + 1e-9) wrong.push([i, j]);
    });
  });
  return { ok: !wrong.length && !blank.length, wrong: wrong, blank: blank };
}
function minExpected(table) { return Math.min.apply(null, table.map(function (r) { return Math.min.apply(null, r); })); }

/* Merge the 2.0–2.49 and 2.5–2.99 columns (index 1 and 2) of every row. */
function mergeMiddle(grid) {
  return grid.map(function (r) {
    var a = num(r[1]), b = num(r[2]);
    var m = isFinite(a) && isFinite(b) ? String(a + b) : '';
    return [r[0], m, r[3], r[4]];
  });
}
var GPA_MERGED = ['<2.0', '2.0–2.99', '3.0–3.49', '>3.5'];

/* ---------- applet results ---------- */
function dfFor(test, rows, cols) { return test === 'gof' ? cols - 1 : (rows - 1) * (cols - 1); }
function checkDf(test, rows, cols, typed) {
  var want = dfFor(test, rows, cols), v = num(typed);
  if (!isFinite(v)) return { ok: false, msg: 'Type the df the applet shows.' };
  if (v === want) return { ok: true, msg: test === 'gof' ? 'Right: df = categories − 1 = ' + cols + ' − 1 = ' + want + '.' : 'Right: df = (rows − 1)(columns − 1) = (' + rows + ' − 1)(' + cols + ' − 1) = ' + want + '.' };
  return { ok: false, msg: test === 'gof'
    ? 'For goodness of fit, df = number of categories − 1. Check that Number of Categories is ' + cols + ' in the applet.'
    : 'For a two-way table, df = (rows − 1)(columns − 1). Check that the applet has ' + rows + ' rows and ' + cols + ' columns.' };
}
/* Internal χ² so the coach can catch typing mistakes in the applet. It is never displayed. */
function chiSquare(obs, exp) {
  var s = 0;
  obs.forEach(function (r, i) { r.forEach(function (o, j) { s += Math.pow(o - exp[i][j], 2) / exp[i][j]; }); });
  return s;
}
function checkChi(typed, truthChi, truthRounded) {
  var v = num(typed);
  if (!isFinite(v) || v < 0) return { ok: false, msg: 'Type the χ² value from the applet. It is never negative.' };
  var close = function (t) { return Math.abs(v - t) <= Math.max(0.06, 0.01 * t); };
  if (close(truthChi) || (truthRounded !== undefined && close(truthRounded))) return { ok: true, msg: 'Recorded. It matches the counts you entered here.' };
  return { ok: false, msg: 'That χ² does not match the counts you entered in the coach. Check the applet for a typing mistake, a row or column in a different order, or an expected count typed wrong.' };
}
function checkPvalue(v) {
  var p = num(v);
  if (!isFinite(p)) return { ok: false, msg: 'Type the p-value from the applet, such as 0.0231. If the applet shows “< 0.0001”, type 0.0001.' };
  if (p < 0 || p > 1) return { ok: false, msg: 'A p-value is a probability, so it must be between 0 and 1.' };
  return { ok: true, value: p };
}
function correctDecision(p) { return p < ALPHA ? 'reject' : 'fail'; }
function checkDecision(p, choice, shown) {
  var want = correctDecision(p), ps = shown || String(p);
  if (choice === want) return { ok: true, msg: want === 'reject' ? 'Right. ' + ps + ' is less than 0.05.' : 'Right. ' + ps + ' is not less than 0.05.' };
  return { ok: false, msg: 'Compare the p-value with α = 0.05. If the p-value is less than α, reject H₀. Otherwise, fail to reject H₀.' };
}
function decisionSentence(p, decision, shown) {
  var ps = shown || String(p);
  return decision === 'reject' ? 'Since the p-value (' + ps + ') is less than α = 0.05, we reject H₀.'
    : 'Since the p-value (' + ps + ') is ' + (p === ALPHA ? 'equal to' : 'greater than') + ' α = 0.05, we fail to reject H₀.';
}

/* ---------- hypotheses in context ---------- */
function listNames(names) {
  if (names.length <= 2) return names.join(' and ');
  return names.slice(0, -1).join(', ') + ', and ' + names[names.length - 1];
}
/* ctx: { test, claim, school, rows (labels), what, var1, var2, groupWord } */
function hypothesesFor(ctx) {
  var sch = ctx.school || 'your school';
  if (ctx.test === 'gof') {
    if (ctx.claim === 'equal' || ctx.claim === 'equal-merged') return {
      h0: 'The GPA categories are equally common among ' + sch + '’s graduates at two-year colleges' + (ctx.claim === 'equal' ? ' (each is 20%).' : '.'),
      ha: 'At least one GPA category’s proportion is different from the claim.' };
    if (ctx.claim === 'state' || ctx.claim === 'state-merged') return {
      h0: 'The GPA distribution of ' + sch + '’s graduates at two-year colleges matches the Texas distribution.',
      ha: 'At least one GPA category’s proportion is different from the Texas proportion.' };
    return { h0: 'The distribution of ' + (ctx.what || 'the variable') + ' matches the claimed proportions.',
      ha: 'At least one proportion is different from the claimed proportion.' };
  }
  if (ctx.test === 'indep') {
    var v1 = ctx.var1 || 'first-year GPA', v2 = ctx.var2 || 'type of college (two-year or four-year)';

    var h = '<h2>Write the hypotheses in context</h2><p class="lede">' + esc(TEST_NAMES[S.test]) + '. Which pair is correct?</p><div class="choices stack" role="group" aria-label="Hypothesis choices">';
    S.order.forEach(function (k) { var c = ch[k]; h += choice('hyp', c.id, 'H₀: ' + esc(c.h0), S.hyp, 'Hₐ: ' + esc(c.ha)); });
    return h + '</div>' + fb('fb2') + '<div id="hypOut"></div>';
  },
  refresh: function () {
    setFb('fb2', S.hyp ? checkHyp(S.hyp) : null);
    var o = $('hypOut'); if (!o) return;
    if (!checkHyp(S.hyp).ok) { o.innerHTML = ''; return; }
    var h = hypothesesFor(ctx());
    o.innerHTML = '<div class="result"><h3>Your hypotheses</h3>' + copyBlock('h0', 'H₀: ' + h.h0) + copyBlock('ha', 'Hₐ: ' + h.ha) + '</div>';
  }
};
V[3] = {
  html: function () {
    ensureGrids();
    var h = '<h2>Work out the expected counts</h2>';
    if (S.test === 'gof') {
      var o = obs(), n = o ? o[0].reduce(function (a, b) { return a + b; }, 0) : 0;
      h += '<p class="lede">Expected count = N × claimed proportion. Your N is <b>' + n + '</b>.</p><p class="formula">' + (claim().indexOf('equal') === 0 && !S.merged ? 'E = ' + n + ' ÷ ' + nCols() : 'E = ' + n + ' × proportion') + '</p>';
      h += '<p class="small">Claimed proportions: ' + props().map(function (p, j) { return catLabels()[j] + ' ' + round(p, 3); }).join(' · ') + '</p>';
    } else {
      h += '<p class="lede">Expected count = (row total × column total) ÷ grand total. ' + (S.part === 'p2' ? 'Work out the two-year row by hand; for the four-year row, subtract it from the column total.' : 'Work out Row 1 by hand. The coach shows the other rows once Row 1 is right.') + '</p><p class="formula">E = (row total × column total) ÷ grand total</p>';
    }
    h += '<p class="small">Round to 2 decimal places.</p>' + inputGrid('expected', 'Expected counts', S.test === 'gof' ? [0] : rowsToCheck(), false) + '<div id="expFb"></div><div id="condOut"></div>';
    return h;
  },
  refresh: function () {
    var ec = expCheck(), t = trueExp();
    document.querySelectorAll('input[data-grid="expected"]').forEach(function (inp) {
      var r = +inp.dataset.r, c = +inp.dataset.c, filled = inp.value.trim() !== '';
      var wrong = ec.wrong.some(function (w) { return w[0] === r && w[1] === c; });
      inp.classList.toggle('bad', filled && wrong); inp.classList.toggle('good', filled && !wrong && isFinite(num(inp.value)));
    });
    var allFilled = !ec.blank.length;
    var msg = !allFilled ? '' : ec.ok ? { ok: true, msg: 'All of your expected counts are correct.' }
      : { ok: false, msg: ec.wrong.length + ' expected count' + (ec.wrong.length > 1 ? 's are' : ' is') + ' off (outlined in red). ' + (S.test === 'gof' ? 'Multiply N by the proportion for that category.' : 'Use that cell’s row total and column total, and divide by the grand total.') };
    $('expFb').innerHTML = msg ? '<div class="fb ' + (msg.ok ? 'ok' : 'no') + '" role="status">' + (msg.ok ? '✓ ' : '! ') + esc(msg.msg) + '</div>' : '';
    var co = $('condOut');
    if (!ec.ok) { co.innerHTML = ''; return; }
    document.querySelectorAll('[data-show]').forEach(function (td) { var p = td.dataset.show.split('-'); td.textContent = fmt(t[+p[0]][+p[1]]); });
    var m = minE();
    co.innerHTML = '<h3 id="q-cond">Condition: are all expected counts at least 5?</h3><div class="choices" role="group" aria-labelledby="q-cond">' + choice('cond', 'yes', 'Yes, all are 5 or more', S.cond) + choice('cond', 'no', 'No, at least one is below 5', S.cond) + '</div>' + fb('fb3');
    wireChoices(co);
    if (!S.cond) return;
    var right = (m >= 5 ? 'yes' : 'no') === S.cond;
    if (!right) { setFb('fb3', { ok: false, msg: 'Look again at every expected count in the table, not the observed counts.' }); return; }
    if (m >= 5) { setFb('fb3', { ok: true, msg: 'Right. The smallest expected count is ' + fmt(m) + ', so the condition is met. (Record it in your lab.)' }); return; }
    var canMerge = !isOwn() && !S.merged && S.part !== 'p1a';
    setFb('fb3', { ok: true, msg: 'Right: the smallest expected count is ' + fmt(m) + '. ' + (canMerge ? 'Combine 2.0–2.49 with 2.5–2.99, then work out the expected counts again.'
      : isOwn() ? 'Combine two neighboring categories, enter the new counts in Step 2, and try again.'
      : 'Combining categories will not fix this, because the sample is too small. Use a larger school: the lab asks for at least 40 students in the two-year row.') });
    if (canMerge) { co.insertAdjacentHTML('beforeend', '<div class="btnrow"><button type="button" class="btn" id="mergeBtn">Combine 2.0–2.49 and 2.5–2.99</button></div>'); $('mergeBtn').onclick = function () { S.counts = mergeMiddle(S.counts); S.merged = true; S.expected = []; S.cond = null; S.cellC = null; save(); render(); }; }
  }
};
V[4] = {
  html: function () {
    var labs = catLabels(), rl = rowLabels(), o = obs(), steps;
    if (S.test === 'gof') {
      steps = '<ol class="steps"><li>Open the <a href="' + APPLET + '" target="_blank" rel="noopener">chi-square applet</a> (opens in a new tab) and choose <b>Goodness of Fit</b>.</li><li>Set <b>Number of Categories</b> to <b>' + nCols() + '</b>.</li><li>Type the observed counts in <b>Observed (O)</b> and your expected counts in <b>Expected (E)</b>, in this order:</li></ol>';
      steps += '<div class="tablewrap"><table><thead><tr><th scope="col">Applet row</th><th scope="col">GPA category</th><th scope="col">O</th><th scope="col">E</th></tr></thead><tbody>' +
        labs.map(function (l, j) { return '<tr><td>Category ' + (j + 1) + '</td><td>' + esc(l) + '</td><td>' + o[0][j] + '</td><td>' + esc(S.expected[0][j]) + '</td></tr>'; }).join('') + '</tbody></table></div>';
    } else {
      steps = '<ol class="steps"><li>Open the <a href="' + APPLET + '" target="_blank" rel="noopener">chi-square applet</a> (opens in a new tab) and choose <b>' + TAB[S.test] + '</b>.</li><li>Set <b>Number of Rows</b> to <b>' + nRows() + '</b> and <b>Number of Columns</b> to <b>' + nCols() + '</b>.</li><li>Type the counts so that each applet row is one row below and each column is one GPA category, in order:</li></ol>';
      steps += '<div class="tablewrap"><table><thead><tr><th scope="col">Applet row</th>' + labs.map(function (l, j) { return '<th scope="col">Column ' + (j + 1) + '<br>' + esc(l) + '</th>'; }).join('') + '</tr></thead><tbody>' +
        o.map(function (r, i) { return '<tr><th scope="row">Row ' + (i + 1) + ': ' + esc(rl[i]) + '</th>' + r.map(function (v) { return '<td>' + v + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
    }
    return '<h2>Run the applet</h2><p class="lede">The coach does not calculate χ² or the p-value. Leave α at 0.05 and select <b>Calculate χ² and P-value</b>, then type the results here.</p>' + steps +
      '<div class="grid2">' + field('chi', 'Chi-square statistic, χ²', S.chi, null, 'decimal') + field('df', 'Degrees of freedom, df', S.df, null, 'numeric') + '</div>' + fb('fb4c') + fb('fb4d') +
      field('pval', 'P-value', S.pval, 'If the applet shows “< 0.0001”, type 0.0001.', 'decimal') + fb('fb4p');
  },
  refresh: function () {
    var c = chiTruth();
    setFb('fb4c', String(S.chi).trim() && c ? checkChi(S.chi, c.exact, c.rounded) : null);
    setFb('fb4d', String(S.df).trim() ? checkDf(S.test, nRows(), nCols(), S.df) : null);
    var r = pvText() === '' ? null : checkPvalue(S.pval);
    setFb('fb4p', r && !r.ok ? r : (r ? { ok: true, msg: 'Recorded.' } : null));
  }
};
V[5] = {
  html: function () {
    if (pv() === null) return '<h2>Decide and conclude</h2><p class="warn">Record your p-value in the previous step first.</p>';
    return '<h2>Decide and conclude</h2><p class="lede">Your p-value is <b>' + esc(pvText()) + '</b> and α = 0.05.</p><h3 id="q-dec">What is the decision?</h3><div class="choices" role="group" aria-labelledby="q-dec">' +
      choice('decision', 'reject', 'Reject H₀', S.decision) + choice('decision', 'fail', 'Fail to reject H₀', S.decision) + '</div>' + fb('fb5') + '<div id="concOut"></div>';
  },
  refresh: function () {
    var p = pv(); if (p === null) return;
    setFb('fb5', S.decision ? checkDecision(p, S.decision, pvText()) : null);
    var o = $('concOut'); if (!o) return;
    if (!checkDecision(p, S.decision).ok) { o.innerHTML = ''; return; }
    o.innerHTML = '<div class="result"><h3>Your conclusion</h3>' + copyBlock('cdec', decisionSentence(p, S.decision, pvText())) + copyBlock('cctx', conclusionSentence(ctx(), S.decision)) +
      '<p class="small">' + (S.decision === 'fail' ? 'Never write “accept H₀” or “this proves the distributions are the same.”' : 'Rejecting H₀ says a difference or association exists. It does not say why.') + '</p></div>';
  }
};
V[6] = {
  html: function () {
    var labs = catLabels(), rl = rowLabels();
    var h = '<h2>Which cell contributes most?</h2><p class="lede">Find the largest component, (O − E)² ÷ E, in the applet’s results. The applet highlights components above 4.</p>';
    if (S.test !== 'gof') { h += '<h3 id="q-row">Which row?</h3><div class="choices stack" role="group" aria-labelledby="q-row">'; rl.forEach(function (r, i) { h += choice('cellR', i, esc(r), S.cellR); }); h += '</div>'; }
    h += '<h3 id="q-col">Which GPA category?</h3><div class="choices ' + (labs.length <= 4 ? 'four' : 'three') + '" role="group" aria-labelledby="q-col">';
    labs.forEach(function (l, j) { h += choice('cellC', j, esc(l), S.cellC); });
    h += '</div><h3 id="q-dir">Was the observed count higher or lower than expected?</h3><div class="choices" role="group" aria-labelledby="q-dir">' + choice('dir', 'higher', 'Higher than expected', S.dir) + choice('dir', 'lower', 'Lower than expected', S.dir) + '</div>' + fb('fb6') + '<div id="sumOut"></div>';
    return h;
  },
  refresh: function () {
    var o = obs(), t = trueExp(), row = S.test === 'gof' ? 0 : S.cellR;
    var r = checkLargest(o, t, row === null ? null : +row, S.cellC === null ? null : +S.cellC, S.dir);
    setFb('fb6', (S.cellC !== null || S.dir) ? r : null);
    var so = $('sumOut'); if (!so) return;
    if (!done(6)) { so.innerHTML = ''; return; }
    so.innerHTML = '<div class="result"><h3>Your full setup</h3><pre class="summary" id="sumText">' + esc(summary()) + '</pre><div class="btnrow"><button type="button" class="btn" data-copy="sumText">Copy everything</button><button type="button" class="btn ghost" id="again">Start another test</button></div></div>';
    $('again').onclick = function () { var keep = S.school; S = fresh(); S.school = keep; S.order = shuffle3(); save(); render(); };
  }
};
function summary() {
  var h = hypothesesFor(ctx()), o = obs(), t = trueExp(), lines = [], labs = catLabels(), rl = rowLabels(), T = totals(o);
  lines.push(TEST_NAMES[S.test] + (isOwn() ? '' : ' (' + PARTS[S.part].label + ')'));
  lines.push('H₀: ' + h.h0, 'Hₐ: ' + h.ha, 'Categories: ' + labs.join(', ') + (S.merged ? ' (2.0–2.49 and 2.5–2.99 combined)' : ''));
  o.forEach(function (r, i) { lines.push('Observed, ' + rl[i] + ': ' + r.join(', ') + ' (total ' + T.rows[i] + ')'); });
  lines.push('Smallest expected count: ' + fmt(minExpected(t)) + ' (at least 5, so the condition is met)');
  lines.push('χ² = ' + String(S.chi).trim() + ', df = ' + String(S.df).trim() + ', p-value = ' + pvText());
  lines.push(decisionSentence(pv(), S.decision, pvText()), conclusionSentence(ctx(), S.decision));
  var row = S.test === 'gof' ? 0 : +S.cellR;
  lines.push('Largest component: ' + (S.test === 'gof' ? '' : rl[row] + ', ') + labs[+S.cellC] + ' (observed ' + S.dir + ' than expected)');
  return lines.join('\n');
}

/* ---------- rendering and wiring ---------- */
function render() {
  $('tab-guide').setAttribute('aria-selected', S.mode === 'guide'); $('tab-practice').setAttribute('aria-selected', S.mode === 'practice');
  $('panel-guide').hidden = S.mode !== 'guide'; $('panel-practice').hidden = S.mode !== 'practice';
  if (S.mode === 'practice') { renderPractice(); return; }
  if (!reachable(S.step)) { var k = 0; while (k < STEPS.length - 1 && done(k)) k++; S.step = k; }
  var prog = $('progress'); prog.innerHTML = '';
  STEPS.forEach(function (name, i) {
    var li = document.createElement('li'), b = document.createElement('button'); b.type = 'button';
    b.className = 'pstep' + (i === S.step ? ' cur' : '') + (done(i) ? ' done' : ''); b.disabled = !reachable(i);
    b.innerHTML = '<span class="pn">' + (done(i) ? '✓' : (i + 1)) + '</span><span class="pl">' + name + '</span>';
    if (i === S.step) b.setAttribute('aria-current', 'step');
    b.onclick = function () { S.step = i; save(); render(); focusHead(); };
    li.appendChild(b); prog.appendChild(li);
  });
  $('stepBody').innerHTML = '<p class="kicker">Step ' + (S.step + 1) + ' of ' + STEPS.length + '</p>' + V[S.step].html();
  wire($('stepBody'));
  refreshAll();
}
function refreshAll() {
  V[S.step].refresh();
  var ok = done(S.step);
  $('backBtn').disabled = S.step === 0;
  $('nextBtn').disabled = !ok; $('nextBtn').hidden = S.step === STEPS.length - 1;
  $('navHint').textContent = (S.step < STEPS.length - 1 && !ok) ? 'Finish this step to continue.' : '';
  document.querySelectorAll('#progress .pstep').forEach(function (b, i) { b.classList.toggle('done', done(i)); b.disabled = !reachable(i); b.querySelector('.pn').textContent = done(i) ? '✓' : String(i + 1); });
}
function focusHead() { var h = $('stepBody').querySelector('h2'); if (h) { h.setAttribute('tabindex', '-1'); h.focus(); } }
/* answers that depend on the data are cleared when the data change */
function clearAfterData() { S.expected = []; S.cond = null; S.chi = ''; S.df = ''; S.pval = ''; S.decision = null; S.cellR = null; S.cellC = null; S.dir = null; }
function onChoice(b) {
  var name = b.getAttribute('data-name'), val = b.getAttribute('data-value');
  if (name === 'part' && val !== S.part) { var f = fresh(); f.part = val; f.school = S.school; f.order = shuffle3(); S = f; }
  else if (name === 'samples' || name === 'variables') { S.own[name] = val; }
  else if (name === 'test' && val !== S.test) { S.test = val; S.counts = []; S.merged = false; S.hyp = null; clearAfterData(); }
  else if (name === 'claimKind') { S.own.claimKind = val; clearAfterData(); }
  else if (name === 'cellR' || name === 'cellC') S[name] = +val;
  else S[name] = val;
  save(); render();
  var again = document.querySelector('button.choice[data-name="' + name + '"][data-value="' + CSS.escape(val) + '"]'); if (again) again.focus();
}
function wireChoices(root) { root.querySelectorAll('button.choice').forEach(function (b) { b.onclick = function () { onChoice(b); }; }); }
var TEXT = { school: 1, what: 1, var1: 1, var2: 1, chi: 1, df: 1, pval: 1 };
function wire(root) {
  wireChoices(root);
  root.querySelectorAll('input').forEach(function (inp) {
    inp.oninput = function () {
      var id = inp.id, g = inp.dataset.grid;
      if (g) { S[g][+inp.dataset.r][+inp.dataset.c] = inp.value; if (g === 'counts') clearAfterData(); else { S.cond = null; } }
      else if (TEXT[id]) S[id] = inp.value;
      else if (/^rn\d$/.test(id)) S.rowNames[+id[2]] = inp.value;
      else if (/^ownRow\d$/.test(id)) S.ownRows[+id.slice(6)] = inp.value;
      else if (/^prop\d$/.test(id)) { S.own.props[+id.slice(4)] = inp.value; clearAfterData(); }
      if (id === 'chi' || id === 'df' || id === 'pval') S.decision = id === 'pval' ? null : S.decision;
      save(); refreshAll();
    };
  });
  root.querySelectorAll('select').forEach(function (sel) {
    sel.onchange = function () { S.own[sel.id === 'ownrows' ? 'rows' : 'cols'] = +sel.value; S.counts = []; clearAfterData(); save(); render(); };
  });
}
function copyHandler(e) {
  var b = e.target.closest ? e.target.closest('[data-copy]') : null; if (!b) return;
  var src = $(b.getAttribute('data-copy')); if (!src) return;
  var ok = function () { var old = b.textContent; b.textContent = 'Copied'; setTimeout(function () { b.textContent = old; }, 1400); };
  var fall = function () { var r = document.createRange(); r.selectNodeContents(src); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'Selected: press Ctrl+C'; };
  try { navigator.clipboard.writeText(src.textContent).then(ok, fall); } catch (err) { fall(); }
}

/* ---------- practice ---------- */
var PR = { sc: null, ans: {}, res: null, right: 0, tries: 0, streak: 0 };
function newPr() { var prev = PR.sc; do { PR.sc = makePractice(Math.random); } while (PR.sc === prev); PR.ans = { test: null, df: '' }; PR.res = null; }
function renderPractice() {
  if (!PR.sc) newPr();
  var a = PR.ans;
  var h = '<p class="kicker" id="pk">Practice · ' + PR.right + ' right out of ' + PR.tries + ' · streak ' + PR.streak + '</p><p class="scenario" tabindex="-1">' + esc(PR.sc.t) + '</p>' +
    '<h3 id="pq1">1. Which test?</h3><div class="choices three" role="group" aria-labelledby="pq1">' + choice('pt', 'gof', 'Goodness of fit', a.test) + choice('pt', 'indep', 'Independence', a.test) + choice('pt', 'homog', 'Homogeneity', a.test) + '</div>' +
    field('pdf', '2. Degrees of freedom', a.df, 'Goodness of fit: categories − 1. Two-way table: (rows − 1)(columns − 1).', 'numeric') +
    '<div class="btnrow"><button type="button" class="btn" id="pcheck">Check</button><button type="button" class="btn ghost" id="pnext">New scenario</button></div><div id="pres" role="status" aria-live="polite"></div>';
  $('practiceBody').innerHTML = h;
  $('practiceBody').querySelectorAll('button.choice').forEach(function (b) { b.onclick = function () { PR.ans.test = b.getAttribute('data-value'); renderPractice(); var x = document.querySelector('button.choice[data-value="' + PR.ans.test + '"]'); if (x) x.focus(); }; });
  $('pdf').oninput = function () { PR.ans.df = this.value; };
  $('pcheck').onclick = function () {
    if (!PR.ans.test || !String(PR.ans.df).trim()) { $('pres').innerHTML = '<p class="warn">Answer both questions first.</p>'; return; }
    var r = checkPractice(PR.sc, PR.ans); PR.tries++; if (r.ok) { PR.right++; PR.streak++; } else PR.streak = 0;
    $('pres').innerHTML = '<div class="fb ' + (r.ok ? 'ok' : 'no') + '">' + (r.ok ? '<p>✓ Right: ' + esc(TEST_NAMES[PR.sc.test]) + ', df = ' + PR.sc.df + '.</p>' : '<ul>' + r.msgs.map(function (m) { return '<li>' + esc(m) + '</li>'; }).join('') + '</ul>') + '</div>';
    $('pk').textContent = 'Practice · ' + PR.right + ' right out of ' + PR.tries + ' · streak ' + PR.streak;
  };
  $('pnext').onclick = function () { newPr(); renderPractice(); var s = document.querySelector('.scenario'); if (s) s.focus(); };
}

/* ---------- start ---------- */
document.addEventListener('click', copyHandler);
load(); if (!S.order || S.order.length !== 3) S.order = shuffle3();
$('tab-guide').onclick = function () { S.mode = 'guide'; save(); render(); };
$('tab-practice').onclick = function () { S.mode = 'practice'; save(); render(); };
$('backBtn').onclick = function () { if (S.step > 0) { S.step--; save(); render(); focusHead(); } };
$('nextBtn').onclick = function () { if (done(S.step) && S.step < STEPS.length - 1) { S.step++; save(); render(); focusHead(); } };
$('resetBtn').onclick = function () { $('resetConfirm').hidden = false; };
$('resetNo').onclick = function () { $('resetConfirm').hidden = true; };
$('resetYes').onclick = function () { S = fresh(); S.order = shuffle3(); try { localStorage.removeItem(KEY); } catch (e) {} $('resetConfirm').hidden = true; render(); };
render();
})();

</script>
