<div class="wrap">
  <header class="top">
    <h1><small>Math 1342 · Final review</small>Find the Mistake</h1>
    <div class="meta" id="meta"></div>

  <main id="app" aria-live="polite"></main>

<script>
/* ===========================================================================
   REASONABLE DOUBT — shared puzzle engine (Math 1342, Exam IV review)
   Every lock generates a fresh problem on each load, so this file is the
   single source of statistical truth. It is tested standalone by test.js
   (against SciPy values) and then inlined verbatim into each room page.
   Test statistics and p-values are computed the way the course applets do:
   one-proportion SE uses p0, two-proportion SE uses the pooled p-hat, and the
   two-sample t-test uses Welch's df rounded down.
   =========================================================================== */

/* ---------- small helpers ---------- */
const RI = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;   /* inclusive */
const RF = (a, b, d) => +(a + Math.random() * (b - a)).toFixed(d);   /* random decimal */
const PICK = a => a[Math.floor(Math.random() * a.length)];
const SHUF = a => { for (let i = a.length - 1; i > 0; i--) { const j = RI(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const MINUS = '−';
const sgn = n => (n < 0 ? MINUS + Math.abs(n) : String(n));
const r2 = x => (Math.round(x * 100) / 100).toFixed(2).replace('-', MINUS);
const r4 = x => (Math.round(x * 10000) / 10000).toFixed(4);
const pTxt = p => (p < 0.0001 ? 'less than 0.0001' : r4(p));
const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
const trim0 = x => String(+(+x).toFixed(4));
const sum = a => a.reduce((s, x) => s + x, 0);
const mean = a => sum(a) / a.length;
const sd = a => { const m = mean(a); return Math.sqrt(sum(a.map(x => (x - m) * (x - m))) / (a.length - 1)); };

/* ---------- distributions ---------- */
/* complementary error function (Numerical Recipes erfcc, |error| < 1.2e-7) */
function erfc(x) {
  const z = Math.abs(x), t = 1 / (1 + 0.5 * z);
  const r = t * Math.exp(-z * z - 1.26551223 + t * (1.00002368 + t * (0.37409196 + t * (0.09678418 + t * (-0.18628806 +
    t * (0.27886807 + t * (-1.13520398 + t * (1.48851587 + t * (-0.82215223 + t * 0.17087277)))))))));
  return x >= 0 ? r : 2 - r;
}
const normCDF = z => 0.5 * erfc(-z / Math.SQRT2);
function logGamma(x) {
  const c = [76.18009172947146, -86.50532032941677, 24.01409824083091, -1.231739572450155, 0.1208650973866179e-2, -0.5395239384953e-5];
  let y = x, tmp = x + 5.5; tmp -= (x + 0.5) * Math.log(tmp);
  let ser = 1.000000000190015; for (let j = 0; j < 6; j++) ser += c[j] / ++y;
  return -tmp + Math.log(2.5066282746310005 * ser / x);
}
/* regularized incomplete beta I_x(a, b), continued fraction */
function betacf(a, b, x) {
  const FPMIN = 1e-300; let qab = a + b, qap = a + 1, qam = a - 1, c = 1, d = 1 - qab * x / qap;
  if (Math.abs(d) < FPMIN) d = FPMIN; d = 1 / d; let h = d;
  for (let m = 1; m <= 300; m++) {
    const m2 = 2 * m; let aa = m * (b - m) * x / ((qam + m2) * (a + m2));
    d = 1 + aa * d; if (Math.abs(d) < FPMIN) d = FPMIN; c = 1 + aa / c; if (Math.abs(c) < FPMIN) c = FPMIN; d = 1 / d; h *= d * c;
    aa = -(a + m) * (qab + m) * x / ((a + m2) * (qap + m2));
    d = 1 + aa * d; if (Math.abs(d) < FPMIN) d = FPMIN; c = 1 + aa / c; if (Math.abs(c) < FPMIN) c = FPMIN; d = 1 / d;
    const del = d * c; h *= del; if (Math.abs(del - 1) < 1e-14) break;
  }
  return h;
}
function betai(a, b, x) {
  if (x <= 0) return 0; if (x >= 1) return 1;
  const bt = Math.exp(logGamma(a + b) - logGamma(a) - logGamma(b) + a * Math.log(x) + b * Math.log(1 - x));
  return x < (a + 1) / (a + b + 2) ? bt * betacf(a, b, x) / a : 1 - bt * betacf(b, a, 1 - x) / b;
}
function tCDF(t, df) { const p = 0.5 * betai(df / 2, 0.5, df / (df + t * t)); return t > 0 ? 1 - p : p; }
/* upper tail of chi-square: regularized gamma Q(k/2, x/2) */
function gammaQ(a, x) {
  if (x <= 0) return 1;
  if (x < a + 1) {                                   /* series for P, then 1 - P */
    let ap = a, s = 1 / a, del = s;
    for (let n = 0; n < 500; n++) { ap++; del *= x / ap; s += del; if (Math.abs(del) < Math.abs(s) * 1e-15) break; }
    return 1 - s * Math.exp(-x + a * Math.log(x) - logGamma(a));
  }
  let b = x + 1 - a, c = 1e300, d = 1 / b, h = d;     /* continued fraction for Q */
  for (let i = 1; i < 500; i++) {
    const an = -i * (i - a); b += 2; d = an * d + b; if (Math.abs(d) < 1e-300) d = 1e-300;
    c = b + an / c; if (Math.abs(c) < 1e-300) c = 1e-300; d = 1 / d; const del = d * c; h *= del; if (Math.abs(del - 1) < 1e-15) break;
  }
  return Math.exp(-x + a * Math.log(x) - logGamma(a)) * h;
}
const chiSF = (x, df) => gammaQ(df / 2, x / 2);
/* p-value for a z or t statistic, by the sign in Ha */
function pFromStat(stat, sign, df) {
  const cdf = df ? tCDF(stat, df) : normCDF(stat);
  return sign === '<' ? cdf : sign === '>' ? 1 - cdf : 2 * Math.min(cdf, 1 - cdf);
}

/* ---------- answer parsing ---------- */
function parseNum(s) {
  const t = String(s == null ? '' : s).trim().replace(/[−–—]/g, '-').replace(/\s+/g, '').replace(/^\+/, '');
  if (!/^-?(\d+\.?\d*|\.\d+)$/.test(t)) {
    const m = t.match(/^(-?\d+)\/(\d+)$/); if (m && +m[2] !== 0) return +m[1] / +m[2];
    return NaN;
  }
  return parseFloat(t);
}
const numEq = (s, v, tol) => { const x = parseNum(s); return !isNaN(x) && Math.abs(x - v) <= (tol == null ? 1e-9 : tol) + 1e-12; };
const statEq = (s, v) => numEq(s, v, 0.011);                 /* test statistics: 2 decimals is enough */
const expEq = (s, v) => numEq(s, v, 0.011);                  /* expected counts */
/* p-values: right to about 3 decimals; a tiny p may be typed as 0 or 0.0001 */
function pEq(s, p) {
  const x = parseNum(s); if (isNaN(x) || x < 0 || x > 1) return false;
  if (p < 0.0005) return x <= 0.0006;
  return Math.abs(x - p) <= Math.max(0.0011, 0.01 * p);
}
/* multiple choice: the field remembers its right option text */
const mc = (label, right, wrong) => ({ type: 'mc', label, options: SHUF([right].concat(wrong)), check: v => v === right, show: right });
const signOpts = (lhs, rhs, right) => {
  const all = ['<', '>', '≠', '='].map(s => lhs + ' ' + s + ' ' + rhs);
  return mc('The alternative hypothesis H<sub>a</sub>', lhs + ' ' + right + ' ' + rhs, all.filter(x => x !== lhs + ' ' + right + ' ' + rhs));
};
const TAILWORD = { '<': 'left-tail', '>': 'right-tail', '≠': 'two-tail' };
const DIRWORD = { '<': 'less than', '>': 'greater than', '≠': 'different from' };


const fr = (a, b) => a + '/' + b;
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a || 1; };
const frac = (a, b) => { const g = gcd(a, b); return (a / g) + '/' + (b / g); };
const p4 = x => (Math.round(x * 10000) / 10000).toFixed(4);
const probEq = (s, v) => numEq(s, v, 0.0006);                     /* a probability to 4 places, or an exact fraction */
const dec2Eq = (s, v) => numEq(s, v, 0.0051);                     /* to 2 places, or an exact fraction */
const money2 = x => (x < 0 ? '−$' : '$') + Math.abs(x).toFixed(2);
const moneyEq = (s, v) => { const t = String(s).replace(/\$/g, '').replace(/^\s*[−–—]/, '-').replace(/^-\s*/, '-'); return numEq(t, v, 0.0051); };
function normInv(p) { let lo = -10, hi = 10; for (let i = 0; i < 100; i++) { const m = (lo + hi) / 2; if (normCDF(m) < p) lo = m; else hi = m; } return (lo + hi) / 2; }
function tInv(p, df) { let lo = -60, hi = 60; for (let i = 0; i < 120; i++) { const m = (lo + hi) / 2; if (tCDF(m, df) < p) lo = m; else hi = m; } return (lo + hi) / 2; }
const r1 = x => (Math.round(x * 10) / 10).toFixed(1);
/* a normal probability between a and b: accept the applet's exact answer or the table answer with z rounded to 2 places */
function normBetween(a, b, mu, s) {
  const exact = normCDF((b - mu) / s) - normCDF((a - mu) / s);
  const rz = z => Math.round(z * 100) / 100;
  const table = normCDF(rz((b - mu) / s)) - normCDF(rz((a - mu) / s));
  return { exact, table, check: v => numEq(v, exact, 0.0011) || numEq(v, table, 0.0011) };
}

/* ===========================================================================
   FIND THE MISTAKE — generators (Math 1342 final review)
   Each generator builds a worked solution with ONE planted mistake. Later
   steps carry that mistake forward, so the student must find the FIRST
   step that goes wrong, fix it, and name the kind of mistake.
   Returns { unit, topic, prompt, steps:[{w, r}], bad, fix, err, not?, why, meta }
     steps[i].w = the step as the student wrote it, .r = the correct step
     bad        = index of the first wrong step (steps before it have w === r)
     fix        = {type:'num', label, ph, check, show, wrong} or {type:'mc', label, options, show}
   Course conventions: probabilities to 4 places; z rounded to 2 places
   before a table lookup (both the exact and the table answer are accepted).
   =========================================================================== */
const ERRORS = {
  stratVsCluster: { fam: 'design', name: 'Mixed up stratified and cluster sampling' },
  falseZero: { fam: 'design', name: 'Treated an arbitrary zero as a true zero' },
  noAssignment: { fam: 'design', name: 'Called it an experiment with no treatment' },
  divN: { fam: 'describe', name: 'Divided by n instead of n − 1 for a sample' },
  unsorted: { fam: 'describe', name: 'Found the middle before sorting the data' },
  fenceNo15: { fam: 'describe', name: 'Left out the 1.5 when building the fence' },
  noOverlap: { fam: 'prob', name: 'Counted the people in both groups twice' },
  condTotal: { fam: 'prob', name: 'Used the grand total, not the “given” row' },
  wrongEach: { fam: 'prob', name: 'Used the probability of the wrong outcome' },
  withRepl: { fam: 'prob', name: 'Treated dependent draws as independent' },
  permVsComb: { fam: 'prob', name: 'Used a permutation when order is irrelevant' },
  combVsPerm: { fam: 'prob', name: 'Used a combination when the order matters' },
  atLeastBoundary: { fam: 'prob', name: 'Put k on the wrong side of the complement' },
  grossNotNet: { fam: 'prob', name: 'Forgot to subtract the cost from the prizes' },
  noSqrt: { fam: 'spread', name: 'Left the square root off the SD formula' },
  wrongTail: { fam: 'normal', name: 'Gave the area on the wrong side of the z' },
  zBackwards: { fam: 'normal', name: 'Computed μ − x on top instead of x − μ' },
  noSqrtN: { fam: 'normal', name: 'Used σ instead of σ/√n for a sample mean' },
  uniformHeight: { fam: 'normal', name: 'Made the height 1/b instead of 1/(b − a)' },
  invSign: { fam: 'normal', name: 'Used z with the wrong sign for this tail' },
  zNotT: { fam: 'interval', name: 'Used z* when only the sample SD s was known' },
  roundDown: { fam: 'interval', name: 'Rounded the sample size down instead of up' },
  wrongCrit: { fam: 'interval', name: 'Used the critical value for another level' },
  seUsesPhat: { fam: 'test', name: 'Used p̂ instead of p₀ in the test’s SE' },
  notDoubled: { fam: 'test', name: 'Forgot to double the two-tailed p-value' },
  haDirection: { fam: 'test', name: 'Pointed Hₐ the opposite way from the claim' },
  decisionBackwards: { fam: 'test', name: 'Compared the p-value to α the wrong way' },
  provesNull: { fam: 'test', name: 'Treated “fail to reject” as proving H₀' },
  pairedAsIndep: { fam: 'test', name: 'Treated paired data as independent samples' },

  let t, p; do { t = +((dir === 'less than' ? -1 : 1) * (0.2 + Math.random() * 1.1)).toFixed(2); p = dir === 'different from' ? 2 * (1 - tCDF(Math.abs(t), df)) : dir === 'more than' ? 1 - tCDF(t, df) : tCDF(t, df); } while (p < 0.1);
  return { prompt: 'A t-test checks whether the mean ' + c[0] + ' is ' + dir + ' ' + c[2] + ' ' + c[1] + ' (n = ' + n + ', α = 0.05).',
    steps: [W('t = ' + r2(t) + ', df = ' + df), W('p-value = ' + p4(p)), W(p4(p) + ' > 0.05, so fail to reject H₀.'),
      WR('This proves the mean ' + c[0] + ' is ' + c[2] + ' ' + c[1] + '.', 'There is not enough evidence that the mean is ' + dir + ' ' + c[2] + ' ' + c[1] + '.')],
    bad: 3, fix: mcFix('The conclusion should say', 'Not enough evidence the mean is ' + dir + ' ' + c[2], ['Clear evidence that the mean is ' + dir + ' ' + c[2], 'Strong evidence the mean equals ' + c[2] + ' exactly', 'Not enough evidence, so H₀ must be true']), err: 'provesNull',
    why: 'Failing to reject means the data <i>could</i> fit H₀. It is not proof that H₀ is true.', meta: { kind: 'provesNull', t, df, p } };
} };
G.paired = { unit: 'u4', topic: 'Choosing a two-sample test', make() {
  const c = PICK([['patients', 'cholesterol', 'before and after a new diet'], ['students', 'quiz scores', 'before and after a review session'], ['runners', 'mile times', 'with old shoes and with new shoes'], ['textbooks', 'prices', 'at the campus store and online']]);
  const n = RI(10, 18);
  return { prompt: 'The ' + c[1] + ' of the same ' + n + ' ' + c[0] + ' are recorded ' + c[2] + '. Did they change on average?',
    steps: [W('There are two lists of ' + n + ' ' + c[1] + '.'), WR('Two lists, so use a two-sample t-test for independent means.', 'Each of the ' + n + ' ' + c[0] + ' is measured twice: a matched-pairs t-test.'),
      WR('Find the mean and SD of each list separately.', 'Find the difference for each of the ' + c[0] + ', then the mean and SD of the differences.'),
      WR('Use Welch’s formula for the degrees of freedom.', 'df = n − 1 = ' + (n - 1))],
    bad: 1, fix: mcFix('The right test is', 'Matched-pairs t-test on the differences', ['Two-proportion z-test on the two lists', 'Chi-square test of independence on counts', 'One-sample z-test on the first list only']), err: 'pairedAsIndep',
    why: 'The two lists come from the <i>same</i> ' + c[0] + ', so they are paired. Analyze the ' + n + ' differences.', meta: { kind: 'paired', n } };
} };
G.chiEqual = { unit: 'u4', topic: 'Chi-square: goodness of fit', make() {
  const c = PICK([[['O', 'A', 'B', 'AB'], [0.44, 0.42, 0.10, 0.04], 'blood types of donors', 'the national percents'], [['Red', 'Blue', 'Green', 'Yellow', 'Orange'], [0.3, 0.25, 0.2, 0.15, 0.1], 'candy colors in a bag', 'the company’s stated mix'], [['Morning', 'Afternoon', 'Evening'], [0.5, 0.3, 0.2], 'class times students pick', 'the registrar’s percents']]);
  const k = c[0].length, n = PICK([100, 150, 200, 250, 300, 400]);
  const exp = c[1].map(p => n * p);
  let obs; do { obs = exp.map(e => Math.max(1, Math.round(e + (Math.random() * 2 - 1) * Math.sqrt(e) * 1.6))); obs[k - 1] += n - sum(obs); } while (obs.some(o => o < 1));
  const ew = n / k, chiW = sum(obs.map(o => (o - ew) * (o - ew) / ew)), chiR = sum(obs.map((o, i) => (o - exp[i]) * (o - exp[i]) / exp[i]));
  const j = c[1].findIndex(p => Math.abs(p - 1 / k) > 0.02);

    steps: [W('H₀: the percents match the claim.'), WR('Expected count for each category = ' + n + '/' + k + ' = ' + trim0(ew), 'Expected = n × claimed percent: ' + c[0].map((x, i) => x + ' ' + trim0(exp[i])).join(', ')),
      WR('χ² = Σ(O − E)²/E = ' + r2(chiW), 'χ² = Σ(O − E)²/E = ' + r2(chiR)), WR('df = ' + (k - 1) + ', p-value = ' + pTxt(chiSF(chiW, k - 1)), 'df = ' + (k - 1) + ', p-value = ' + pTxt(chiSF(chiR, k - 1)))],
    bad: 1, fix: numFix('Expected count for ' + c[0][j] + ' =', exp[j], trim0(exp[j]), expEq, ew), err: 'equalExpected',
    why: 'Expected counts come from H₀. The claim is not “equal shares,” so each expected count is n × its claimed percent.', meta: { kind: 'gof', obs, p: c[1], chiR } };
} };
G.dfWrong = { unit: 'u4', topic: 'Chi-square: degrees of freedom', make() {
  if (Math.random() < 0.5) {
    const r = RI(2, 4), cc = RI(2, 4) + (r === 2 ? 1 : 0), dfw = r * cc - 1, dfr = (r - 1) * (cc - 1);
    const chi = +(dfr + 2 + Math.random() * (dfr + 4)).toFixed(2);
    const ctx = PICK(['class year and favorite study spot', 'age group and news source', 'major and preferred class time', 'region and favorite sport']);
    return { prompt: 'A test of independence for ' + ctx + ' uses a table with ' + r + ' rows and ' + cc + ' columns. The test statistic is χ² = ' + r2(chi) + '.',
      steps: [W('χ² = ' + r2(chi)), WR('df = (rows)(columns) − 1 = ' + r + '(' + cc + ') − 1 = ' + dfw, 'df = (rows − 1)(columns − 1) = ' + (r - 1) + '(' + (cc - 1) + ') = ' + dfr),
        WR('p-value = ' + pTxt(chiSF(chi, dfw)), 'p-value = ' + pTxt(chiSF(chi, dfr)))],
      bad: 1, fix: numFix('df =', dfr, String(dfr), intEq, dfw), err: 'dfWrong',
      why: 'For a two-way table, df = (rows − 1)(columns − 1).', meta: { kind: 'df', chi, df: dfr } };
  }
  const k = RI(3, 6), chi = +(k + Math.random() * 5).toFixed(2), ctx = PICK(['days of the week a store is busiest (' + k + ' days)', 'a spinner with ' + k + ' colors', 'favorite of ' + k + ' menu items', 'a ' + k + '-sided die']);
  return { prompt: 'A goodness-of-fit test for ' + ctx + ' has ' + k + ' categories and χ² = ' + r2(chi) + '.',
    steps: [W('χ² = ' + r2(chi)), WR('df = number of categories = ' + k, 'df = categories − 1 = ' + (k - 1)), WR('p-value = ' + pTxt(chiSF(chi, k)), 'p-value = ' + pTxt(chiSF(chi, k - 1)))],
    bad: 1, fix: numFix('df =', k - 1, String(k - 1), intEq, k), err: 'dfWrong',
    why: 'For goodness of fit, df = (number of categories) − 1.', meta: { kind: 'df', chi, df: k - 1 } };
} };
G.residual = { unit: 'u4', topic: 'Residuals', make() {
  const c = PICK([['hours studied', 'quiz score'], ['temperature (°F)', 'iced coffees sold'], ['square feet (hundreds)', 'price ($ thousands)'], ['ad spending ($ hundreds)', 'sales ($ hundreds)']]);
  let a, b, x, y, yh; do { a = RF(5, 60, 1); b = RF(0.5, 6, 2); x = RI(2, 20); yh = a + b * x; y = Math.round(yh + (Math.random() < 0.5 ? -1 : 1) * RF(1, 9, 1)); } while (Math.abs(y - yh) < 0.6);
  const res = y - yh;
  return { prompt: 'The line ' + lineTxt(a, b, 'x') + ' predicts ' + c[1] + ' from ' + c[0] + '. One data point is (' + x + ', ' + y + '). Find its residual.',
    steps: [W('ŷ = ' + r2(a) + ' + ' + r2(b) + '(' + x + ') = ' + r2(yh)), WR('Residual = ŷ − y = ' + r2(yh) + ' − ' + y + ' = ' + r2(-res), 'Residual = y − ŷ = ' + y + ' − ' + r2(yh) + ' = ' + r2(res)),
      WR('The ' + (res < 0 ? 'positive' : 'negative') + ' residual means the point is ' + (res < 0 ? 'above' : 'below') + ' the line.', 'The ' + (res > 0 ? 'positive' : 'negative') + ' residual means the point is ' + (res > 0 ? 'above' : 'below') + ' the line.')],
    bad: 1, fix: numFix('Residual =', res, r2(res), statEq, -res, '2 decimals'), err: 'residualBackwards',
    why: 'Residual = observed − predicted = y − ŷ. A point above the line has a positive residual.', meta: { kind: 'resid', a, b, x, y, res } };
} };
G.swapSlope = { unit: 'u4', topic: 'Regression line', make() {
  const c = PICK([['hours of practice', 'free-throw percent'], ['age of a car (years)', 'value ($ thousands)'], ['study hours', 'exam score'], ['outside temperature (°F)', 'heating bill ($)']]);
  let a, b; do { a = RF(10, 80, 1); b = RF(-4, 4, 2); } while (Math.abs(b) < 0.4);
  const x = RI(3, 15), yw = b + a * x, yr = a + b * x;
  const right = lineTxt(a, b, 'x');
  return { prompt: 'Regression output for predicting ' + c[1] + ' from ' + c[0] + ': <b>intercept = ' + r2(a) + ', slope = ' + r2(b) + '</b>. Predict y when x = ' + x + '.',
    steps: [WR('Line: ' + lineTxt(b, a, 'x'), 'Line: ' + right), WR('ŷ = ' + r2(b) + ' + ' + r2(a) + '(' + x + ') = ' + r2(yw), 'ŷ = ' + r2(a) + ' + ' + r2(b) + '(' + x + ') = ' + r2(yr)),
      WR('Each extra unit of x changes ŷ by ' + r2(a) + '.', 'Each extra unit of x changes ŷ by ' + r2(b) + '.')],
    bad: 0, fix: mcFix('The line should be', right, [lineTxt(a, -b, 'x'), lineTxt(-b, a, 'x'), lineTxt(b, -a, 'x')]), err: 'swapSlope',
    why: 'In ŷ = a + bx, a is the intercept (ŷ when x = 0) and b, the slope, multiplies x.', meta: { kind: 'swap', a, b, x, yr } };
} };
G.rSign = { unit: 'u4', topic: 'Correlation', make() {
  const neg = Math.random() < 0.7, r = neg ? -RF(0.8, 0.95, 2) : RF(0.08, 0.2, 2);
  const c = PICK([['hours of TV watched', 'GPA'], ['car age', 'resale value'], ['outside temperature', 'heating bill'], ['absences', 'final exam score']]);
  const wTxt = neg ? 'weak' : 'strong', rTxt = neg ? 'Strong and negative' : 'Weak and positive';
  return { prompt: 'For ' + c[0] + ' and ' + c[1] + ', the correlation is r = ' + r2(r) + '. Describe the relationship.',
    steps: [W('r = ' + r2(r)), WR('r is ' + (neg ? 'negative' : 'positive') + ', so the relationship is ' + wTxt + '.', neg ? '|r| is close to 1, so the relationship is strong, and it is negative.' : '|r| is close to 0, so the relationship is weak, and it is positive.'),
      WR(neg ? 'So ' + c[0] + ' tells us little about ' + c[1] + '.' : 'So ' + c[0] + ' is a good predictor of ' + c[1] + '.', neg ? 'As ' + c[0] + ' increases, ' + c[1] + ' tends to decrease.' : 'So ' + c[0] + ' tells us little about ' + c[1] + '.')],
    bad: 1, fix: mcFix('The relationship is', rTxt, ['Strong and negative', 'Weak and negative', 'Strong and positive', 'Weak and positive'].filter(o => o !== rTxt && o !== (neg ? 'Weak and negative' : 'Strong and positive'))), err: 'signIsStrength',
    why: 'The sign of r gives the direction; its size |r| gives the strength. |r| = ' + r2(Math.abs(r)) + ' is ' + (neg ? 'close to 1.' : 'close to 0.'), meta: { kind: 'rsign', r } };
} };

/* ---------------- sets ---------------- */
const UNIT_WEIGHT = { u1: 1, u2: 3, u3: 4, u4: 4 };        /* weighted toward the calculation-heavy units */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function withSeed(seed, fn) { const orig = Math.random; Math.random = mulberry32(seed); try { return fn(); } finally { Math.random = orig; } }
/* error-name options: the right name and three others, from the same family first */
function errOptions(key, not) {
  const fam = ERRORS[key].fam, avoid = new Set([key].concat(not || []));
  const pool = [fam].concat(FAM_NEXT[fam]).map(f => SHUF(Object.keys(ERRORS).filter(k => ERRORS[k].fam === f && !avoid.has(k))));
  const out = [key];
  pool.forEach(list => list.forEach(k => { if (out.length < 4 && !out.includes(k)) out.push(k); }));
  return SHUF(out);
}
/* How many problems each chosen unit gets (largest remainder), then which generators. */
function planSet(units, n) {
  const w = units.map(u => UNIT_WEIGHT[u]), tot = sum(w), raw = w.map(x => n * x / tot), cnt = raw.map(Math.floor);
  raw.map((x, i) => [x - cnt[i], i]).sort((a, b) => b[0] - a[0]).slice(0, n - sum(cnt)).forEach(([, i]) => cnt[i]++);
  const picks = [];
  units.forEach((u, i) => {
    const keys = Object.keys(G).filter(k => G[k].unit === u);
    let bag = [];
    for (let j = 0; j < cnt[i]; j++) { if (!bag.length) bag = SHUF(keys.slice()); picks.push(bag.pop()); }
  });
  /* keep units in course order, mixed within a unit */
  return picks;
}
function buildSet(code, units, n) {
  return withSeed(code * 7919, () => planSet(units, n)).map((key, i) => withSeed(code * 1000 + i + 1, () => {
    const p = G[key].make();
    p.key = key; p.unit = G[key].unit; p.topic = G[key].topic; p.errOpts = errOptions(p.err, p.not);
    return p;
  }));
}

<script>
/* ==================================================================
   Page logic. Each problem goes through three parts:
   find (tap the first wrong step) → fix (what the step should say)
   → name (what kind of mistake). One point per part on the first try.
   Progress is saved on this device, and a set code rebuilds the
   same problems on every device, so a class can go over them together.
   ================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const SAVE = 'findMistakeV1', app = $('app');
const UNITS = [['u1', 'Unit I · Collecting data', 'Sampling, levels of measurement, study design'],
  ['u2', 'Unit II · Describing data & probability', 'Standard deviation, median, outliers, probability rules, counting, binomial, expected value'],
  ['u3', 'Unit III · Distributions & intervals', 'Normal, z-scores, CLT, uniform, confidence intervals, sample size'],
  ['u4', 'Unit IV · Tests & regression', 'Hypotheses, test statistics, p-values, decisions, chi-square, residuals, correlation']];
const UNIT_SHORT = { u1: 'Unit I', u2: 'Unit II', u3: 'Unit III', u4: 'Unit IV' };
const APPLETS = [['Summary-Stats-Single-Variable.html', 'Summary statistics', ['divN', 'unsorted', 'fence']], ['Binomial-Distribution.html', 'Binomial distribution', ['binomAtLeast', 'binomSD']],
  ['UniformDistribution.html', 'Uniform distribution', ['uniform']], ['Normal-Model.html', 'Normal model', ['wrongTail', 'zBackwards', 'invSign']], ['Sample-Means.html', 'Sample means (CLT)', ['cltSE']],
  ['Intervals.html', 'Confidence intervals', ['zNotT', 'propSE', 'roundDown', 'wrongCrit']], ['Hypothesis-single.html', 'One-sample tests', ['seUsesPhat', 'notDoubled', 'haDirection', 'decision', 'provesNull']],
  ['Hypothesis-twosample.html', 'Two-sample tests', ['paired']], ['Chi-Square.html', 'Chi-square', ['chiEqual', 'dfWrong']], ['Regression.html', 'Regression', ['residual', 'swapSlope', 'rSign']]];

/* ---------- state ---------- */
let S = null;          // { code, units, n, i, res: [ per problem ] }
let SET = [];          // the generated problems
let calcOpen = false;
const blankRes = () => ({ part: 'find', taps: [], found: null, fixTries: [], fixed: null, name: null, named: null });
function save() { try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {} }
function load() { try { return JSON.parse(localStorage.getItem(SAVE) || 'null'); } catch (e) { return null; } }
function start(code, units, n) {
  S = { code, units, n, i: 0, res: Array.from({ length: n }, blankRes) };
  SET = buildSet(code, units, n); save(); render();
}
const doneCount = () => S.res.filter(r => r.part === 'done').length;
const pts = r => (r.found ? 1 : 0) + (r.fixed ? 1 : 0) + (r.named ? 1 : 0);

/* ---------- screens ---------- */
function render() {
  if (!S) return renderSetup();
  if (S.i >= S.n) return renderEnd();
  renderProblem();
}
function drawMeta() {
  $('meta').innerHTML = S ? 'Set <b>' + S.code + '</b> · ' + doneCount() + ' of ' + S.n + ' done' : '';
}

function renderSetup() {
  drawMeta();
  const saved = load(), code = 1000 + Math.floor(Math.random() * 9000);
  let h = '<div class="setup"><div class="card"><h2>Set up</h2><fieldset><legend>Units</legend>' +
    UNITS.map(u => '<label class="chk"><input type="checkbox" data-u="' + u[0] + '" checked><span>' + u[1] + '<small>' + u[2] + '</small></span></label>').join('') +
    '</fieldset><fieldset><legend>Problems</legend><div class="row"><label for="n">How many</label><input type="number" id="n" min="4" max="24" value="12"><span class="lede" style="margin:0">about 2½ minutes each</span></div>' +
    '<div class="row"><label for="code">Set code</label><input type="text" id="code" inputmode="numeric" maxlength="4" value="' + code + '"></div>' +
    '<p class="lede" style="font-size:15px">Give every group the same code, units and number to get the same problems, so you can go over them together. A new code gives new numbers.</p></fieldset>' +
    '<div class="btnrow"><button class="btn" id="go">Start</button>' + (saved && saved.res ? '<button class="btn quiet" id="resume">Resume set ' + saved.code + ' (' + saved.res.filter(r => r.part === 'done').length + ' of ' + saved.n + ' done)</button>' : '') + '</div><p class="lede" id="err" style="color:var(--no);margin-top:10px"></p></div>' +
    '<div class="card how"><h2>How it works</h2><p class="lede">Each problem shows a student’s worked solution with exactly one mistake. Later steps may look wrong too, because they use the bad result.</p><ol>' +
    '<li><b>Find</b> the <i>first</i> step that goes wrong.</li><li><b>Fix</b> it: what should that step say?</li><li><b>Name</b> the kind of mistake.</li></ol>' +
    '<p class="lede" style="margin-top:12px">Each part earns a point when it is right on the first try. Use a calculator or the course applets in the side panel to check the numbers.</p></div></div>';
  app.innerHTML = h;
  $('go').onclick = () => {
    const units = [...app.querySelectorAll('[data-u]')].filter(x => x.checked).map(x => x.dataset.u);
    const n = Math.max(4, Math.min(24, parseInt($('n').value, 10) || 12)), c = parseInt($('code').value, 10);
    if (!units.length) { $('err').textContent = 'Pick at least one unit.'; return; }
    if (!(c >= 1000 && c <= 9999)) { $('err').textContent = 'The set code is a 4-digit number.'; return; }
    start(c, units, n);
  };
  if ($('resume')) $('resume').onclick = () => { S = saved; SET = buildSet(S.code, S.units, S.n); render(); };
}

function renderProblem() {
  drawMeta();
  const p = SET[S.i], r = S.res[S.i], done = r.part === 'done';
  const partTag = (key, label) => '<span class="part ' + (r[key] === true ? 'ok' : r[key] === false ? 'no' : r.part === label.toLowerCase() ? 'now' : '') + '">' + label + (r[key] === true ? ' ✓' : r[key] === false ? ' ✗' : '') + '</span>';
  let h = '<div class="stage"><div class="card"><span class="chip">Problem ' + (S.i + 1) + ' of ' + S.n + ' · ' + UNIT_SHORT[p.unit] + ' · ' + esc(p.topic) + '</span>' +
    '<div class="parts">' + partTag('found', 'Find') + partTag('fixed', 'Fix') + partTag('named', 'Name') + '</div>' +
    '<p class="prompt">' + p.prompt + '</p><p class="worklabel">A student’s work</p><div class="steps" role="group" aria-label="Steps of the student’s work">';
  p.steps.forEach((s, j) => {
    const isBad = r.part !== 'find' && j === p.bad, tried = r.taps.includes(j);
    h += '<button type="button" class="step' + (isBad ? ' bad' : tried ? ' tried' : '') + '" data-j="' + j + '"' + (r.part === 'find' ? '' : ' disabled') +
      ' aria-label="Step ' + (j + 1) + (isBad ? ', the first mistake' : '') + '"><span class="n">' + (j + 1) + '</span><span class="t">' + s.w + '</span></button>';
  });
  h += '</div>';
  if (r.part === 'find') {
    h += '<div class="phase"><p class="q">Tap the first step that goes wrong.</p><p class="fb" id="fb"></p></div>';
  } else if (r.part === 'fix') {
    h += '<div class="phase"><p class="q">Step ' + (p.bad + 1) + ' is the first mistake. What should it say? <small>(' + (2 - r.fixTries.length) + ' tr' + (r.fixTries.length === 1 ? 'y' : 'ies') + ' left)</small></p>' + fixHtml(p, r) + '<p class="fb" id="fb"></p></div>';
  } else if (r.part === 'name') {
    h += '<div class="phase"><p class="q">What kind of mistake is it? <small>(one try)</small></p><div class="opts">' +
      p.errOpts.map(k => '<button type="button" class="opt" data-e="' + k + '">' + esc(ERRORS[k].name) + '</button>').join('') + '</div><p class="fb" id="fb"></p></div>';
  } else {
    h += doneHtml(p, r);
  }
  h += '</div>' + sideHtml(p) + '</div>';
  app.innerHTML = h;
  wire(p, r);
}
function fixHtml(p, r) {
  if (p.fix.type === 'num') return '<form class="fixrow" id="fixForm"><label for="fixIn">' + esc(p.fix.label) + '</label><input type="text" id="fixIn" autocomplete="off" inputmode="decimal" placeholder="' + esc(p.fix.ph) + '"><button class="btn" type="submit">Check</button></form>';
  return '<p style="margin:0 0 8px;font-weight:600">' + esc(p.fix.label) + '</p><div class="opts">' + p.fix.options.map((o, k) => '<button type="button" class="opt' + (r.fixTries.includes(o) ? ' wrong' : '') + '" data-o="' + k + '"' + (r.fixTries.includes(o) ? ' disabled' : '') + '>' + esc(o) + '</button>').join('') + '</div>';
}
function doneHtml(p, r) {
  const say = r.found && r.fixed && r.named ? 'All three on the first try.' : pts(r) + ' of 3 points.';
  let h = '<div class="phase"><p class="q">The mistake: ' + esc(ERRORS[p.err].name) + '</p><p class="fb ' + (pts(r) === 3 ? 'ok' : '') + '">' + say + (r.named === false && r.name ? ' You picked “' + esc(ERRORS[r.name].name) + '.”' : '') + '</p>' +
    '<p class="worklabel" style="margin-top:14px">Corrected work</p><div class="fixed">';
  p.steps.forEach((s, j) => {
    const cls = j === p.bad ? 'was' : (j > p.bad && s.w !== s.r) ? 'carry' : '';
    h += '<div class="cstep ' + cls + '"><span class="n">' + (j + 1) + '</span><span>' + s.r + (cls === 'was' ? '<span class="tag">fixed: this is where it went wrong</span>' : cls === 'carry' ? '<span class="tag">changes because of the fix</span>' : '') + '</span></div>';
  });
  h += '</div><p class="why"><b>Why</b>' + p.why + '</p><div class="btnrow"><button class="btn" id="next">' + (S.i === S.n - 1 ? 'See results' : 'Next problem') + '</button></div></div>';
  return h;
}
function sideHtml(p) {
  const total = S.res.reduce((a, r) => a + pts(r), 0);
  let h = '<aside class="side"><div class="card"><h3>Progress</h3><div class="dots">';
  S.res.forEach((r, k) => {
    const cls = k === S.i ? 'cur' : r.part === 'done' ? 's' + pts(r) : '';
    const reach = k === S.i || r.part === 'done' || k === firstOpen();
    h += '<button type="button" class="dot ' + cls + '" data-k="' + k + '"' + (reach ? '' : ' disabled') + ' aria-label="Problem ' + (k + 1) + (r.part === 'done' ? ', ' + pts(r) + ' of 3 points' : '') + '">' + (k + 1) + '</button>';
  });
  h += '</div><p class="score">Score <b>' + total + '</b> / ' + 3 * S.n + '</p></div>';
  h += '<div class="card tools"><h3>Tools</h3><button type="button" class="btn quiet" id="calcBtn" style="width:100%">' + (calcOpen ? 'Hide calculator' : 'Show calculator') + '</button>' +
    (calcOpen ? '<div class="calc"><iframe src="https://www.desmos.com/scientific" title="Desmos scientific calculator" loading="lazy"></iframe></div>' : '') +
    '<p class="kbd" style="margin:12px 0 4px">Course applets (open in a new tab)</p>' +
    APPLETS.map(a => '<a href="' + a[0] + '" target="_blank" rel="noopener"' + (a[2].includes(p.key) ? ' class="sug"' : '') + '>' + a[1] + '</a>').join('') +
    '</div><button type="button" class="btn quiet" id="quit">End this set</button></aside>';
  return h;
}
const firstOpen = () => { const k = S.res.findIndex(r => r.part !== 'done'); return k < 0 ? S.n : k; };

/* ---------- interactions ---------- */
function setFb(text, cls) { const f = $('fb'); if (f) { f.textContent = text; f.className = 'fb ' + (cls || ''); } }
function wire(p, r) {
  app.querySelectorAll('.step:not(:disabled)').forEach(b => b.onclick = () => tapStep(p, r, +b.dataset.j));
  const form = $('fixForm');
  if (form) { form.onsubmit = e => { e.preventDefault(); checkFix(p, r, $('fixIn').value); }; $('fixIn').focus(); }
  app.querySelectorAll('[data-o]').forEach(b => b.onclick = () => checkFix(p, r, p.fix.options[+b.dataset.o]));
  app.querySelectorAll('[data-e]').forEach(b => b.onclick = () => pickName(p, r, b.dataset.e));
  app.querySelectorAll('.dot:not(:disabled)').forEach(b => b.onclick = () => { S.i = +b.dataset.k; save(); render(); });
  $('calcBtn').onclick = () => { calcOpen = !calcOpen; render(); };
  $('quit').onclick = () => { S.i = S.n; save(); render(); };
  if ($('next')) { $('next').onclick = () => { S.i = S.i === S.n - 1 ? S.n : nextIndex(); save(); render(); }; $('next').focus(); }
}
const nextIndex = () => { for (let k = S.i + 1; k < S.n; k++) if (S.res[k].part !== 'done') return k; const f = firstOpen(); return f < S.n ? f : S.n; };

function tapStep(p, r, j) {
  if (r.part !== 'find' || r.taps.includes(j)) return;
  if (j === p.bad) {
    r.found = r.taps.length === 0; r.part = 'fix'; save(); render();
    setFb(r.found ? 'Yes, step ' + (j + 1) + ' is where it first goes wrong.' : 'Yes, step ' + (j + 1) + '.', 'ok');
    return;
  }
  r.taps.push(j);
  let msg = j < p.bad ? 'Step ' + (j + 1) + ' is correct. The mistake is further down.'
    : p.steps[j].w === p.steps[j].r ? 'Step ' + (j + 1) + ' is correct.'
    : 'Step ' + (j + 1) + ' is off only because it uses an earlier wrong result. Look earlier.';
  if (r.taps.length >= 2) {
    r.found = false; r.part = 'fix'; save(); render();
    setFb(msg + ' The first mistake is step ' + (p.bad + 1) + ', now marked in red.', 'no');
    return;
  }
  save(); render(); setFb(msg + ' One more try.', 'no');
}
function checkFix(p, r, v) {
  if (r.part !== 'fix' || String(v).trim() === '') return;
  const right = p.fix.type === 'num' ? p.fix.check(v) : v === p.fix.show;
  if (right) {
    r.fixed = r.fixTries.length === 0; r.part = 'name'; save(); render();
    setFb('Right: step ' + (p.bad + 1) + ' should give ' + p.fix.show + '.', 'ok');
    return;
  }
  r.fixTries.push(String(v));
  if (r.fixTries.length >= 2) {
    r.fixed = false; r.part = 'name'; save(); render();
    setFb('Not quite. Step ' + (p.bad + 1) + ' should give ' + p.fix.show + '.', 'no');
    return;
  }
  save(); render();
  setFb(p.fix.type === 'num' ? (isNaN(parseNum(String(v).replace(/[$,]/g, ''))) ? 'Type a number (a fraction like 3/8 is fine). One more try.' : 'Not quite. Check your calculation. One more try.') : 'Not that one. One more try.', 'no');
}
function pickName(p, r, k) {
  if (r.part !== 'name') return;
  r.name = k; r.named = k === p.err; r.part = 'done'; save(); render();
}

function renderEnd() {
  drawMeta();
  const f = S.res.filter(r => r.found).length, x = S.res.filter(r => r.fixed).length, nm = S.res.filter(r => r.named).length, d = doneCount();
  let h = '<div class="card"><h2>Results for set ' + S.code + '</h2><p class="lede">' + d + ' of ' + S.n + ' problems finished.</p><div class="tot">' +
    '<div><b>' + f + '/' + S.n + '</b><span>found on the first try</span></div><div><b>' + x + '/' + S.n + '</b><span>fixed on the first try</span></div>' +
    '<div><b>' + nm + '/' + S.n + '</b><span>named correctly</span></div><div><b>' + (f + x + nm) + '/' + 3 * S.n + '</b><span>total points</span></div></div>';
  const miss = SET.map((p, k) => ({ p, r: S.res[k], k })).filter(o => o.r.part === 'done' && pts(o.r) < 3);
  h += '<h3>Mistakes to watch for</h3>' + (miss.length ? miss.map(o => '<div class="miss"><span class="tp">Problem ' + (o.k + 1) + ' · ' + esc(o.p.topic) + '</span><div class="nm">' + esc(ERRORS[o.p.err].name) + '</div><div>' + o.p.why + '</div></div>').join('')
    : '<p class="lede">' + (d ? 'None: every finished problem was perfect.' : 'No problems finished yet.') + '</p>');
  h += '<div class="btnrow">' + (d < S.n ? '<button class="btn" id="back">Keep going</button>' : '') + '<button class="btn' + (d < S.n ? ' quiet' : '') + '" id="review">Review problems</button><button class="btn quiet" id="newSet">New set</button></div></div>';
  app.innerHTML = h;
  if ($('back')) $('back').onclick = () => { S.i = firstOpen(); save(); render(); };
  $('review').onclick = () => { S.i = 0; save(); render(); };
  $('newSet').onclick = () => { S = null; try { localStorage.removeItem(SAVE); } catch (e) {} render(); };
}

window.FTM = { get S() { return S; }, get SET() { return SET; } };   /* read-only hook for testing */
(function () { const saved = load(); if (saved && saved.res && saved.i < saved.n) { S = saved; SET = buildSet(S.code, S.units, S.n); } render(); })();
</script>
</body>
