<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Two-Sample Coach</title>
<style>
/* Layout: masthead, two tabs, then a step list beside one step card (stacks on phones). Matches the course's paper-and-ink sheets. */
:root{
  --paper:#F3F1E7; --sheet:#FBFAF4; --card:#FFFFFF; --rule:#D8D3C2; --ink:#14213D; --ink-soft:#4F586C;
  --blue:#1F4E9C; --blue-soft:#E4EBF7; --on-blue:#FFFFFF;
  --ok:#22603C; --ok-soft:#E2EFE7; --no:#A31F1C; --no-soft:#F7E4E3; --gold:#B58B15;
  --serif:Georgia,'Iowan Old Style','Times New Roman',serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#151A22; --sheet:#1B212B; --card:#212834; --rule:#38414F; --ink:#E8EBF1; --ink-soft:#A7B0BF;
  --blue:#8FB0EC; --blue-soft:#24324A; --on-blue:#0F1724;
  --ok:#7BD3A0; --ok-soft:#1E3529; --no:#F29A92; --no-soft:#3A2224; --gold:#E0BC5A; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#151A22; --sheet:#1B212B; --card:#212834; --rule:#38414F; --ink:#E8EBF1; --ink-soft:#A7B0BF;
  --blue:#8FB0EC; --blue-soft:#24324A; --on-blue:#0F1724;
  --ok:#7BD3A0; --ok-soft:#1E3529; --no:#F29A92; --no-soft:#3A2224; --gold:#E0BC5A; color-scheme:dark;}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:8px 64px}
.masthead{border-bottom:3px double var(--ink);padding:22px 0 12px;margin-bottom:18px}
.masthead h1{font-family:var(--serif);font-size:clamp(28px,5vw,42px);line-height:1.05;margin:0;letter-spacing:-.01em}
.masthead p{margin:6px 0 0;color:var(--ink-soft);max-width:62ch}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{font:inherit;font-weight:600;cursor:pointer;padding:9px 16px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:3px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
.progress{list-style:none;margin:0;padding:0;display:grid;gap:6px}
@media (max-width:820px){.progress{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.pstep{width:100%;display:flex;align-items:center;gap:10px;font:inherit;font-size:15px;text-align:left;cursor:pointer;
  padding:8px 10px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:3px}
.pstep:disabled{cursor:not-allowed;color:var(--ink-soft);opacity:.75}
.pstep .pn{flex:0 0 26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;border:1px solid var(--rule);background:var(--card)}
.pstep.done .pn{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.pstep.cur{border-color:var(--blue);border-width:2px;padding:7px 9px;background:var(--blue-soft)}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:3px;padding:20px 22px;min-width:0}
.kicker{margin:0 0 4px;font-family:var(--mono);font-size:13px;color:var(--ink-soft);letter-spacing:.03em}
h2{font-family:var(--serif);font-size:26px;line-height:1.2;margin:0 0 6px;text-wrap:balance}
h2:focus{outline:none}
h3{font-family:var(--serif);font-size:18px;margin:20px 0 8px;line-height:1.3}
.lede{color:var(--ink-soft);margin:0 0 12px;max-width:68ch}
.small{font-size:14.5px;color:var(--ink-soft);margin:8px 0 0}
a{color:var(--blue)}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choices.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.choices.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.choices.stack{grid-template-columns:1fr}
@media (max-width:620px){.choices,.choices.three{grid-template-columns:1fr}.choices.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
.choice{font:inherit;cursor:pointer;text-align:left;padding:11px 14px;border:2px solid var(--rule);background:var(--card);color:var(--ink);border-radius:4px;display:grid;gap:2px;min-width:0}
.choice:hover{border-color:var(--ink)}
.choice.on{border-color:var(--blue);background:var(--blue-soft)}
.choice .ct{font-weight:600}
.choices.four .choice .ct{font-family:var(--serif);font-size:24px;line-height:1.1}
.choice .cs{font-size:13.5px;color:var(--ink-soft)}
.field{display:grid;gap:4px;margin:12px 0}
.field label{font-weight:600;font-size:15.5px}
.field input{font:inherit;font-variant-numeric:tabular-nums;padding:9px 11px;border:1px solid var(--rule);border-radius:3px;background:var(--card);color:var(--ink);max-width:100%;width:22em}
.hint{font-size:14px;color:var(--ink-soft)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}
@media (max-width:620px){.grid2{grid-template-columns:1fr}}
.grid2 .field input{width:100%}
fieldset.data{border:1px solid var(--rule);border-radius:4px;padding:6px 16px 12px;margin:14px 0;background:var(--card)}
fieldset.data legend{font-family:var(--serif);font-weight:700;font-size:18px;padding:0 6px}
.sums p{margin:6px 0;font-variant-numeric:tabular-nums}
.fb{margin:12px 0 0;padding:10px 14px;border-radius:0 3px 3px 0;font-size:15.5px}
.fb:empty{display:none}
.fb.ok{border-left:4px solid var(--ok);background:var(--ok-soft)}
.fb.no{border-left:4px solid var(--no);background:var(--no-soft)}
.fb p,.fb ul{margin:0}
.fb ul{padding-left:20px}
.warn{border-left:4px solid var(--gold);padding:8px 12px;background:var(--card);margin:8px 0}
.note{border-left:4px solid var(--blue);background:var(--blue-soft);padding:10px 14px;margin:16px 0 0;border-radius:0 3px 3px 0;font-size:15.5px}
.note p{margin:0}
.result{margin-top:18px;border:1px solid var(--rule);border-left:4px solid var(--ink);background:var(--card);padding:12px 16px;border-radius:0 3px 3px 0}
.result h3{margin-top:4px}
.copyrow{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:6px 0;border-top:1px solid var(--rule)}
.copyrow:first-of-type{border-top:0}
.copytext{margin:0;min-width:0;overflow-wrap:anywhere}
.summary{white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--mono);font-size:14px;line-height:1.6;margin:0;background:var(--sheet);padding:10px;border-radius:3px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;background:var(--card)}
th,td{border:1px solid var(--rule);padding:7px 10px;text-align:left}
thead th{background:var(--blue-soft)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
ol.steps{padding-left:22px;margin:8px 0}
ol.steps li{margin:4px 0}
.btn{font:inherit;font-weight:600;cursor:pointer;padding:10px 20px;border-radius:3px;border:1px solid var(--blue);background:var(--blue);color:var(--on-blue)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--blue)}
.btn.small{padding:4px 10px;font-size:14px;flex:0 0 auto}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:22px;padding-top:14px;border-top:1px solid var(--rule)}
.navhint{color:var(--ink-soft);font-size:15px}
.scenario{font-family:var(--serif);font-size:21px;line-height:1.5;background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--ink);padding:16px 20px;margin:4px 0 8px}
.scenario:focus{outline:3px solid var(--gold);outline-offset:2px}
details{margin-top:8px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.field textarea{font:inherit;font-family:var(--mono);font-size:15px;padding:9px 11px;border:1px solid var(--rule);border-radius:3px;background:var(--card);color:var(--ink);width:100%;resize:vertical}
.plotwrap{overflow-x:auto;background:var(--card);border:1px solid var(--rule);border-radius:3px;margin:10px 0;padding:4px}
svg.dot{display:block;width:100%;min-width:420px;height:auto}
svg.dot .dl{font-size:13px;fill:var(--ink)}
svg.dot .tick{font-size:12px;fill:var(--ink-soft);font-family:var(--mono)}
svg.dot .axis{stroke:var(--rule);stroke-width:1.5}
svg.dot .pt{fill:var(--blue)}
svg.dot .pt.out{fill:#C2570C}
.foot{margin-top:22px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;color:var(--ink-soft);font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <h1>Two-Sample Coach</h1>
    <p>Step-by-step help with the Paychecks and Prices project: matched pairs and independent samples t-tests. The applet calculates t and the p-value; the coach checks your setup and formats your data.</p>
  </header>

  <div class="tabs" role="tablist" aria-label="Mode">
    <button class="tab" role="tab" id="tab-guide" aria-controls="panel-guide" aria-selected="true">Guide me through my test</button>
    <button class="tab" role="tab" id="tab-practice" aria-controls="panel-practice" aria-selected="false">Practice: paired or independent?</button>
  </div>

  <section id="panel-guide" role="tabpanel" aria-labelledby="tab-guide">
    <div class="layout">
      <nav aria-label="Steps"><ol class="progress" id="progress"></ol></nav>
      <div class="sheet">
        <div id="stepBody"></div>
        <div class="nav">
          <button type="button" class="btn ghost" id="backBtn">Back</button>
          <button type="button" class="btn" id="nextBtn">Next step</button>
          <span class="navhint" id="navHint" aria-live="polite"></span>
        </div>
      </div>
    </div>
  </section>

  <section id="panel-practice" role="tabpanel" aria-labelledby="tab-practice" hidden>
    <div class="sheet" id="practiceBody"></div>
  </section>

  <div class="foot">
    <span>Your answers save in this browser.</span>
    <button type="button" class="btn ghost small" id="resetBtn">Start over</button>
    <span id="resetConfirm" hidden>Clear everything you entered? <button type="button" class="btn small" id="resetYes">Yes, clear it</button> <button type="button" class="btn ghost small" id="resetNo">Keep it</button></span>
  </div>
</div>
<script>
/* ==================================================================
   CORE LOGIC — pure functions, no DOM. Tested in Node (test.js).
   It never computes t or a p-value:
   students get those from the course applet.
   ================================================================== */
var ALPHA = 0.05;
var PRED_TO_SIGN = { higher: '>', lower: '<', different: '≠' };
var SIGN_TO_TAIL = { '<': 'left', '>': 'right', '≠': 'two' };
var DIR_WORDS = { '<': 'less than', '>': 'greater than', '≠': 'different from' };

/* The lab's parts, with the design each needs and sensible default names. */
var PARTS = {
  part1: { label: 'Part 1: men vs. women in the same occupation', design: 'paired', g1: "men's median weekly earnings", g2: "women's median weekly earnings", unit: 'occupation',
    why: 'Each occupation gives one men’s value and one women’s value, so every value has a partner.' },
  part2: { label: 'Part 2: women-majority vs. men-majority occupations', design: 'independent', g1: 'median weekly earnings in women-majority occupations', g2: 'median weekly earnings in men-majority occupations', unit: 'occupation',
    why: 'The two groups are different occupations, so no value in one group is linked to a value in the other.' },
  part4: { label: 'Part 4: 2025 prices vs. inflation-adjusted 2018 prices', design: 'paired', g1: 'the December 2025 price', g2: 'the inflation-adjusted December 2018 price', unit: 'item',
    why: 'Each item has a 2025 price and an adjusted 2018 price, so every value has a partner.' },
  own: { label: 'My own data', design: null, g1: '', g2: '', unit: 'pair', why: '' }
};

function num(v) {
  if (v === null || v === undefined) return NaN;
  var s = String(v).replace(/,/g, '').trim();
  if (s === '' || !/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s)) return NaN;
  return parseFloat(s);
}

/* Read a pasted list. Accepts one value per line, or values separated by spaces,
   semicolons, or a comma followed by a space. "2,023" (comma then three digits)
   is read as two thousand twenty-three, and "$" is ignored. */
function parseList(text) {
  var values = [], bad = [];
  var raw = String(text || '').trim();
  if (!raw) return { values: values, bad: bad };
  var tokens = raw.split(/[\s;]+|,\s+/);
  tokens.forEach(function (tok) {
    if (!tok) return;
    var t = tok.replace(/\$/g, '');
    var parts = /^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(t) ? [t.replace(/,/g, '')] : t.split(',');
    parts.forEach(function (p) {
      if (p === '') return;
      var n = Number(p);
      if (/^[-+]?(\d+\.?\d*|\.\d+)$/.test(p) && isFinite(n)) values.push(n); else bad.push(tok);
    });
  });
  return { values: values, bad: bad };
}
/* What to paste into the applet: plain numbers separated by spaces, no commas. */
function forApplet(values) { return values.map(function (v) { return String(Math.round(v * 1e6) / 1e6); }).join(' '); }

function differences(a, b) { return a.map(function (x, i) { return Math.round((x - b[i]) * 1e6) / 1e6; }); }
function quantile(sorted, q) {          /* same method as most textbooks' calculators (median of halves) */
  var n = sorted.length; if (!n) return NaN;
  var med = function (arr) { var m = arr.length; return m % 2 ? arr[(m - 1) / 2] : (arr[m / 2 - 1] + arr[m / 2]) / 2; };
  if (q === 0.5) return med(sorted);
  var lower = sorted.slice(0, Math.floor(n / 2)), upper = sorted.slice(Math.ceil(n / 2));
  return q === 0.25 ? med(lower) : med(upper);
}
/* Possible outliers by the 1.5 × IQR rule. */
function outliers(values) {
  if (values.length < 4) return { fences: null, list: [] };
  var s = values.slice().sort(function (a, b) { return a - b; });
  var q1 = quantile(s, 0.25), q3 = quantile(s, 0.75), iqr = q3 - q1;
  var lo = q1 - 1.5 * iqr, hi = q3 + 1.5 * iqr;
  return { fences: [lo, hi], q1: q1, q3: q3, list: values.filter(function (v) { return v < lo || v > hi; }) };
}

function checkDesign(part, choice, partnerAnswer) {
  if (!choice) return { ok: false, msg: 'Choose independent or paired.' };
  var want = part === 'own' ? (partnerAnswer === 'yes' ? 'paired' : partnerAnswer === 'no' ? 'independent' : null) : PARTS[part].design;
  if (!want) return { ok: false, msg: 'First answer the partner question.' };
  if (choice === want) return { ok: true, msg: 'Right: ' + (part === 'own' ? (want === 'paired' ? 'each value has a partner, so the data are paired.' : 'the groups were collected separately, so they are independent.') : PARTS[part].why) };
  return { ok: false, msg: want === 'paired'
    ? 'Look again: each value in Group 1 has a natural partner in Group 2 (the same ' + PARTS[part].unit + '). That makes the data paired.'
    : 'Look again: no value in Group 1 is linked to a particular value in Group 2. That makes the samples independent.' };
}

function checkHypotheses(design, pred, param, sign) {
  if (!pred) return { ok: false, msg: 'Start with your prediction.' };
  if (!param) return { ok: false, msg: 'Choose the symbol that goes in the hypotheses.' };
  if (design === 'paired' && param !== 'mud') return { ok: false, msg: param === 'xbard'
    ? 'Hypotheses are about the population, so use μd. The sample mean of the differences, d̄, comes from your data.'
    : 'With paired data you test one list of differences, so the parameter is μd, the mean difference.' };
  if (design === 'independent' && param !== 'mu12') return { ok: false, msg: param === 'xbar12'
    ? 'Hypotheses are about populations, so use μ₁ and μ₂, not the sample means x̄₁ and x̄₂.'
    : 'With independent samples you compare two separate population means, μ₁ and μ₂.' };
  if (!sign) return { ok: false, msg: 'Choose the sign for Hₐ.' };
  if (sign === '=') return { ok: false, msg: 'The equals sign belongs in H₀. Hₐ holds your prediction.' };
  var want = PRED_TO_SIGN[pred];
  if (sign !== want) {
    if (design === 'paired') return { ok: false, msg: 'd = Group 1 − Group 2. You predicted Group 1 is ' + (pred === 'different' ? 'different from' : pred + ' than') + ' Group 2, so d is ' + (pred === 'higher' ? 'positive' : pred === 'lower' ? 'negative' : 'not zero') + ' on average, and Hₐ uses ' + want + '.' };
    return { ok: false, msg: 'You predicted Group 1 is ' + (pred === 'different' ? 'different from' : pred + ' than') + ' Group 2, so Hₐ should say μ₁ ' + want + ' μ₂.' };
  }
  return { ok: true, msg: 'That matches your prediction and your group order.' };
}
function hypotheses(design, sign) {
  if (design === 'paired') return { h0: 'μd = 0', ha: 'μd ' + sign + ' 0' };
  return { h0: 'μ₁ = μ₂', ha: 'μ₁ ' + sign + ' μ₂' };
}
function paramWords(design, g1, g2, unit) {
  if (design === 'paired') return ['μd is the mean of the differences (' + g1 + ' − ' + g2 + ') for all ' + unit + 's like these.'];
  return ['μ₁ is the mean of ' + g1 + '.', 'μ₂ is the mean of ' + g2 + '.'];
}

/* Data checks before the applet. */
function checkData(design, a, b) {
  var problems = [];
  if (a.bad.length || b.bad.length) problems.push('Some entries are not numbers: ' + a.bad.concat(b.bad).slice(0, 4).join(', ') + '.');
  if (a.values.length < 2 || b.values.length < 2) problems.push('Each group needs at least 2 values.');
  if (design === 'paired' && a.values.length !== b.values.length) problems.push('Paired data need the same number of values in each group. Group 1 has ' + a.values.length + ' and Group 2 has ' + b.values.length + '.');
  return { ok: problems.length === 0, problems: problems };
}

function checkTail(sign, tail) {
  var want = SIGN_TO_TAIL[sign];
  if (tail === want) return { ok: true, msg: 'Right. Hₐ uses ' + sign + ', so read the ' + (want === 'two' ? 'two-tail' : want + '-tail') + ' p-value.' };
  return { ok: false, msg: 'Match the sign in Hₐ: < means left tail, > means right tail, ≠ means two-tail. Your Hₐ uses ' + sign + '.' };
}
function checkPvalue(v) {
  var p = num(v);
  if (!isFinite(p)) return { ok: false, msg: 'Type the p-value from the applet, such as 0.0231.' };
  if (p < 0 || p > 1) return { ok: false, msg: 'A p-value is a probability, so it must be between 0 and 1.' };
  return { ok: true, value: p };
}
function correctDecision(p) { return p < ALPHA ? 'reject' : 'fail'; }
function checkDecision(p, choice, shown) {
  var want = correctDecision(p), ps = shown || String(p);
  if (choice === want) return { ok: true, msg: want === 'reject' ? 'Right. ' + ps + ' is less than 0.05.' : 'Right. ' + ps + ' is not less than 0.05.' };
  return { ok: false, msg: 'Compare the p-value with α = 0.05. If the p-value is less than α, reject H₀. Otherwise, fail to reject H₀.' };
}
function decisionSentence(p, decision, shown) {
  var ps = shown || String(p);
  return decision === 'reject' ? 'Since the p-value (' + ps + ') is less than α = 0.05, we reject H₀.'
    : 'Since the p-value (' + ps + ') is ' + (p === ALPHA ? 'equal to' : 'greater than') + ' α = 0.05, we fail to reject H₀.';
}
function claimText(design, sign, g1, g2, unit) {
  return design === 'paired'
    ? 'the mean difference between ' + g1 + ' and ' + g2 + ' for the same ' + unit + ' is ' + DIR_WORDS[sign] + ' 0'
    : 'the mean of ' + g1 + ' is ' + DIR_WORDS[sign] + ' the mean of ' + g2;
}
function conclusionSentence(design, sign, g1, g2, unit, decision) {
  return 'There ' + (decision === 'reject' ? 'is' : 'is not') + ' enough evidence to support the claim that ' + claimText(design, sign, g1, g2, unit) + '.';
}
function errorStatements(design, sign, g1, g2, unit) {
  var claim = claimText(design, sign, g1, g2, unit);
  return {
    typeI: 'Concluding that ' + claim + ', when there is really no difference.',
    typeII: 'Not concluding that ' + claim + ', when it really is.'
  };
}
function possibleError(decision) { return decision === 'reject' ? 'I' : 'II'; }

/* ---------------- practice ---------------- */
var SCENARIOS = [
  { d: 'paired', s: '>', t: 'The same 14 students take a reading test before (Group 2) and after (Group 1) a summer program. Did scores go up?', cue: '“go up” for Group 1 − Group 2' },
  { d: 'paired', s: '<', t: 'Group 1 is the online price and Group 2 is the campus-store price of the same 12 textbooks. Is the online price lower?', cue: '“lower” for Group 1' },
  { d: 'paired', s: '≠', t: 'Group 1 is each twin’s height and Group 2 is the other twin’s height, for 20 pairs of twins. Is there a difference?', cue: '“a difference” with no direction' },
  { d: 'paired', s: '>', t: 'Group 1 is men’s and Group 2 is women’s median pay in the same 15 occupations. Do men earn more?', cue: '“earn more” for Group 1' },
  { d: 'paired', s: '>', t: 'Group 1 is this year’s price and Group 2 is last year’s inflation-adjusted price for the same 10 items. Did prices rise faster than inflation?', cue: '“rise faster” means Group 1 is higher' },
  { d: 'paired', s: '<', t: 'Patients’ blood pressure after a new medicine (Group 1) and before it (Group 2). Did blood pressure drop?', cue: '“drop” means Group 1 is lower' },
  { d: 'independent', s: '<', t: 'Group 1 is 20 randomly chosen nurses and Group 2 is 20 randomly chosen engineers. Do nurses earn less?', cue: '“earn less” for Group 1' },
  { d: 'independent', s: '>', t: 'Group 1 is 30 students who studied with flashcards and Group 2 is 30 different students who did not. Did the flashcard group score higher?', cue: '“higher” for Group 1' },
  { d: 'independent', s: '≠', t: 'Group 1 is commute times for 25 drivers and Group 2 is commute times for 25 bus riders. Are the mean commutes different?', cue: '“different” with no direction' },
  { d: 'independent', s: '<', t: 'Group 1 is 10 women-majority occupations and Group 2 is 10 men-majority occupations. Do women-majority jobs pay less?', cue: '“pay less” for Group 1' },

function refreshAll() {
  V[S.step].refresh();
  var ok = done(S.step);
  $('backBtn').disabled = S.step === 0;
  $('nextBtn').disabled = !ok || S.step === STEPS.length - 1; $('nextBtn').hidden = S.step === STEPS.length - 1;
  $('navHint').textContent = (S.step < STEPS.length - 1 && !ok) ? 'Finish this step to continue.' : '';
  document.querySelectorAll('#progress .pstep').forEach(function (b, i) { b.classList.toggle('done', done(i)); b.disabled = !reachable(i); b.querySelector('.pn').textContent = done(i) ? '✓' : String(i + 1); });
}
function focusHead() { var h = $('stepBody').querySelector('h2'); if (h) { h.setAttribute('tabindex', '-1'); h.focus(); } }
var TEXT = { g1: 1, g2: 1, unit: 1, list1: 1, list2: 1, pval: 1, tval: 1 };
function onChoice(b) {
  var name = b.getAttribute('data-name'), val = b.getAttribute('data-value');
  if (name === 'part' && val !== S.part) {
    var f = fresh(); f.part = val; f.flip = S.flip;
    if (val !== 'own') { f.g1 = PARTS[val].g1; f.g2 = PARTS[val].g2; f.unit = PARTS[val].unit; }
    S = f;
  } else if (name === 'design' && val !== S.design) { S.design = val; S.param = null; S.sign = null; S.outAns = null; S.tail = null; }
  else S[name] = val;
  save(); render();
  var again = document.querySelector('button.choice[data-name="' + name + '"][data-value="' + CSS.escape(val) + '"]'); if (again) again.focus();
}
function wireChoices(root) { root.querySelectorAll('button.choice').forEach(function (b) { b.onclick = function () { onChoice(b); }; }); }
function wire(root) {
  wireChoices(root);
  root.querySelectorAll('input, textarea').forEach(function (inp) {
    inp.oninput = function () {
      if (TEXT[inp.id]) S[inp.id] = inp.value;
      if (inp.id === 'list1' || inp.id === 'list2') S.outAns = null;
      save(); refreshAll();
    };
  });
  root.addEventListener('click', copyHandler);
}
function copyHandler(e) {
  var b = e.target.closest ? e.target.closest('[data-copy]') : null; if (!b) return;
  var src = $(b.getAttribute('data-copy')); if (!src) return;
  var ok = function () { var old = b.textContent; b.textContent = 'Copied'; setTimeout(function () { b.textContent = old; }, 1400); };
  var fall = function () { var r = document.createRange(); r.selectNodeContents(src); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'Selected: press Ctrl+C'; };
  try { navigator.clipboard.writeText(src.textContent).then(ok, fall); } catch (err) { fall(); }
}

/* practice */
var PR = { sc: null, ans: {}, res: null, right: 0, tries: 0, streak: 0 };
function newPr() { PR.sc = makePractice(Math.random); PR.ans = { design: null, param: null, sign: null }; PR.res = null; }
function renderPractice() {
  if (!PR.sc) newPr();
  var a = PR.ans, pp = a.design === 'paired';
  var h = '<p class="kicker" id="pk">Practice · ' + PR.right + ' right out of ' + PR.tries + ' · streak ' + PR.streak + '</p><p class="scenario" tabindex="-1">' + esc(PR.sc.t) + '</p>' +
    '<h3 id="pq1">1. Which design?</h3><div class="choices" role="group" aria-labelledby="pq1">' + choice('pd', 'paired', 'Matched pairs', a.design) + choice('pd', 'independent', 'Independent samples', a.design) + '</div>';
  if (a.design) h += '<h3 id="pq2">2. Which symbols?</h3><div class="choices" role="group" aria-labelledby="pq2">' + choice('pp', 'mud', 'μd', a.param) + choice('pp', 'mu12', 'μ₁ and μ₂', a.param) + choice('pp', pp ? 'xbard' : 'xbar12', pp ? 'd̄' : 'x̄₁ and x̄₂', a.param) + '</div>' +
    '<h3 id="pq3">3. The sign in Hₐ</h3><div class="choices four" role="group" aria-labelledby="pq3">' + choice('ps', '<', '&lt;', a.sign) + choice('ps', '>', '&gt;', a.sign) + choice('ps', '≠', '≠', a.sign) + choice('ps', '=', '=', a.sign) + '</div>';
  h += '<div class="btnrow"><button type="button" class="btn" id="pcheck">Check</button><button type="button" class="btn ghost" id="pnext">New scenario</button></div><div id="pres" role="status" aria-live="polite"></div>';
  $('practiceBody').innerHTML = h;
  $('practiceBody').querySelectorAll('button.choice').forEach(function (b) {
    b.onclick = function () {
      var n = b.getAttribute('data-name'), v = b.getAttribute('data-value');
      if (n === 'pd') { PR.ans.design = v; PR.ans.param = null; } if (n === 'pp') PR.ans.param = v; if (n === 'ps') PR.ans.sign = v;
      PR.res = null; renderPractice();
      var again = $('practiceBody').querySelector('button.choice[data-name="' + n + '"][data-value="' + CSS.escape(v) + '"]'); if (again) again.focus();
    };
  });
  $('pcheck').onclick = function () {
    if (!PR.ans.design || !PR.ans.param || !PR.ans.sign) { PR.res = { ok: false, msgs: ['Answer all three parts first.'] }; showPr(); return; }
    var r = checkPractice(PR.sc, PR.ans);
    if (!(PR.res && PR.res.counted)) { PR.tries++; if (r.ok) { PR.right++; PR.streak++; } else PR.streak = 0; r.counted = true; }
    PR.res = r; showPr(); $('pk').textContent = 'Practice · ' + PR.right + ' right out of ' + PR.tries + ' · streak ' + PR.streak;
  };
  $('pnext').onclick = function () { newPr(); renderPractice(); $('practiceBody').querySelector('.scenario').focus(); };
  showPr();
}
function showPr() {
  var box = $('pres'), r = PR.res; if (!box) return; if (!r) { box.innerHTML = ''; return; }
  box.innerHTML = r.ok ? '<div class="fb ok">✓ Correct. H₀: ' + esc(r.answer.h0) + ' and Hₐ: ' + esc(r.answer.ha) + '.</div>'
    : '<div class="fb no"><p>! Not yet.</p><ul>' + r.msgs.map(function (m) { return '<li>' + esc(m) + '</li>'; }).join('') + '</ul>' + (r.answer ? '<details><summary>Show the answer</summary><p>' + (PR.sc.d === 'paired' ? 'Matched pairs. ' : 'Independent samples. ') + 'H₀: ' + esc(r.answer.h0) + ', Hₐ: ' + esc(r.answer.ha) + '</p></details>' : '') + '</div>';
}

function boot() {
  load();
  $('tab-guide').onclick = function () { S.mode = 'guide'; save(); render(); };
  $('tab-practice').onclick = function () { S.mode = 'practice'; save(); render(); };
  document.querySelector('.tabs').addEventListener('keydown', function (e) { if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return; S.mode = S.mode === 'guide' ? 'practice' : 'guide'; save(); render(); $(S.mode === 'guide' ? 'tab-guide' : 'tab-practice').focus(); });
  $('backBtn').onclick = function () { if (S.step > 0) { S.step--; save(); render(); focusHead(); } };
  $('nextBtn').onclick = function () { if (done(S.step) && S.step < STEPS.length - 1) { S.step++; save(); render(); focusHead(); } };
  $('resetBtn').onclick = function () { $('resetConfirm').hidden = !$('resetConfirm').hidden; };
  $('resetYes').onclick = function () { S = fresh(); save(); $('resetConfirm').hidden = true; render(); };
  $('resetNo').onclick = function () { $('resetConfirm').hidden = true; };
  render();
}
boot();
})();

</script>
</body>
</html>
