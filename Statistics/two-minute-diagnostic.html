<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two-Minute Diagnostic · Math 1342</title>
<style>
:root{
  --paper:#F3F1E7; --sheet:#FBFAF4; --card:#FFFFFF; --rule:#D8D3C2; --ink:#14213D; --ink-soft:#4F586C;
  --blue:#1F4E9C; --blue-soft:#E4EBF7; --on-blue:#FFFFFF; --ok:#22603C; --ok-soft:#E2EFE7; --no:#A31F1C; --no-soft:#F7E4E3; --gold:#B58B15; --gold-soft:#F6EED5;
  --serif:Georgia,'Iowan Old Style','Times New Roman',serif; --sans:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:19px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding:16px 24px 40px}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:3px double var(--ink);padding:4px 0 10px;margin-bottom:16px;flex-wrap:wrap}
h1{font-family:var(--serif);font-size:30px;margin:0;line-height:1.1}
h1 small{display:block;font-family:var(--mono);font-size:13px;font-weight:400;color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.meta{font-family:var(--mono);font-size:15px;color:var(--ink-soft);display:flex;gap:18px;flex-wrap:wrap}
.meta b{color:var(--ink)}
h2{font-family:var(--serif);font-size:26px;margin:0 0 10px}
h3{font-family:var(--serif);font-size:20px;margin:20px 0 8px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:20px 22px}
.lede{color:var(--ink-soft);margin:0 0 14px}
.btn{font:inherit;font-weight:600;padding:11px 22px;border-radius:6px;border:1px solid var(--blue);background:var(--blue);color:var(--on-blue);cursor:pointer}
.btn.quiet{background:transparent;color:var(--blue)}
.btn.big{font-size:22px;padding:14px 30px}
.btn:disabled{opacity:.5;cursor:default}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:16px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.msg{margin:12px 0 0;padding:10px 14px;border-left:4px solid var(--no);background:var(--no-soft);border-radius:0 4px 4px 0;font-size:16px}
.msg:empty{display:none}
.note{margin:12px 0 0;padding:10px 14px;border-left:4px solid var(--blue);background:var(--blue-soft);border-radius:0 4px 4px 0;font-size:16px}
.setup{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}
@media (max-width:900px){.setup{grid-template-columns:1fr}}
fieldset{border:1px solid var(--rule);border-radius:4px;padding:12px 16px 14px;margin:0 0 14px}
legend{font-weight:700;padding:0 6px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px}

/* ===========================================================================
   TWO-MINUTE DIAGNOSTIC — topics and item bank (Math 1342 final review)
   One quick recognition item per topic (about 10 seconds, no calculator).
   Each topic has three interchangeable items, so a second run looks fresh.
   In every item the first option is the right one; the page shuffles them.
   Links point at pages already in the Statistics folder.
   =========================================================================== */
const TOPICS = [
  { id: 'design', unit: 'I', name: 'Sampling & study design', links: [['Randomizer Ladder', 'sampling_ladder.html'], ['Design Ladder', 'experiment_ladder.html']] },
  { id: 'describe', unit: 'II', name: 'Center & spread', links: [['Center Ladder', 'center_ladder.html'], ['Spread Ladder', 'spread_ladder.html'], ['Boxplot Ladder', 'boxplot_ladder.html']] },
  { id: 'prob', unit: 'II', name: 'Probability rules', links: [['Union Ladder', 'union_ladder.html'], ['Conditional Ladder', 'conditional_ladder.html'], ['Two-Way Table Ladder', 'twoway_ladder.html']] },
  { id: 'counting', unit: 'II', name: 'Counting', links: [['Counting Ladder', 'counting_ladder.html'], ['Counting practice', 'Counting.html']] },
  { id: 'binomial', unit: 'II', name: 'Binomial distribution', links: [['Binomial Ladder', 'binomial_ladder.html'], ['Binomial practice', 'Binomial-Practice.html']] },
  { id: 'expected', unit: 'II', name: 'Expected value', links: [['Expectation Ladder', 'Expectation-Ladder.html'], ['Discrete distributions practice', 'Discrete-Practice.html']] },
  { id: 'normal', unit: 'III', name: 'Normal distribution & z-scores', links: [['Standardizing Ladder', 'Standardizing-Ladder.html'], ['Normal practice', 'Normal-Practice.html']] },
  { id: 'clt', unit: 'III', name: 'Sampling distributions (CLT)', links: [['Standard Error Ladder', 'Standard-Error-Ladder.html'], ['Sample means practice', 'CLT-Meansprac.html'], ['Sample proportions practice', 'CLT-Proppract.html']] },
  { id: 'intervals', unit: 'III', name: 'Confidence intervals & sample size', links: [['Interval Ladder', 'interval_ladder.html'], ['Sample Size Ladder', 'samplesize_ladder.html'], ['Intervals practice', 'Intervals-Prac.html']] },
  { id: 'testing', unit: 'IV', name: 'Hypothesis-test logic', links: [['Hypothesis-Test Ladder', 'ztest_ladder.html'], ['p-Value Ladder', 'pvalue_ladder.html'], ['Errors Ladder', 'error_ladder.html']] },
  { id: 'choose', unit: 'IV', name: 'Choosing the right test', links: [['Procedure Ladder', 'procedure_ladder.html'], ['Two-Sample Ladder', 'twosample_means_ladder.html'], ['Chi-Square Ladder', 'chisquare_ladder.html']] },
  { id: 'regression', unit: 'IV', name: 'Correlation & regression', links: [['Correlation Ladder', 'correlation_ladder.html'], ['Regression Ladder', 'lsrl_ladder.html'], ['LSRL practice', 'LSRL-prac.html']] }
];
const ITEMS = {
  design: [
    ['A school randomly picks 5 homerooms and surveys every student in them. Which sampling method?', ['Cluster', 'Stratified', 'Systematic', 'Convenience']],
    ['Volunteers are randomly assigned to a new drug or a placebo. What kind of study is this?', ['Experiment', 'Observational study', 'Retrospective study', 'Census']],
    ['A store surveys every 20th customer on a list, after a random start. Which sampling method?', ['Systematic', 'Cluster', 'Stratified', 'Simple random']]
  ],
  describe: [
    ['Incomes in a town are strongly skewed right. Which summary should you report?', ['Median and IQR', 'Mean and SD', 'Mean and range', 'Mode and SD']],
    ['For a sample standard deviation, the sum of squared deviations is divided by…', ['n − 1', 'n', 'n + 1', '√n']],
    ['Adding one huge outlier to a data set changes which of these the most?', ['The mean', 'The median', 'The IQR', 'The mode']]
  ],
  prob: [
    ['When A and B overlap, P(A or B) equals…', ['P(A) + P(B) − P(A and B)', 'P(A) + P(B)', 'P(A) · P(B)', 'P(A) + P(B) + P(A and B)']],
    ['P(at least one success) is usually easiest to find as…', ['1 − P(none)', 'P(none)', '1 − P(all)', 'n · P(one)']],
    ['In a two-way table, P(A given B) divides by…', ['the B total', 'the grand total', 'the A total', 'the A-and-B count']]
  ],
  counting: [
    ['Choosing a president, a VP and a treasurer from 12 people uses…', ['12P3', '12C3', '12³', '3 × 12']],
    ['Choosing a committee of 4 from 10 people uses…', ['10C4', '10P4', '10⁴', '4 × 10']],
    ['A meal is 1 of 3 drinks, 1 of 5 entrées and 1 of 2 desserts. How many meals are possible?', ['30', '10', '15', '60']]
  ],
  binomial: [
    ['Which situation is binomial?', ['10 coin flips, counting heads', 'Drawing cards until an ace', 'Measuring 10 people’s heights', 'Rolling a die until a 6']],
    ['For a binomial X, P(X ≥ 4) equals…', ['1 − P(X ≤ 3)', '1 − P(X ≤ 4)', 'P(X ≤ 4)', '1 − P(X < 3)']],
    ['The mean of a binomial distribution is…', ['μ = np', 'μ = n + p', 'μ = n/p', 'μ = p/n']]
  ],
  expected: [
    ['A $5 ticket has a 1-in-100 chance to win $300. In the expected value, a win is worth…', ['$295', '$300', '$305', '$3']],
    ['An expected value of −$0.40 per game means…', ['on average you lose 40¢ a game', 'you lose 40¢ every single game', 'on average you win 40¢ a game', '40% of the games are losses']],
    ['The expected value of a discrete random variable is found by…', ['Σ x · P(x)', 'Σ P(x)', 'Σ x ÷ n', 'the most likely x']]
  ],
  normal: [
    ['A z-score of −1.5 means the value is…', ['1.5 SDs below the mean', '1.5 units below the mean', '15% below the mean', '1.5 SDs above the mean']],
    ['P(Z < 1.2) = 0.8849. What is P(Z > 1.2)?', ['0.1151', '0.8849', '0.3849', '1.8849']],
    ['To find the value that marks the top 10%, look up the z with…', ['90% below it', '10% below it', '10% above the mean', '5% in each tail']]
  ],
  clt: [
    ['The standard deviation of x̄ for samples of size n is…', ['σ/√n', 'σ', 'σ/n', 'σ√n']],
    ['As the sample size grows, the sampling distribution of x̄…', ['gets narrower', 'gets wider', 'gets more skewed', 'keeps the same spread']],
    ['Finding P(x̄ > 52) for a sample of 36 uses…', ['z = (x̄ − μ)/(σ/√n)', 'z = (x̄ − μ)/σ', 'z = (x̄ − μ)/σ²', 'z = (μ − x̄)/(σ/√n)']]
  ],
  intervals: [
    ['σ is unknown and n = 15. The confidence interval for μ uses…', ['t* with 14 df', 'z* with 14 df', 't* with 15 df', 'z* with 15 df']],
    ['A sample-size formula gives n = 96.2. How many do you need?', ['97', '96', '96.2', '100']],
    ['A 95% confidence interval for μ is (12.1, 15.3). This means…', ['we are 95% confident μ is in it', '95% of the data fall in it', 'μ falls in it 95% of the time', '95% of sample means are in it']]
  ],
  testing: [
    ['A claim says the mean is more than 50. The alternative hypothesis is…', ['μ > 50', 'μ < 50', 'μ ≠ 50', 'μ = 50']],
    ['p-value = 0.03 and α = 0.05. The decision is…', ['reject H₀', 'fail to reject H₀', 'accept H₀', 'prove H₀ false']],
    ['Rejecting H₀ when it is actually true is…', ['a Type I error', 'a Type II error', 'a correct decision', 'the power of the test']]
  ],
  choose: [
    ['The weights of 12 people are recorded before and after a diet. Which test?', ['matched-pairs t-test', 'two-sample t-test', 'chi-square test', 'one-proportion z-test']],
    ['Is age group (4 groups) related to favorite app (5 apps)? Which test?', ['chi-square for independence', 'chi-square goodness of fit', 'two-proportion z-test', 'matched-pairs t-test']],
    ['Does the percent of adults who smoke differ between two cities? Which test?', ['two-proportion z-test', 'two-sample t-test', 'one-proportion z-test', 'chi-square goodness of fit']]
  ],
  regression: [
    ['r = −0.92 describes a relationship that is…', ['strong and negative', 'weak and negative', 'strong and positive', 'weak and positive']],
    ['A residual is…', ['y − ŷ', 'ŷ − y', 'y − x̄', 'ŷ − ȳ']],
    ['In ŷ = 4 + 2.5x, the slope means…', ['ŷ rises 2.5 for each 1 unit of x', 'ŷ is 2.5 when x is 0', 'x rises 2.5 for each 1 unit of ŷ', 'ŷ rises 4 for each 1 unit of x']]
  ]
};
/* A run: one item per chosen topic, in course order, with the choices shuffled.
   rng is a function returning [0, 1); returns [{topic, q, opts, correct}]. */
function buildRun(topicIds, rng) {
  return TOPICS.filter(t => topicIds.includes(t.id)).map(t => {
    const pool = ITEMS[t.id], it = pool[Math.floor(rng() * pool.length)];
    const order = [0, 1, 2, 3];
    for (let i = 3; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    return { topic: t.id, name: t.name, q: it[0], opts: order.map(k => it[1][k]), correct: order.indexOf(0) };
  });
}
/* Class results from all answers: per item percent right; per student number right. */
function summarize(run, answers) {
  const LET = ['A', 'B', 'C', 'D'];
  const items = run.map((it, i) => {
    const a = answers.filter(x => x.q === i + 1), counts = {};
    a.forEach(x => counts[x.choice] = (counts[x.choice] || 0) + 1);
    const right = counts[LET[it.correct]] || 0;
    return { topic: it.topic, name: it.name, n: a.length, right, pct: a.length ? Math.round(100 * right / a.length) : null, counts };
  });
  const per = {};
  answers.forEach(x => { if (x.q < 1 || x.q > run.length) return; per[x.uid] = per[x.uid] || 0; if (x.choice === LET[run[x.q - 1].correct]) per[x.uid]++; });
  const dist = Array.from({ length: run.length + 1 }, () => 0);
  Object.values(per).forEach(s => dist[s]++);
  /* Focus: the (up to) three weakest topics under 75%. A tie at the cut-off is never split arbitrarily:
     only topics strictly below the tied value are kept, and if that leaves none and too many are tied, none are flagged. */
  const low = items.filter(x => x.pct != null && x.pct < 75).sort((a, b) => a.pct - b.pct);
  let focus = low.slice(0, 3);
  if (low.length > 3 && low[2].pct === low[3].pct) {
    focus = low.filter(x => x.pct < low[2].pct);
    if (!focus.length) { const tied = low.filter(x => x.pct === low[0].pct); focus = tied.length <= 3 ? tied : []; }
  }
  focus = focus.map(x => x.topic);
  return { items, dist, students: Object.keys(per).length, focus };
}
</script>

<script type="module">
/* ==================================================================
   Host page. Items run on a timer, one per topic, with no reveal in
   between, so the whole thing takes about two minutes. Then the
   projector shows a heat map by topic and each phone gets its own
   study map. Phones answer through diagnostic.html on the shared
   Firebase project (same sessions/answers/members shapes, so the
   existing security rules work unchanged). Paper mode runs the same
   slides and ends with an answer key.
   ================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LETTERS = ['A', 'B', 'C', 'D'], SAVE = 'twoMinDiagV1', CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
const app = $('app');
let S = { topics: TOPICS.map(t => t.id), sec: 10, mode: 'live' };
try { Object.assign(S, JSON.parse(localStorage.getItem(SAVE) || '{}')); } catch (e) {}
const saveS = () => { try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {} };
const G = { phase: 'setup', run: [], i: 0, timerEnd: 0, timerMs: 0, left: 0, paused: false, tick: null, sum: null, showItems: false };

/* ---------- Firebase ---------- */
const L = { ok: false, F: null, auth: null, db: null, user: null, code: null, ref: null, endedRef: null, joined: 0, all: [], unsubs: [], error: '' };
async function liveLoad() {
  try {
    const cfg = await import('./live-config.js');
    const base = `https://www.gstatic.com/firebasejs/${cfg.FIREBASE_VERSION}/`;
    const [a, au, fs] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
    L.F = { ...au, ...fs };
    const fa = a.initializeApp(cfg.firebaseConfig);
    L.auth = au.getAuth(fa); L.db = fs.getFirestore(fa);
    au.onAuthStateChanged(L.auth, u => { L.user = u && !u.isAnonymous ? u : null; if (G.phase === 'setup') render(); });
    L.ok = true;
  } catch (e) { L.ok = false; L.error = 'Phones are unavailable here (this computer could not reach Firebase). Paper mode still works.'; }
  if (G.phase === 'setup') render();
}
function explain(e) {
  if (e && e.code === 'permission-denied') return 'Firebase refused the request. Check that your Google email is in the security rules and that the rules are published.';
  if (e && e.code === 'auth/popup-blocked') return 'The browser blocked the sign-in window. Allow pop-ups for this site and try again.';
  if (e && e.code === 'auth/unauthorized-domain') return 'This website is not on the Authorized domains list in Firebase.';
  if (e && (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request')) return 'Sign-in was cancelled.';
  return 'Something went wrong talking to Firebase' + (e && e.code ? ' (' + e.code + ')' : '') + '.';
}
const setMsg = t => { $('msg').textContent = t || ''; };
const live = () => S.mode === 'live' && L.ok;
async function liveStart() {
  const F = L.F;
  if (!L.user) { try { L.user = (await F.signInWithPopup(L.auth, new F.GoogleAuthProvider())).user; } catch (e) { setMsg(explain(e)); return false; } }
  try {
    let code = null;
    for (let t = 0; t < 8 && !code; t++) {
      let c = ''; for (let k = 0; k < 4; k++) c += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
      if (!(await F.getDoc(F.doc(L.db, 'sessions', c))).exists()) code = c;
    }
    if (!code) throw new Error('no free code');
    L.code = code; L.ref = F.doc(L.db, 'sessions', code);
    await F.setDoc(L.ref, { host: L.user.uid, created: F.serverTimestamp(), game: 'diagnostic', open: false, q: -1, asked: 0, qtext: '', opts: [], label: '', limit: 0, total: G.run.length, results: null, ended: false });
    L.unsubs.push(F.onSnapshot(F.collection(L.ref, 'members'), s => { L.joined = s.size; drawMeta(); const j = $('joined'); if (j) j.textContent = L.joined + ' joined'; }));
    /* every answer, every item: the teacher may read them all */
    L.unsubs.push(F.onSnapshot(F.collection(L.ref, 'answers'), s => {
      const a = []; s.forEach(d => { const x = d.data(); a.push({ uid: x.uid, q: x.q, choice: x.choice }); });
      L.all = a; if (G.phase === 'run') drawAnswered();
    }, () => {}));
    return true;
  } catch (e) { setMsg(explain(e)); L.ref = null; return false; }
}
async function liveUpdate(fields) { if (!L.ref) return; try { await L.F.updateDoc(L.ref, fields); } catch (e) { setMsg(explain(e)); } }
async function liveFinish() {
  L.unsubs.forEach(u => u()); L.unsubs = [];
  L.endedRef = L.ref; L.ref = null;
}
async function liveDelete(m) {
  const F = L.F, ref = L.endedRef;
  if (!ref) { if (m) m.textContent = 'Already deleted.'; return; }
  if (m) m.textContent = 'Deleting…';
  try {
    for (const sub of ['answers', 'members']) {
      const snap = await F.getDocs(F.collection(ref, sub)); const docs = []; snap.forEach(d => docs.push(d.ref));
      for (let i = 0; i < docs.length; i += 400) { const b = F.writeBatch(L.db); docs.slice(i, i + 400).forEach(r => b.delete(r)); await b.commit(); }
    }
    await F.deleteDoc(ref); L.endedRef = null;
    if (m) m.textContent = 'Deleted from Firebase. Phones that already loaded their study maps keep them.';
  } catch (e) { if (m) m.textContent = explain(e); }
}

/* ---------- screens ---------- */
function drawMeta() {
  const m = $('meta'); if (G.phase === 'setup') { m.innerHTML = ''; return; }
  m.innerHTML = (live() && (L.code || L.endedRef) ? '<span>Room <b>' + esc(L.code || '') + '</b></span><span>' + L.joined + ' joined</span>' : '') +
    (G.phase === 'run' ? '<span>Item <b>' + (G.i + 1) + '</b> of ' + G.run.length + '</span>' : '');
}
function render() { drawMeta(); ({ setup: renderSetup, lobby: renderLobby, run: renderRun, results: renderResults, key: renderKey })[G.phase](); }

function renderSetup() {
  let h = '<div class="setup"><div class="card"><h2>Set up</h2><p class="lede">One quick item per topic, about 10 seconds each, no calculator. There is no reveal between items, so the whole check takes about two minutes. Then you see the class by topic and each student gets a study map.</p>' +
    '<fieldset><legend>Topics (' + S.topics.length + ' items, about ' + Math.round(S.topics.length * S.sec / 6) / 10 + ' minutes)</legend><div class="tgrid">' +
    TOPICS.map(t => '<label class="chk"><input type="checkbox" data-t="' + t.id + '"' + (S.topics.includes(t.id) ? ' checked' : '') + '><span>' + esc(t.name) + ' <span class="u">Unit ' + t.unit + '</span></span></label>').join('') +
    '</div></fieldset><fieldset><legend>Timer</legend><div class="row"><label for="sec">Seconds per item</label><input type="number" id="sec" min="6" max="30" value="' + S.sec + '"></div></fieldset></div>';
  h += '<div class="card"><fieldset><legend>How students answer</legend>' +
    '<label class="chk"><input type="radio" name="mode" value="live"' + (live() ? ' checked' : '') + (L.ok ? '' : ' disabled') + '><span>On phones<small>Students scan a QR code and answer on diagnostic.html. No names are collected. You sign in with Google.' + (L.ok ? '' : ' <b>Not available on this computer right now.</b>') + '</small></span></label>' +
    '<label class="chk"><input type="radio" name="mode" value="paper"' + (!live() ? ' checked' : '') + '><span>Paper<small>Students number a sheet and write their letters; the answer key and study links show at the end.</small></span></label>' +
    '</fieldset><div class="btnrow"><button class="btn big" id="go">' + (live() ? (L.user ? 'Open the room' : 'Sign in and open the room') : 'Start') + '</button></div>' + (L.error ? '<p class="note">' + esc(L.error) + '</p>' : '') + '</div></div>';
  app.innerHTML = h;
  const read = () => {
    S.topics = [...app.querySelectorAll('[data-t]')].filter(x => x.checked).map(x => x.dataset.t);
    const v = parseInt($('sec').value, 10); S.sec = isNaN(v) ? 10 : Math.max(6, Math.min(30, v));
    const m = app.querySelector('[name=mode]:checked'); if (m) S.mode = m.value;
    saveS();
  };
  app.querySelectorAll('input').forEach(x => x.addEventListener('change', () => { if (!x.isConnected) return; read(); setTimeout(renderSetup, 0); }));
  $('go').onclick = async () => {
    read(); setMsg('');
    if (!S.topics.length) { setMsg('Pick at least one topic.'); return; }
    G.run = buildRun(S.topics, Math.random); G.i = 0; G.sum = null; G.showItems = false;
    if (live()) { $('go').disabled = true; if (!(await liveStart())) { $('go').disabled = false; return; } G.phase = 'lobby'; render(); }
    else startRun();
  };
}
function renderLobby() {
  const url = new URL('diagnostic.html?room=' + L.code, location.href).href;
  app.innerHTML = '<div class="card lobby"><div><div class="qr" id="qr" aria-hidden="true"></div></div><div>' +
    '<p class="step">Scan, or go to the address and type the code</p><p class="code" aria-label="Room code ' + esc(L.code.split('').join(' ')) + '">' + esc(L.code) + '</p>' +
    '<p class="url">' + esc(url.replace(/^https?:\/\//, '')) + '</p><p class="joined" id="joined">' + L.joined + ' joined</p>' +
    '<p class="lede">' + G.run.length + ' quick items, ' + S.sec + ' seconds each. No calculator needed. Go with your first instinct: this is a check, not a grade.</p>' +
    '<div class="btnrow"><button class="btn big" id="begin">Start the clock</button></div></div></div>';
  try { new window.QRCode($('qr'), { text: url, width: 260, height: 260, correctLevel: window.QRCode.CorrectLevel.M }); } catch (e) { $('qr').textContent = ''; }
  $('begin').onclick = startRun;
}

function startRun() { G.phase = 'run'; G.i = 0; showItem(); }
async function showItem() {
  const it = G.run[G.i];
  G.paused = false; G.timerMs = S.sec * 1000; G.timerEnd = Date.now() + G.timerMs;
  render();
  if (live()) liveUpdate({ q: G.i + 1, asked: G.i + 1, open: true, qtext: it.q, opts: it.opts, label: 'Item ' + (G.i + 1) + ' of ' + G.run.length + ' · ' + it.name, limit: S.sec });
  clearInterval(G.tick); G.tick = setInterval(tickTimer, 200); tickTimer();
}
function tickTimer() {
  if (G.phase !== 'run') { clearInterval(G.tick); return; }
  const left = G.paused ? G.left : Math.max(0, G.timerEnd - Date.now()), el = $('tbar'), tx = $('tleft');
  if (el) { el.firstChild.style.width = (100 * left / G.timerMs) + '%'; el.classList.toggle('low', left < 3000); }
  if (tx) tx.textContent = G.paused ? 'paused' : Math.ceil(left / 1000) + ' s';
  if (!G.paused && left <= 0) advance();
}
function drawAnswered() {
  const el = $('answered'); if (!el) return;
  const n = L.all.filter(a => a.q === G.i + 1).length;
  el.textContent = n + ' of ' + L.joined + ' answered';
  if (!G.paused && L.joined > 0 && n >= L.joined && G.timerEnd - Date.now() > 1000) G.timerEnd = Date.now() + 1000;   // everyone is in: move on
}
let advancing = false;
async function advance() {
  if (G.phase !== 'run' || advancing) return;
  advancing = true; clearInterval(G.tick);
  if (G.i < G.run.length - 1) { G.i++; advancing = false; showItem(); return; }
  if (live()) {
    await liveUpdate({ open: false });
    await new Promise(r => setTimeout(r, 1200));                      // let the last answers arrive
    G.sum = summarize(G.run, L.all);
    await liveUpdate({ label: 'Done', results: {
      key: G.run.map(it => LETTERS[it.correct]),
      items: G.run.map(it => ({ topic: it.topic, name: it.name, q: it.q, right: it.opts[it.correct] })),
      topics: TOPICS.filter(t => S.topics.includes(t.id)).map(t => ({ id: t.id, name: t.name, links: t.links.map(l => ({ label: l[0], url: l[1] })) }))
    } });
    await liveFinish();
    G.phase = 'results';
  } else G.phase = 'key';
  advancing = false;
  render();
}
function renderRun() {
  const it = G.run[G.i];
  app.innerHTML = '<div class="card"><div class="qhead"><span class="step">Item ' + (G.i + 1) + ' of ' + G.run.length + ' · ' + esc(it.name) + '</span><span class="step">No calculator · first instinct</span></div>' +
    '<div class="pips">' + G.run.map((_, k) => '<span class="pip' + (k < G.i ? ' done' : k === G.i ? ' now' : '') + '"></span>').join('') + '</div>' +
    '<p class="qtext">' + esc(it.q) + '</p><div class="opts">' + it.opts.map((o, k) => '<div class="opt"><span class="ltr">' + LETTERS[k] + '</span><span>' + esc(o) + '</span></div>').join('') + '</div>' +
    '<div class="timer" id="tbar"><i></i></div><div class="tline"><span id="answered">' + (live() ? '' : 'Write your letter') + '</span><b id="tleft"></b></div>' +
    '<div class="btnrow"><button class="btn quiet" id="pause">' + (G.paused ? 'Resume' : 'Pause') + '</button><button class="btn quiet" id="skip">Next item →</button></div><p class="kbd">Keyboard: → moves on now; P pauses.</p></div>';
  $('pause').onclick = togglePause; $('skip').onclick = advance;
  if (live()) drawAnswered();
}
function togglePause() {
  if (G.phase !== 'run') return;
  if (G.paused) { G.timerEnd = Date.now() + G.left; G.paused = false; }
  else { G.left = Math.max(0, G.timerEnd - Date.now()); G.paused = true; }
  $('pause').textContent = G.paused ? 'Resume' : 'Pause'; tickTimer();
}

const lv = p => p == null ? '' : p < 50 ? 'lv0' : p < 75 ? 'lv1' : 'lv2';
function renderResults() {
  const s = G.sum, top = Math.max(1, ...s.dist);
  let h = '<div class="res"><div class="card"><h2>Class results by topic</h2><p class="lede">' + s.students + ' student' + (s.students === 1 ? '' : 's') + ' answered. The weakest topics are marked <span class="tag">focus</span>.</p>' +
    s.items.map(x => '<div class="hrow' + (s.focus.includes(x.topic) ? ' focus' : '') + '"><span class="nm">' + esc(x.name) + (s.focus.includes(x.topic) ? '<span class="tag">focus</span>' : '') + '<small>' + x.right + ' of ' + x.n + ' right</small></span>' +
      '<span class="hbar ' + lv(x.pct) + '" role="img" aria-label="' + (x.pct == null ? 'no answers' : x.pct + ' percent right') + '"><i style="width:' + (x.pct || 0) + '%"></i></span><span class="pc">' + (x.pct == null ? '–' : x.pct + '%') + '</span></div>').join('') +
    '<p class="legend">Green: 75% or more · gold: 50–74% · red: under 50%.</p>' +
    '<div class="btnrow"><button class="btn quiet" id="items">' + (G.showItems ? 'Hide the items' : 'Show the items and answers') + '</button></div>' +
    (G.showItems ? itemsTable(true) : '') + '</div>';
  h += '<div><div class="card focusbox"><h3 style="margin-top:0">Focus today</h3>' + (s.focus.length ? '<ul>' + s.focus.map(id => { const t = TOPICS.find(x => x.id === id); return '<li><b>' + esc(t.name) + '</b>: ' + t.links.map(l => '<a href="' + l[1] + '" target="_blank" rel="noopener">' + esc(l[0]) + '</a>').join(' · ') + '</li>'; }).join('') + '</ul>' : (s.items.every(x => x.pct == null || x.pct >= 75) ? '<p class="lede">Every topic is at 75% or better. Nice.</p>' : '<p class="lede">No single topic stands out: the weak spots are spread evenly. Pick from the red and gold rows.</p>')) +
    '<p class="lede" style="font-size:15px">Each student’s phone now shows their own study map with these links.</p></div>' +
    '<div class="card" style="margin-top:16px"><h3 style="margin-top:0">How many each student got</h3><div class="spread">' + s.dist.map(c => '<div style="height:' + (100 * c / top) + '%"><span>' + (c || '') + '</span></div>').join('') + '</div>' +
    '<div class="saxis">' + s.dist.map((_, k) => '<span>' + k + '</span>').join('') + '</div><p class="legend">Number right out of ' + G.run.length + '.</p></div>' +
    '<div class="card" style="margin-top:16px"><div class="btnrow" style="margin-top:0"><button class="btn" id="csv">Download results</button><button class="btn quiet" id="del">Delete session data</button><button class="btn quiet" id="again">New diagnostic</button></div><p class="lede" id="delMsg" role="status" style="margin:10px 0 0;font-size:15px"></p></div></div></div>';
  app.innerHTML = h;
  $('items').onclick = () => { G.showItems = !G.showItems; renderResults(); };
  $('csv').onclick = downloadCsv;
  $('del').onclick = () => liveDelete($('delMsg'));
  $('again').onclick = () => { G.phase = 'setup'; L.code = null; render(); };
}
function itemsTable(withCounts) {
  return '<table style="margin-top:14px"><thead><tr><th>#</th><th>Item</th><th>Answer</th>' + (withCounts ? '<th>A</th><th>B</th><th>C</th><th>D</th>' : '') + '</tr></thead><tbody>' +
    G.run.map((it, k) => { const x = G.sum && G.sum.items[k]; return '<tr><td class="num">' + (k + 1) + '</td><td>' + esc(it.q) + '<br><small class="lede">' + esc(it.name) + '</small></td><td><b>' + LETTERS[it.correct] + '</b> ' + esc(it.opts[it.correct]) + '</td>' +
      (withCounts ? LETTERS.map(l => '<td class="num">' + ((x && x.counts[l]) || 0) + '</td>').join('') : '') + '</tr>'; }).join('') + '</tbody></table>';
}
function renderKey() {
  app.innerHTML = '<div class="card"><h2>Answer key</h2><p class="lede">Students mark their own sheets. Any topic they missed is one to review today.</p>' + itemsTable(false) +
    '<h3>Where to review each topic</h3><table><tbody>' + TOPICS.filter(t => S.topics.includes(t.id)).map(t => '<tr><td>' + esc(t.name) + '</td><td>' + t.links.map(l => '<a href="' + l[1] + '" target="_blank" rel="noopener">' + esc(l[0]) + '</a>').join(' · ') + '</td></tr>').join('') + '</tbody></table>' +
    '<div class="btnrow"><button class="btn quiet" id="again">New diagnostic</button></div></div>';
  $('again').onclick = () => { G.phase = 'setup'; render(); };
}
function downloadCsv() {
  const cell = v => { const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const lines = [['Order', 'Topic', 'Item', 'Correct answer', 'A', 'B', 'C', 'D', 'Answered', 'Percent right'].join(',')]
    .concat(G.run.map((it, k) => { const x = G.sum.items[k]; return [k + 1, it.name, it.q, LETTERS[it.correct] + ': ' + it.opts[it.correct], ...LETTERS.map(l => x.counts[l] || 0), x.n, x.pct == null ? '' : x.pct].map(cell).join(','); }))
    .concat(['', 'Number right,Students'], G.sum.dist.map((c, k) => k + ',' + c));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' }));
  a.download = 'two-minute-diagnostic' + (L.code ? '-' + L.code : '') + '.csv';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
document.addEventListener('keydown', e => {
  if (G.phase !== 'run') return;
  const t = e.target; if (t.matches && t.matches('input,textarea,select')) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); advance(); }
  else if (e.key === 'p' || e.key === 'P') { e.preventDefault(); togglePause(); }
});
window.addEventListener('beforeunload', e => { if (G.phase === 'run') { e.preventDefault(); e.returnValue = ''; } });
window.DIAG = { G, S, L };   /* read-only hook for testing */
render();
liveLoad();
</script>
</body>
</html>
