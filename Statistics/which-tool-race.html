<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Which Tool? Race · Math 1342</title>
<style>
:root{
  --paper:#F3F1E7; --sheet:#FBFAF4; --card:#FFFFFF; --rule:#D8D3C2; --ink:#14213D; --ink-soft:#4F586C;
  --blue:#1F4E9C; --blue-soft:#E4EBF7; --on-blue:#FFFFFF; --ok:#22603C; --ok-soft:#E2EFE7; --no:#A31F1C; --no-soft:#F7E4E3; --gold:#B58B15; --gold-soft:#F6EED5;
  --t0:#1F4E9C; --t1:#A33A1C; --t2:#22603C; --t3:#6B3FA0; --t4:#8A6A0A;
  --serif:Georgia,'Iowan Old Style','Times New Roman',serif; --sans:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#151A22; --sheet:#1B212B; --card:#212834; --rule:#38414F; --ink:#E8EBF1; --ink-soft:#A7B0BF;
  --blue:#8FB0EC; --blue-soft:#24324A; --on-blue:#0F1724; --ok:#7BD3A0; --ok-soft:#1E3529; --no:#F29A92; --no-soft:#3A2224; --gold:#E0BC5A; --gold-soft:#3A3220;
  --t0:#8FB0EC; --t1:#F0A080; --t2:#7BD3A0; --t3:#C4A5F0; --t4:#E0BC5A; color-scheme:dark;}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:19px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding:18px 24px 40px}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:3px double var(--ink);padding:4px 0 10px;margin-bottom:18px;flex-wrap:wrap}
h1{font-family:var(--serif);font-size:32px;margin:0;line-height:1.1}
h1 small{display:block;font-family:var(--mono);font-size:13px;font-weight:400;color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.meta{font-family:var(--mono);font-size:15px;color:var(--ink-soft);display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.meta b{color:var(--ink)}
h2{font-family:var(--serif);font-size:26px;margin:0 0 10px}
h3{font-family:var(--serif);font-size:20px;margin:18px 0 8px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:20px 22px}
.lede{color:var(--ink-soft);margin:0 0 14px}
.btn{font:inherit;font-weight:600;padding:11px 22px;border-radius:6px;border:1px solid var(--blue);background:var(--blue);color:var(--on-blue);cursor:pointer}
.btn.quiet{background:transparent;color:var(--blue)}
.btn.big{font-size:22px;padding:14px 30px}
.btn:disabled{opacity:.5;cursor:default}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:16px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hidden{display:none!important}
.msg{margin:12px 0 0;padding:10px 14px;border-left:4px solid var(--no);background:var(--no-soft);border-radius:0 4px 4px 0;font-size:16px}
.msg:empty{display:none}
.note{margin:12px 0 0;padding:10px 14px;border-left:4px solid var(--blue);background:var(--blue-soft);border-radius:0 4px 4px 0;font-size:16px}
/* setup */
.setup{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:900px){.setup{grid-template-columns:1fr}}
fieldset{border:1px solid var(--rule);border-radius:4px;padding:12px 16px 14px;margin:0 0 14px}
legend{font-weight:700;padding:0 6px}
.chk{display:flex;gap:10px;align-items:flex-start;margin:6px 0;cursor:pointer}
.chk input{width:20px;height:20px;margin-top:4px;flex:0 0 auto}
.chk small{display:block;color:var(--ink-soft);font-size:14.5px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:8px 0}
.row label{min-width:170px}
input[type=number],input[type=text]{font:inherit;padding:7px 10px;border:1px solid var(--rule);border-radius:4px;background:var(--card);color:var(--ink)}
input[type=number]{width:90px}
.teamin{display:flex;gap:10px;align-items:center;margin:6px 0}
.teamin .sw{width:30px;height:30px;border-radius:4px;flex:0 0 auto;display:grid;place-items:center;font-family:var(--mono);font-weight:700;color:#fff}
.teamin input{flex:1;min-width:0}
/* lobby */
.lobby{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:start}
@media (max-width:900px){.lobby{grid-template-columns:1fr}}
.qr{background:#fff;padding:14px;border-radius:6px;width:max-content}
.code{font-family:var(--mono);font-size:72px;font-weight:700;letter-spacing:.18em;margin:0;line-height:1}
.url{font-family:var(--mono);font-size:17px;color:var(--ink-soft);margin:6px 0 16px;word-break:break-all}
.teamcounts{display:grid;gap:10px}
.tc{display:flex;align-items:center;gap:14px;padding:10px 14px;border:1px solid var(--rule);border-radius:6px;background:var(--card);font-size:22px}
.tc .ltr{font-family:var(--mono);font-weight:700;width:34px;height:34px;border-radius:4px;color:#fff;display:grid;place-items:center;flex:0 0 auto}
.tc .n{margin-left:auto;font-family:var(--mono);font-weight:700}
/* question */
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.step{font-family:var(--mono);font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.step b{color:var(--blue)}
.scen{font-family:var(--serif);font-size:31px;line-height:1.38;margin:6px 0 14px}
.toolchip{display:inline-block;font-family:var(--mono);font-size:16px;padding:4px 10px;border-radius:4px;background:var(--blue-soft);color:var(--blue);margin-bottom:10px}
.ask{font-weight:700;font-size:22px;margin:0 0 12px}
.opts{display:grid;gap:12px}
.opts.five{grid-template-columns:1fr 1fr}
.opts.five .opt:last-child{grid-column:1 / -1}
@media (max-width:900px){.opts.five{grid-template-columns:1fr}}
.opt{display:flex;gap:16px;align-items:center;padding:14px 18px;border:2px solid var(--rule);border-radius:8px;background:var(--card);font-size:24px;line-height:1.3;position:relative;overflow:hidden;min-height:68px}
.opt .ltr{font-family:var(--mono);font-weight:700;font-size:28px;flex:0 0 30px;position:relative}
.opt .txt{position:relative;flex:1}
.opt .cnt{position:relative;font-family:var(--mono);font-size:20px;font-weight:700;color:var(--ink-soft)}
.opt .fill{position:absolute;left:0;top:0;bottom:0;background:var(--blue-soft);width:0;transition:width .6s}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .fill{background:color-mix(in srgb, var(--ok) 22%, transparent)}
.opt.right .ltr::after{content:'✓';margin-left:4px;color:var(--ok)}
.opt.dim{opacity:.62}
.timer{height:14px;border-radius:7px;background:var(--rule);overflow:hidden;margin:14px 0 6px}
.timer i{display:block;height:100%;background:var(--blue);width:100%;transition:width .25s linear}
.timer.low i{background:var(--no)}
.tline{display:flex;justify-content:space-between;font-family:var(--mono);font-size:18px;color:var(--ink-soft)}
.tline b{color:var(--ink);font-size:24px}
.why{margin:16px 0 0;padding:12px 16px;border-left:5px solid var(--ok);background:var(--ok-soft);border-radius:0 4px 4px 0;font-size:21px}
.why b{font-family:var(--mono);font-size:15px;letter-spacing:.06em;text-transform:uppercase;display:block;color:var(--ok)}
/* layout with board */
.stage{display:grid;grid-template-columns:1fr 330px;gap:22px;align-items:start}
@media (max-width:1000px){.stage{grid-template-columns:1fr}}
.board h3{margin-top:0}
.brow{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;margin:10px 0}
.brow .pl{font-family:var(--mono);font-weight:700;color:var(--ink-soft)}
.brow .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .sc{font-family:var(--mono);font-weight:700;font-size:20px}
.brow .bar{grid-column:2 / 4;height:10px;border-radius:5px;background:var(--rule);overflow:hidden;margin-top:-6px}
.brow .bar i{display:block;height:100%;transition:width .7s}
.gain{font-family:var(--mono);font-size:15px;color:var(--ok);margin-left:6px}
.offl{display:grid;gap:8px;margin-top:6px}
.offl label{display:flex;gap:10px;align-items:center;font-size:19px;cursor:pointer;padding:6px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--card)}
.offl input{width:22px;height:22px}
/* final */
.podium{display:flex;gap:16px;align-items:flex-end;justify-content:center;margin:12px 0 22px;flex-wrap:wrap}
.pod{text-align:center;min-width:170px}
.pod .blk{border-radius:6px 6px 0 0;color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:40px;font-weight:700}
.pod .nm{font-family:var(--serif);font-size:24px;font-weight:700;margin-bottom:4px}
.pod .sc{font-family:var(--mono);font-size:18px;color:var(--ink-soft);margin-bottom:6px}
table{border-collapse:collapse;width:100%;font-size:16.5px}
th,td{border-bottom:1px solid var(--rule);padding:8px 10px;text-align:left;vertical-align:top}
thead th{font-family:var(--mono);font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft)}
td.num{font-family:var(--mono);white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.kbd{font-family:var(--mono);font-size:13px;color:var(--ink-soft);margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1><small>Math 1342 · Final review</small>Which Tool? Race</h1>
    <div class="meta" id="meta"></div>
  </header>
  <main id="app" aria-live="polite"></main>
  <p class="msg" id="msg" role="alert"></p>
</div>

<script>
/* ==================================================================
   WHICH TOOL? RACE — scenario bank (Math 1342, whole course)
   Step 1 names the tool; step 2 names the detail that costs points.
   Contexts are new: none repeats a final exam question.
   ================================================================== */
var UNITS = [
  { id: 'u1', label: 'Unit I · Collecting data' },
  { id: 'u2', label: 'Unit II · Describing data & probability' },
  { id: 'u3', label: 'Unit III · Distributions, CLT & intervals' },
  { id: 'u4', label: 'Unit IV · Regression & hypothesis tests' }
];
var TOOLS = [
  { id: 'sampling', ask: 'Which sampling method?', unit: 'u1', label: 'Sampling method chosen', details: ['Simple random', 'Stratified', 'Cluster', 'Systematic', 'Convenience'], confuse: ['study', 'levels', 'display'] },
  { id: 'levels', ask: 'Which level of measurement?', unit: 'u1', label: 'Data level of measurement', details: ['Nominal', 'Ordinal', 'Interval', 'Ratio'], confuse: ['sampling', 'display', 'study'] },
  { id: 'study', ask: 'Which kind of study?', unit: 'u1', label: 'Study design (which type)', details: ['Experiment', 'Cross-sectional (observational)', 'Retrospective (observational)', 'Prospective (observational)'], confuse: ['sampling', 'levels', 'display'], avoid: ['test1', 'test2', 'chi'] },
  { id: 'display', ask: 'Which one fits best?', unit: 'u2', label: 'Which graph or summary', details: ['Bar or pie chart', 'Histogram', 'Side-by-side box plots', 'Median and IQR', 'Mean and standard deviation'], confuse: ['levels', 'regression', 'normal'], avoid: ['test1', 'test2', 'chi'] },
  { id: 'counting', ask: 'Which counting method?', unit: 'u2', label: 'Counting arrangements', details: ['Counting principle (multiply)', 'Permutation (order matters)', 'Combination (order does not matter)'], confuse: ['prob', 'binomial', 'expected'] },
  { id: 'prob', ask: 'Which rule?', unit: 'u2', label: 'Basic probability rule', details: ['Or, no overlap: add', 'Or, with overlap: add, then subtract the overlap', 'And, independent: multiply', 'Complement: 1 − P', 'Conditional: given that'], confuse: ['binomial', 'counting', 'expected'] },
  { id: 'binomial', ask: 'Which probability do you need?', unit: 'u2', label: 'Binomial distribution', details: ['P(X = k)', 'P(X ≤ k)', 'P(X ≥ k)', 'P(a ≤ X ≤ b)'], confuse: ['prob', 'normal', 'expected'] },
  { id: 'expected', ask: 'Which calculation?', unit: 'u2', label: 'Expected value (mean)', details: ['Σ x·P(x) with the payouts as given', 'Σ x·P(x) with net payouts (prize − cost)', 'Binomial mean: μ = np'], confuse: ['prob', 'binomial', 'uniform'] },
  { id: 'uniform', ask: 'Which calculation?', unit: 'u3', label: 'Uniform: equally likely', details: ['Area = width × 1/(b − a)', 'Probability 0: the value is outside the range', 'Mean = (a + b)/2'], confuse: ['normal', 'expected', 'clt'] },
  { id: 'normal', ask: 'Which kind of normal problem?', unit: 'u3', label: 'Normal: a single value', details: ['Left tail: P(X < x)', 'Right tail: P(X > x)', 'Between: P(a < X < b)', 'Inverse: find x from a percent'], confuse: ['clt', 'uniform', 'binomial'] },
  { id: 'clt', ask: 'Which sampling distribution?', unit: 'u3', label: 'CLT: a sample mean or p̂', details: ['Mean of n: x̄ ~ N(μ, σ/√n)', 'Proportion of n: p̂ ~ N(p, √(p(1 − p)/n))'], confuse: ['normal', 'interval', 'test1'] },
  { id: 'interval', ask: 'Which interval?', unit: 'u3', label: 'Confidence interval (CI)', details: ['Z-interval (σ known)', 'T-interval (only s)', 'Proportion interval'], confuse: ['test1', 'samplesize', 'clt'] },
  { id: 'samplesize', ask: 'Which formula?', unit: 'u3', label: 'Finding the sample size', details: ['Mean: n = (z*σ / E)²', 'Proportion, with an estimate p̂', 'Proportion, no estimate: use p̂ = 0.5'], confuse: ['interval', 'clt', 'test1'] },
  { id: 'regression', ask: 'Which one is it?', unit: 'u4', label: 'Correlation or regression', details: ['Correlation r: strength and direction', 'Prediction: ŷ from the regression line', 'Residual: y − ŷ'], confuse: ['display', 'test2', 'chi'] },
  { id: 'test1', ask: 'Which test?', unit: 'u4', label: 'One-sample hypothesis test', details: ['z-test for μ (σ known)', 't-test for μ (only s)', 'z-test for p'], confuse: ['test2', 'interval', 'chi'] },
  { id: 'test2', ask: 'Which test?', unit: 'u4', label: 'Two-sample hypothesis test', details: ['Two proportions', 'Independent means', 'Matched pairs'], confuse: ['test1', 'chi', 'regression'] },
  { id: 'chi', ask: 'Which chi-square test?', unit: 'u4', label: 'Chi-square test (counts)', details: ['Goodness of fit', 'Independence', 'Homogeneity'], confuse: ['test2', 'test1', 'prob'] }
];
/* d = index into the tool's details */
var BANK = [
/* ---- sampling ---- */
{ id: 'sa1', tool: 'sampling', d: 3, text: 'A theme park surveys every 25th visitor who walks through the main gate.', why: 'Every k-th visitor after a start is systematic.' },
{ id: 'sa2', tool: 'sampling', d: 1, text: 'A college splits its students into freshmen, sophomores and returning adults, then randomly picks 30 from each group.', why: 'Some from every group is stratified.' },
{ id: 'sa3', tool: 'sampling', d: 2, text: 'An airline randomly picks 6 of its flights and surveys every passenger on those flights.', why: 'All of a few randomly chosen groups is cluster.' },
{ id: 'sa4', tool: 'sampling', d: 0, text: 'A manager gives every employee a number and uses a random number generator to choose 40 of them.', why: 'Every set of 40 is equally likely: simple random.' },
{ id: 'sa5', tool: 'sampling', d: 4, text: 'A reporter asks shoppers leaving the nearest grocery store what they think of a new law.', why: 'Whoever is easy to reach is convenience.' },
{ id: 'sa6', tool: 'sampling', d: 2, text: 'A school district randomly chooses 4 elementary schools and tests the reading level of every student in them.', why: 'Every student in a few chosen schools: cluster.' },
/* ---- levels ---- */
{ id: 'le1', tool: 'levels', d: 1, text: 'Customers rate a restaurant as poor, fair, good or excellent. What level of measurement is the rating?', why: 'Ordered categories with unequal gaps: ordinal.' },
{ id: 'le2', tool: 'levels', d: 3, text: 'A researcher records how many minutes each patient waited in the clinic. What level of measurement?', why: 'A true zero (no wait) makes ratios meaningful: ratio.' },
{ id: 'le3', tool: 'levels', d: 0, text: 'A survey records each student’s major. What level of measurement?', why: 'Names with no order: nominal.' },
{ id: 'le4', tool: 'levels', d: 2, text: 'A weather station records the daily high temperature in °F. What level of measurement?', why: 'Equal gaps but 0 °F is not “no temperature”: interval.' },
{ id: 'le5', tool: 'levels', d: 1, text: 'Runners are recorded by finishing place: 1st, 2nd, 3rd, and so on. What level of measurement?', why: 'An order, but the time gaps between places differ: ordinal.' },
/* ---- study ---- */
{ id: 'st1', tool: 'study', d: 0, text: 'Volunteers are randomly assigned to drink coffee or decaf, and their reaction times are measured.', why: 'The researcher assigns the treatment: experiment.' },
{ id: 'st2', tool: 'study', d: 2, text: 'Researchers look through 20 years of hospital records to compare heart disease in smokers and non-smokers.', why: 'Looking back at existing records: retrospective.' },
{ id: 'st3', tool: 'study', d: 3, text: 'A group of 1,000 teenagers is followed for 15 years to see who develops diabetes.', why: 'Following subjects forward in time: prospective.' },
{ id: 'st4', tool: 'study', d: 1, text: 'A survey asks adults today how many hours they sleep and how stressed they feel.', why: 'One point in time, no treatment: cross-sectional.' },
{ id: 'st5', tool: 'study', d: 0, text: 'Tomato plants are randomly given one of three fertilizers, and their yields are compared.', why: 'Treatments are assigned at random: experiment.' },
/* ---- display ---- */
{ id: 'di1', tool: 'display', d: 0, text: 'You want to show the percent of students in each major.', why: 'One categorical variable: a bar or pie chart.' },
{ id: 'di2', tool: 'display', d: 3, text: 'Home prices in a city are strongly skewed right by a few mansions. Which center and spread should you report?', why: 'Skewed data with outliers: median and IQR resist them.' },
{ id: 'di3', tool: 'display', d: 2, text: 'You want to compare the commute times of students who drive with students who take the bus.', why: 'A quantitative variable across groups: side-by-side box plots.' },
{ id: 'di4', tool: 'display', d: 1, text: 'You want to see the shape of 200 exam scores: symmetric, skewed, or bimodal?', why: 'Shape of one quantitative variable: a histogram.' },
{ id: 'di5', tool: 'display', d: 4, text: 'Heights of adult women are roughly symmetric with no outliers. Which center and spread should you report?', why: 'Symmetric, no outliers: mean and standard deviation.' },
/* ---- counting ---- */
{ id: 'co1', tool: 'counting', d: 1, text: 'In how many ways can 8 runners finish first, second and third?', why: 'Different places mean order matters: permutation.' },
{ id: 'co2', tool: 'counting', d: 2, text: 'In how many ways can a committee of 4 be chosen from 15 club members?', why: 'A committee has no order: combination.' },
{ id: 'co3', tool: 'counting', d: 0, text: 'A burrito has 3 tortillas, 5 fillings and 4 salsas to choose from, one of each. How many burritos are possible?', why: 'One choice from each separate list: multiply.' },
{ id: 'co4', tool: 'counting', d: 2, text: 'How many 5-card hands can be dealt from a 52-card deck?', why: 'A hand is a set; order does not matter: combination.' },
{ id: 'co5', tool: 'counting', d: 0, text: 'A password is 3 letters followed by 2 digits, repeats allowed. How many passwords are possible?', why: 'Separate slots, each with its own choices: multiply.' },
/* ---- prob ---- */
{ id: 'pr1', tool: 'prob', d: 4, text: 'In a two-way table of grades by gender, find the probability that a student got an A, given that the student is female.', why: '“Given” restricts to one row: conditional.' },
{ id: 'pr2', tool: 'prob', d: 3, text: '62% of adults own a pet. Find the probability that a randomly chosen adult does not.', why: '“Does not” is the complement: 1 − 0.62.' },
{ id: 'pr3', tool: 'prob', d: 1, text: 'A Venn diagram shows students who play soccer, basketball, or both. Find P(soccer or basketball).', why: 'The circles overlap: add, then subtract the overlap.' },
{ id: 'pr4', tool: 'prob', d: 2, text: 'A fair coin is flipped and a fair die is rolled. Find P(heads and a 6).', why: 'Independent events together: multiply 1/2 · 1/6.' },
{ id: 'pr5', tool: 'prob', d: 0, text: 'A single card is drawn. Find the probability that it is a king or a queen.', why: 'A card cannot be both: add with no overlap.' },
{ id: 'pr6', tool: 'prob', d: 3, not: ['binomial'], text: 'Each of 4 smoke detectors fails 3% of the time, independently. Find the probability that at least one works.', why: '“At least one” is 1 − P(none): the complement.' },
/* ---- binomial ---- */
{ id: 'bi1', tool: 'binomial', d: 1, text: '30% of customers buy dessert. Of the next 12 customers, find the probability that at most 4 buy dessert.', why: 'Fixed n, success/failure, constant p: binomial. “At most 4” is P(X ≤ 4).' },
{ id: 'bi2', tool: 'binomial', d: 2, text: 'A free-throw shooter makes 75% of her shots. In 10 shots, find the probability that she makes at least 8.', why: '“At least 8” is P(X ≥ 8).' },
{ id: 'bi3', tool: 'binomial', d: 0, text: '4% of light bulbs are defective. In a box of 20, find the probability that exactly 2 are defective.', why: '“Exactly 2” is P(X = 2).' },
{ id: 'bi4', tool: 'binomial', d: 1, text: '55% of voters favor a bond. In a sample of 9 voters, find the probability that fewer than 3 favor it.', why: '“Fewer than 3” is P(X ≤ 2).' },
{ id: 'bi5', tool: 'binomial', d: 3, text: 'A quiz has 10 multiple-choice questions with 4 choices each. A student guesses. Find the probability of getting between 2 and 4 right, inclusive.', why: '“Between 2 and 4 inclusive” is P(2 ≤ X ≤ 4).' },
/* ---- expected ---- */
{ id: 'ex1', tool: 'expected', d: 1, text: 'A raffle ticket costs $5. One ticket in 500 wins $1,000. What is the expected value of buying a ticket?', why: 'Subtract the cost from each outcome first: net payouts.' },
{ id: 'ex2', tool: 'expected', d: 0, text: 'A table lists the number of pets per household and their probabilities. Find the mean number of pets.', why: 'Mean of a discrete distribution: Σ x·P(x).' },
{ id: 'ex3', tool: 'expected', d: 2, not: ['binomial'], text: 'A basketball player makes 80% of her free throws. How many should she expect to make in 25 attempts?', why: 'A binomial mean: μ = np = 25(0.80).' },
{ id: 'ex4', tool: 'expected', d: 1, text: 'It costs $2 to play a game. You win $9 if a die shows a 6 and nothing otherwise. What is the game’s expected value?', why: 'There is a cost to play: use net payouts.' },
{ id: 'ex5', tool: 'expected', d: 0, text: 'An insurance company pays $0, $2,000 or $10,000 on a policy with the given probabilities. What is the average payout?', why: 'Σ x·P(x) with the payouts as given.' },
/* ---- uniform ---- */
{ id: 'un1', tool: 'uniform', d: 0, text: 'A train arrives at a random time between 0 and 15 minutes after you reach the platform. Find P(wait less than 6 minutes).', why: 'Every time equally likely: uniform. Area = 6 × 1/15.' },

/* ==================================================================
   WHICH TOOL? RACE — core logic (pure functions, no DOM, tested in Node)
   ================================================================== */
var LETTERS = ['A', 'B', 'C', 'D', 'E'];
function toolById(id) { for (var i = 0; i < TOOLS.length; i++) if (TOOLS[i].id === id) return TOOLS[i]; return null; }
function shuffle(a, rng) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rng() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

/* The tools in the chosen units. */
function enabledTools(units) { return TOOLS.filter(function (t) { return units.indexOf(t.unit) >= 0; }); }

/* A round: n scenarios, spread across the enabled tools as evenly as possible (round robin over a shuffled
   tool order), with no scenario repeated and no tool twice in a row when that can be avoided. */
function buildRound(units, n, rng) {
  var tools = shuffle(enabledTools(units), rng);
  if (!tools.length) return [];
  var pools = {};
  tools.forEach(function (t) { pools[t.id] = shuffle(BANK.filter(function (s) { return s.tool === t.id; }), rng); });
  var total = tools.reduce(function (a, t) { return a + pools[t.id].length; }, 0);
  n = Math.min(n, total);
  var out = [], k = 0;
  while (out.length < n) {
    var t = tools[k % tools.length]; k++;
    if (pools[t.id].length) out.push(pools[t.id].pop());
    if (k > 10000) break;
  }
  /* shuffle, then break up neighbours with the same tool where possible */
  out = shuffle(out, rng);
  for (var i = 1; i < out.length; i++) {
    if (out[i].tool !== out[i - 1].tool) continue;
    for (var j = i + 1; j < out.length; j++) {
      if (out[j].tool !== out[i - 1].tool && (j + 1 >= out.length || out[j + 1].tool !== out[i].tool) && (out[j - 1].tool !== out[i].tool || j - 1 === i)) {
        var tmp = out[i]; out[i] = out[j]; out[j] = tmp; break;
      }
    }
  }
  return out;
}

/* Step 1: the right tool and four others, chosen from the ones students confuse it with first,
   then the rest of its unit, then the other chosen units, then anything. Letters are shuffled. */
function toolOptions(scen, units, rng) {
  var right = toolById(scen.tool), picked = [right.id];
  var avoid = (right.avoid || []).concat(scen.not || []);   /* tools that could also be argued right here */
  var tiers = [right.confuse, TOOLS.filter(function (t) { return t.unit === right.unit; }).map(function (t) { return t.id; }),
    enabledTools(units).map(function (t) { return t.id; }), TOOLS.map(function (t) { return t.id; })];
  tiers.forEach(function (tier) {
    shuffle(tier, rng).forEach(function (id) { if (picked.length < 5 && picked.indexOf(id) < 0 && avoid.indexOf(id) < 0) picked.push(id); });
  });
  var opts = shuffle(picked, rng);
  return { ids: opts, labels: opts.map(function (id) { return toolById(id).label; }), correct: opts.indexOf(right.id) };
}
/* Step 2: the tool's details in their usual order (the same set every time this tool comes up). */
function detailOptions(scen) {
  var t = toolById(scen.tool);
  return { ask: t.ask, labels: t.details.slice(), correct: scen.d };
}

/* Points for one answer: 100 for right, plus up to 50 for speed. */
function points(right, elapsedMs, limitMs) {
  if (!right) return 0;
  var f = limitMs > 0 ? Math.max(0, Math.min(1, 1 - elapsedMs / limitMs)) : 0;
  return 100 + Math.round(50 * f);
}
/* Team scores for one step. teamOf: uid → team index. answers: [{uid, choice, at}] (at in ms).
   Each team gets the average of its members’ points, so team size does not matter; a member who
   did not answer counts as 0. */
function scoreStep(teamOf, answers, correctLetter, openedAt, limitMs, nTeams) {
  var sums = [], sizes = [], rights = [];
  for (var i = 0; i < nTeams; i++) { sums.push(0); sizes.push(0); rights.push(0); }
  Object.keys(teamOf).forEach(function (uid) { var t = teamOf[uid]; if (t >= 0 && t < nTeams) sizes[t]++; });
  answers.forEach(function (a) {
    var t = teamOf[a.uid]; if (t === undefined || t < 0 || t >= nTeams) return;
    var right = a.choice === correctLetter;
    var el = (a.at != null && openedAt != null) ? Math.max(0, a.at - openedAt) : limitMs;
    sums[t] += points(right, el, limitMs);
    if (right) rights[t]++;
  });
  return sums.map(function (s, t) { return { team: t, points: sizes[t] ? Math.round(s / sizes[t]) : 0, right: rights[t], size: sizes[t] }; });
}
/* Team picks are the answers to question 0: letter → team index. */
function teamsFromPicks(picks, nTeams) {
  var teamOf = {};
  picks.forEach(function (p) { var t = LETTERS.indexOf(p.choice); if (t >= 0 && t < nTeams) teamOf[p.uid] = t; });
  return teamOf;
}
function standings(totals, names) {
  return totals.map(function (s, i) { return { team: i, name: names[i], score: s }; })
    .sort(function (a, b) { return b.score - a.score || a.team - b.team; });
}
/* Which scenarios the class found hardest, by percent right over both steps. */
function hardest(log) {
  return log.map(function (e) {
    var tot = e.n1 + e.n2, right = e.r1 + e.r2;
    return { id: e.id, text: e.text, tool: e.tool, detail: e.detail, pct: tot ? Math.round(100 * right / tot) : null, step1: e.n1 ? Math.round(100 * e.r1 / e.n1) : null, step2: e.n2 ? Math.round(100 * e.r2 / e.n2) : null };
  }).sort(function (a, b) { return (a.pct == null ? 101 : a.pct) - (b.pct == null ? 101 : b.pct); });
}
/* Question numbers: 0 is the team pick; scenario i uses 1 + 2i (tool) and 2 + 2i (detail). */
function qNumber(i, step) { return 1 + 2 * i + (step - 1); }
/* ================= CORE LOGIC — END ================= */
</script>

<script type="module">
/* ==================================================================
   Host page. Two modes:
   · live: phones join through race.html and answer on the shared
     Firebase project (same sessions/answers/members shapes as Live Review,
     so the existing security rules work unchanged);
   · projector only: no phones; the teacher ticks which teams got it.
   ================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const SAVE = 'whichToolRaceV1', CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
const DEFAULT_TEAMS = ['Aces', 'Bandits', 'Comets', 'Dynamos', 'Eagles'];
const COLORS = ['var(--t0)', 'var(--t1)', 'var(--t2)', 'var(--t3)', 'var(--t4)'];
const app = $('app');

/* ---------- settings (remembered on this computer) ---------- */
let S = { units: ['u1', 'u2', 'u3', 'u4'], n: 12, nTeams: 4, teams: DEFAULT_TEAMS.slice(), lim1: 20, lim2: 15, mode: 'live' };
try { Object.assign(S, JSON.parse(localStorage.getItem(SAVE) || '{}')); } catch (e) {}
const saveS = () => { try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {} };

/* ---------- game state ---------- */
const G = {
  phase: 'setup',       // setup · lobby · ask · reveal · final
  round: [], i: 0, step: 1,
  cur: null,            // { scen, step, labels, correct, letter, q, ask, toolLabel }
  totals: [], last: [], // running team totals; points from the last step

  timerEnd: 0, timerMs: 0, tick: null, ticks: [],

/* ---------- Firebase (live mode only) ---------- */
const L = { ok: false, F: null, auth: null, db: null, user: null, code: null, ref: null, endedRef: null,
  joined: 0, teamOf: {}, answers: [], openedAt: null, unsubs: [], unsubQ: null, error: '' };

  try {
    const cfg = await import('./live-config.js');
    const base = `https://www.gstatic.com/firebasejs/${cfg.FIREBASE_VERSION}/`;
    const [a, au, fs] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
    L.F = { ...au, ...fs };
    const fa = a.initializeApp(cfg.firebaseConfig);
    L.auth = au.getAuth(fa); L.db = fs.getFirestore(fa);

    L.ok = true;
  } catch (e) { L.ok = false; L.error = 'Phones are unavailable here (this computer could not reach Firebase). Projector-only mode still works.'; }

}
function explain(e) {
  if (e && e.code === 'permission-denied') return 'Firebase refused the request. Check that your Google email is in the security rules and that the rules are published.';
  if (e && e.code === 'auth/popup-blocked') return 'The browser blocked the sign-in window. Allow pop-ups for this site and try again.';
  if (e && e.code === 'auth/unauthorized-domain') return 'This website is not on the Authorized domains list in Firebase.';
  if (e && (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request')) return 'Sign-in was cancelled.';

}
const setMsg = t => { $('msg').textContent = t || ''; };
const toMs = t => (t && typeof t.toMillis === 'function') ? t.toMillis() : (typeof t === 'number' ? t : null);

/* Create the session doc, then listen for who joined and which team each phone picked (question 0). */
async function liveStart() {
  const F = L.F;
  if (!L.user) { try { L.user = (await F.signInWithPopup(L.auth, new F.GoogleAuthProvider())).user; } catch (e) { setMsg(explain(e)); return false; } }

    let code = null;

      let c = ''; for (let k = 0; k < 4; k++) c += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];

}

  const F = L.F;

    await F.updateDoc(L.ref, { q, asked: q + 1, open: true, qtext: text, opts, label, limit: limitSec, openedAt: F.serverTimestamp(), reveal: null });

}

    await F.deleteDoc(ref); L.endedRef = null;
    m.textContent = 'Deleted from Firebase. This summary stays until you leave the page.';

}

    '<div class="row"><label for="l2">Step 2 timer (s)</label><input type="number" id="l2" min="5" max="90" value="' + S.lim2 + '"></div></fieldset></div>';
  h += '<div class="card"><fieldset><legend>Teams</legend><div class="row"><label for="nT">Number of teams</label><input type="number" id="nT" min="2" max="5" value="' + S.nTeams + '"></div>';
  for (let i = 0; i < 5; i++) h += '<div class="teamin' + (i < S.nTeams ? '' : ' hidden') + '"><span class="sw" style="background:' + COLORS[i] + '">' + LETTERS[i] + '</span><input type="text" maxlength="18" data-team="' + i + '" value="' + esc(S.teams[i] || DEFAULT_TEAMS[i]) + '" aria-label="Team ' + LETTERS[i] + ' name"></div>';
  h += '</fieldset><fieldset><legend>How students answer</legend>' +
    '<label class="chk"><input type="radio" name="mode" value="live"' + (live() ? ' checked' : '') + (L.ok ? '' : ' disabled') + '><span>On phones<small>Students scan a QR code, pick a team and answer on race.html. You sign in with Google.' + (L.ok ? '' : ' <b>Not available on this computer right now.</b>') + '</small></span></label>' +
    '<label class="chk"><input type="radio" name="mode" value="offline"' + (!live() ? ' checked' : '') + '><span>Projector only<small>Teams answer on whiteboards or by holding up letters; you tick which teams got it. No speed bonus.</small></span></label>' +
    '</fieldset><div class="btnrow"><button class="btn big" id="go">' + (live() ? (L.user ? 'Open the room' : 'Sign in and open the room') : 'Start the race') + '</button></div>' +
    (L.error ? '<p class="note">' + esc(L.error) + '</p>' : '') + '</div></div>';
  app.innerHTML = h;
  const read = () => {
    S.units = [...app.querySelectorAll('[data-unit]')].filter(x => x.checked).map(x => x.dataset.unit);
    S.n = clampInt($('nS').value, 3, 40, 12); S.lim1 = clampInt($('l1').value, 5, 90, 20); S.lim2 = clampInt($('l2').value, 5, 90, 15);
    S.nTeams = clampInt($('nT').value, 2, 5, 4);
    app.querySelectorAll('[data-team]').forEach(x => S.teams[+x.dataset.team] = x.value.trim());
    const m = app.querySelector('[name=mode]:checked'); if (m) S.mode = m.value;
    saveS();
  };
  app.querySelectorAll('input').forEach(x => x.addEventListener('change', () => { if (!x.isConnected) return; read(); if (x.id === 'nT' || x.name === 'mode') setTimeout(renderSetup, 0); }));
  $('go').onclick = async () => {
    read(); setMsg('');
    if (!S.units.length) { setMsg('Pick at least one unit.'); return; }
    G.round = buildRound(S.units, S.n, Math.random);
    G.i = 0; G.step = 1; G.totals = teamNames().map(() => 0); G.last = G.totals.slice(); G.log = [];
    if (live()) {
      $('go').disabled = true;
      if (!(await liveStart())) { $('go').disabled = false; return; }
      G.phase = 'lobby';
    } else { G.phase = 'ask'; await ask(); return; }
    render();
  };
}
const clampInt = (v, lo, hi, d) => { const n = parseInt(v, 10); return isNaN(n) ? d : Math.max(lo, Math.min(hi, n)); };

function renderLobby() {
  const url = new URL('race.html?room=' + L.code, location.href).href;
  app.innerHTML = '<div class="card lobby"><div><div class="qr" id="qr" aria-hidden="true"></div></div><div>' +
    '<p class="step">Scan, or go to the address and type the code</p><p class="code" aria-label="Room code ' + esc(L.code.split('').join(' ')) + '">' + esc(L.code) + '</p>' +
    '<p class="url">' + esc(url.replace(/^https?:\/\//, '')) + '</p><h3>Pick a team on your phone</h3><div class="teamcounts" id="tcs"></div>' +
    '<div class="btnrow"><button class="btn big" id="startRace">Start the race</button><button class="btn quiet" id="cancel">Back to setup</button></div>' +
    '<p class="kbd">Teams lock when the race starts. Late arrivals can still join: use “Open team pick” between questions.</p></div></div>';
  try { new window.QRCode($('qr'), { text: url, width: 260, height: 260, correctLevel: window.QRCode.CorrectLevel.M }); } catch (e) { $('qr').textContent = ''; }
  drawLobbyCounts();
  $('startRace').onclick = () => { G.phase = 'ask'; ask(); };
  $('cancel').onclick = async () => { await liveEnd(); await liveDeleteQuiet(); G.phase = 'setup'; render(); };
}
async function liveDeleteQuiet() { const m = document.createElement('span'); m.id = 'delMsg'; m.className = 'hidden'; document.body.appendChild(m); await liveDelete(); m.remove(); }
function drawLobbyCounts() {
  const el = $('tcs'); if (!el) return;
  const n = teamNames().map(() => 0); Object.values(L.teamOf).forEach(t => n[t]++);
  el.innerHTML = teamNames().map((t, i) => '<div class="tc"><span class="ltr" style="background:' + COLORS[i] + '">' + LETTERS[i] + '</span><span>' + esc(t) + '</span><span class="n">' + n[i] + '</span></div>').join('') +
    '<p class="lede" style="margin:4px 0 0">' + L.joined + ' joined · ' + onTeams() + ' picked a team</p>';
}

/* Build the current step's question and open it. */
async function ask() {
  const scen = G.round[G.i], step = G.step, tool = toolById(scen.tool);
  const o = step === 1 ? toolOptions(scen, S.units, Math.random) : detailOptions(scen);
  G.cur = { scen, step, labels: o.labels, correct: o.correct, letter: LETTERS[o.correct], q: qNumber(G.i, step), ask: step === 1 ? 'Which tool do you need?' : o.ask, toolLabel: tool.label };
  G.offRight = teamNames().map(() => false);
  G.phase = 'ask';
  G.timerMs = 1000 * (step === 1 ? S.lim1 : S.lim2);
  render();
  if (live()) {
    G.cur.label = 'Scenario ' + (G.i + 1) + ' of ' + G.round.length + ' · Step ' + step + (step === 2 ? ' · ' + tool.label : '');
    G.cur.text = scen.text + '\n\n' + G.cur.ask;
    await liveAsk(G.cur.q, G.cur.text, G.cur.labels, G.cur.label, G.timerMs / 1000);
  }
  G.timerEnd = Date.now() + G.timerMs;
  clearInterval(G.tick); G.tick = setInterval(tickTimer, 250); tickTimer();
}
function tickTimer() {
  if (G.phase !== 'ask') { clearInterval(G.tick); return; }
  const left = Math.max(0, G.timerEnd - Date.now()), el = $('tbar'), tx = $('tleft');
  if (el) { el.firstChild.style.width = (100 * left / G.timerMs) + '%'; el.classList.toggle('low', left < 5000); }
  if (tx) tx.textContent = Math.ceil(left / 1000) + ' s';
  if (left <= 0) closeStep();
}
function drawAnswered() {
  const el = $('answered'); if (!el) return;
  const team = L.answers.filter(a => L.teamOf[a.uid] !== undefined).length, need = onTeams();
  el.textContent = team + ' of ' + need + ' answered';
  if (need > 0 && team >= need && G.timerEnd - Date.now() > 1500) G.timerEnd = Date.now() + 1500;   // everyone is in: close soon
}

function questionHtml(reveal) {
  const c = G.cur, five = c.labels.length === 5;
  let counts = null, total = 0;
  if (reveal && live()) { counts = {}; L.answers.forEach(a => { if (L.teamOf[a.uid] !== undefined) { counts[a.choice] = (counts[a.choice] || 0) + 1; total++; } }); }
  let h = '<div class="qhead"><span class="step">Scenario ' + (G.i + 1) + ' of ' + G.round.length + ' · <b>Step ' + c.step + ' of 2</b></span></div>' +
    '<p class="scen">' + esc(c.scen.text) + '</p>' + (c.step === 2 ? '<span class="toolchip">Tool: ' + esc(c.toolLabel) + '</span>' : '') +
    '<p class="ask">' + esc(c.ask) + '</p><div class="opts' + (five ? ' five' : '') + '">';
  c.labels.forEach((t, i) => {
    const L_ = LETTERS[i], right = reveal && i === c.correct, n = counts ? (counts[L_] || 0) : null, pct = counts && total ? Math.round(100 * n / total) : 0;
    h += '<div class="opt' + (right ? ' right' : reveal ? ' dim' : '') + '">' + (counts ? '<span class="fill" style="width:' + pct + '%"></span>' : '') +
      '<span class="ltr">' + L_ + '</span><span class="txt">' + esc(t) + '</span>' + (counts ? '<span class="cnt">' + n + '</span>' : '') + '</div>';
  });
  return h + '</div>';
}
function renderAsk() {
  app.innerHTML = '<div class="stage"><div class="card">' + questionHtml(false) +
    '<div class="timer" id="tbar"><i></i></div><div class="tline"><span id="answered">' + (live() ? '' : 'Teams: write your letter') + '</span><b id="tleft"></b></div>' +
    '<div class="btnrow"><button class="btn" id="closeNow">Close and reveal</button><button class="btn quiet" id="addTime">+10 s</button></div>' +
    '<p class="kbd">Keyboard: Enter or → closes and reveals.</p></div>' + boardHtml(false) + '</div>';
  $('closeNow').onclick = closeStep;
  $('addTime').onclick = () => { G.timerEnd += 10000; G.timerMs += 10000; };
  if (live()) drawAnswered();
}

/* Close the step, wait a moment for the last answers to arrive, then score it. */
let closing = false;
async function closeStep() {
  if (G.phase !== 'ask' || closing) return;
  closing = true; clearInterval(G.tick);
  if (live()) { await liveUpdate({ open: false }); await new Promise(r => setTimeout(r, 900)); }
  const c = G.cur, n = S.nTeams;
  let pts = teamNames().map(() => 0), nAns = 0, nRight = 0;
  if (live()) {
    const sc = scoreStep(L.teamOf, L.answers, c.letter, L.openedAt, G.timerMs, n);
    pts = sc.map(x => x.points);
    L.answers.forEach(a => { if (L.teamOf[a.uid] !== undefined) { nAns++; if (a.choice === c.letter) nRight++; } });
  }
  G.last = pts; pts.forEach((p, t) => G.totals[t] += p);
  logStep(nAns, nRight);
  G.phase = 'reveal'; closing = false;
  render();
  if (live()) liveUpdate({ reveal: revealData(), board: boardData() });
}
const revealData = () => ({ q: G.cur.q, letter: G.cur.letter, note: G.cur.step === 2 ? G.cur.scen.why : 'The tool: ' + G.cur.toolLabel });
function logStep(nAns, nRight) {
  const c = G.cur;
  let e = G.log[G.i];
  if (!e) e = G.log[G.i] = { id: c.scen.id, text: c.scen.text, tool: c.toolLabel, detail: toolById(c.scen.tool).details[c.scen.d], n1: 0, r1: 0, n2: 0, r2: 0 };
  e['n' + c.step] = nAns; e['r' + c.step] = nRight;
}
/* Projector mode: ticking a team updates its points for this step right away. */
function setOffline(t, on) {
  if (G.offRight[t] === on) return;
  G.offRight[t] = on;
  const d = on ? 100 : -100; G.totals[t] += d; G.last[t] += d;
  const e = G.log[G.i]; e['n' + G.cur.step] = S.nTeams; e['r' + G.cur.step] = G.offRight.filter(Boolean).length;
  $('boardBox').outerHTML = boardHtml(true);
  if (live()) liveUpdate({ board: boardData() });
}

function renderReveal() {
  const c = G.cur, lastStep = G.i === G.round.length - 1 && c.step === 2;
  let h = '<div class="stage"><div class="card">' + questionHtml(true);
  if (c.step === 2) h += '<p class="why"><b>Why</b>' + esc(c.scen.why) + '</p>';
  else h += '<p class="why"><b>The tool</b>' + esc(c.toolLabel) + '</p>';
  if (!live()) {
    h += '<h3>Which teams got it?</h3><div class="offl">' + teamNames().map((t, i) => '<label><input type="checkbox" data-off="' + i + '"' + (G.offRight[i] ? ' checked' : '') + '><span style="color:' + COLORS[i] + ';font-weight:700">' + LETTERS[i] + '</span> ' + esc(t) + '</label>').join('') + '</div>';
  }
  h += '<div class="btnrow"><button class="btn big" id="next">' + (lastStep ? 'Final results' : c.step === 1 ? 'Step 2' : 'Next scenario') + '</button>' +
    (live() ? '<button class="btn quiet" id="reopen">Open team pick</button>' : '') + '<button class="btn quiet" id="endNow">End race now</button></div>' +
    '<p class="kbd">Keyboard: Enter or → goes on.</p></div>' + boardHtml(true) + '</div>';
  app.innerHTML = h;
  app.querySelectorAll('[data-off]').forEach(x => x.onchange = () => setOffline(+x.dataset.off, x.checked));
  $('next').onclick = next;
  $('endNow').onclick = finish;
  if ($('reopen')) $('reopen').onclick = reopenTeams;
}
function boardHtml(showGain) {
  const rows = standings(G.totals, teamNames()), top = Math.max(1, ...G.totals);
  return '<aside class="card board" id="boardBox"><h3>Leaderboard</h3>' + rows.map((r, k) =>
    '<div class="brow"><span class="pl">' + (k + 1) + '</span><span class="nm" style="color:' + COLORS[r.team] + '">' + esc(r.name) + '</span><span class="sc">' + r.score +
    (showGain && G.last[r.team] ? '<span class="gain">+' + G.last[r.team] + '</span>' : '') + '</span>' +
    '<span class="bar"><i style="width:' + (100 * r.score / top) + '%;background:' + COLORS[r.team] + '"></i></span></div>').join('') + '</aside>';
}
function next() {
  if (G.phase !== 'reveal') return;
  if (G.cur.step === 1) { G.step = 2; ask(); return; }
  if (G.i >= G.round.length - 1) { finish(); return; }
  G.i++; G.step = 1; ask();
}
/* Late arrivals: put the team pick back on the phones; the board stays on the projector. */
async function reopenTeams() {
  await liveUpdate({ q: 0, open: true, qtext: 'Pick your team', opts: teamNames(), label: 'Team pick', reveal: null, limit: 0 });
  const b = $('reopen');
  b.textContent = 'Close team pick'; b.onclick = async () => {
    await liveUpdate({ q: G.cur.q, open: false, qtext: G.cur.text, opts: G.cur.labels, label: G.cur.label, limit: G.timerMs / 1000, reveal: revealData(), board: boardData() });
    renderReveal();
  };
}

async function finish() {
  clearInterval(G.tick);
  G.phase = 'final';
  if (live()) await liveEnd();
  render();
}
function renderFinal() {
  const rows = standings(G.totals, teamNames()), order = [1, 0, 2].filter(k => rows[k]);
  const hi = [150, 200, 110];
  let h = '<div class="card"><h2>Final results</h2><div class="podium">' + order.map(k => {
    const r = rows[k]; return '<div class="pod"><div class="nm" style="color:' + COLORS[r.team] + '">' + esc(r.name) + '</div><div class="sc">' + r.score + ' points</div>' +
      '<div class="blk" style="height:' + hi[k] + 'px;background:' + COLORS[r.team] + '">' + (k + 1) + '</div></div>';
  }).join('') + '</div>';
  if (rows.length > 3) h += '<p class="lede" style="text-align:center">' + rows.slice(3).map((r, k) => (k + 4) + '. ' + esc(r.name) + ' (' + r.score + ')').join(' · ') + '</p>';
  const hard = hardest(G.log).slice(0, 6);
  h += '<h3>Worth another look</h3><p class="lede">The scenarios the class found hardest, with the percent of ' + (live() ? 'students' : 'teams') + ' who got each step.</p>' +
    '<table><thead><tr><th>Scenario</th><th>Tool → version</th><th>Step 1</th><th>Step 2</th></tr></thead><tbody>' +
    hard.map(r => '<tr><td>' + esc(r.text) + '</td><td>' + esc(r.tool) + ' → ' + esc(r.detail) + '</td><td class="num">' + (r.step1 == null ? '–' : r.step1 + '%') + '</td><td class="num">' + (r.step2 == null ? '–' : r.step2 + '%') + '</td></tr>').join('') +
    '</tbody></table><div class="btnrow"><button class="btn" id="csv">Download results</button>' +
    (L.endedRef ? '<button class="btn quiet" id="del">Delete session data</button>' : '') +
    '<button class="btn quiet" id="again">New race</button><span id="delMsg" role="status" class="lede" style="margin:0"></span></div></div>';
  app.innerHTML = h;
  $('csv').onclick = downloadCsv;
  if ($('del')) $('del').onclick = liveDelete;
  $('again').onclick = () => { G.phase = 'setup'; G.round = []; L.code = null; render(); };
}
function downloadCsv() {
  const cell = v => { const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const lines = [['Order', 'Scenario', 'Tool', 'Version', 'Step 1 answered', 'Step 1 right', 'Step 2 answered', 'Step 2 right'].join(',')]
    .concat(G.log.map((e, i) => [i + 1, e.text, e.tool, e.detail, e.n1, e.r1, e.n2, e.r2].map(cell).join(',')))
    .concat(['', 'Team,Score'], standings(G.totals, teamNames()).map(r => [r.name, r.score].map(cell).join(',')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' }));
  a.download = 'which-tool-race' + (L.code ? '-' + L.code : '') + '.csv';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* Clicker or keyboard: Enter / → / PageDown moves on. */
document.addEventListener('keydown', e => {
  if (!['Enter', 'ArrowRight', 'PageDown', ' '].includes(e.key)) return;
  const t = e.target;
  if (t.matches && t.matches('input[type=text],input[type=number],textarea,select')) return;     // typing
  if (t.matches && t.matches('button,input[type=checkbox],input[type=radio]') && (e.key === 'Enter' || e.key === ' ')) return;   // the control's own action
  if (G.phase === 'ask') { e.preventDefault(); closeStep(); }
  else if (G.phase === 'reveal') { e.preventDefault(); next(); }
});
window.addEventListener('beforeunload', e => { if (G.phase === 'ask' || G.phase === 'reveal') { e.preventDefault(); e.returnValue = ''; } });

window.RACE = { G, S, L };   /* read-only hook for testing */
render();
liveLoad();
</script>
</body>
</html>
